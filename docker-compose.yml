services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirelab
      POSTGRES_PASSWORD: hirelab
      POSTGRES_DB: hirelab
    ports:
      - "5432:5432"
    volumes:
      - hirelab_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hirelab_redis_data:/data
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: "sk-litellm-change-me"
    ports:
      - "4000:4000"

volumes:
  hirelab_postgres_data:
  hirelab_redis_data:
