services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirelab
      POSTGRES_PASSWORD: hirelab
      POSTGRES_DB: hirelab
    ports:
      - "5432:5432"
    volumes:
      - hirelab_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hirelab_redis_data:/data
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: "sk-litellm-change-me"
    ports:
      - "4000:4000"

  # Optional local S3-compatible storage for trying STORAGE_DRIVER=s3 (not started by a plain `docker compose up`):
  #   docker compose --profile s3 up -d minio minio-init
  # then set S3_ENDPOINT=http://localhost:9000  S3_BUCKET=hirelab-uploads  S3_ACCESS_KEY_ID=hirelab
  #          S3_SECRET_ACCESS_KEY=hirelab-secret  STORAGE_DRIVER=s3   (console: http://localhost:9001)
  minio:
    profiles: ["s3"]
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hirelab
      MINIO_ROOT_PASSWORD: hirelab-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hirelab_minio_data:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 hirelab hirelab-secret; do sleep 1; done;
      mc mb --ignore-existing local/hirelab-uploads"

volumes:
  hirelab_postgres_data:
  hirelab_redis_data:
  hirelab_minio_data:
