  function computeOverview(positions, perPosting){
    const counts = { OPEN: 0, PAUSED: 0, CLOSED: 0 };
    positions.forEach((p) => { counts[p.status] = (counts[p.status] || 0) + 1; });

    let allApplications = [];
    perPosting.forEach(({ posId, posTitle, posStatus, apps }) => {
      apps.forEach((a) => allApplications.push({ ...a, posId, posTitle, posStatus }));
    });

    // Every metric below is derived from this same application list so the
    // funnel stages always partition exactly into the total, and every
    // number on the page is something the employer can click through and
    // count for themselves — no ratio can silently exceed 100%.
    const totalApplicants = allApplications.length;
    const processingCount = allApplications.filter((a) => a.status === "PROCESSING").length;
    const reviewedCount = allApplications.filter((a) => a.status === "REVIEWED").length;
    const qualifiedCandidates = allApplications.filter((a) => a.status === "QUALIFIED");
    const totalQualified = qualifiedCandidates.length;
    const avgQualifiedMatch = qualifiedCandidates.length
      ? Math.round(qualifiedCandidates.reduce((s, a) => s + a.matchPct, 0) / qualifiedCandidates.length) : 0;
    const qualifyRate = totalApplicants ? Math.round((totalQualified / totalApplicants) * 100) : 0;

    // Top match platform-wide, plus the next couple in line — a shortlist,
    // not just a single spotlight — scoped to open roles since paused/closed
    // postings aren't actively hiring.
    const openApplications = allApplications.filter((a) => a.posStatus === "OPEN");
    const openQualified = openApplications.filter((a) => a.status === "QUALIFIED").length;
    const rankedOpen = [...openApplications].sort((a, b) => b.matchPct - a.matchPct);
    const topCandidate = rankedOpen[0] || null;
    const runnersUp = rankedOpen.slice(1, 3);

    // Fresh signal: how much of this week's activity is actually panning out.
    // Bucketed into 7-day windows so the "this week" count always matches
    // the rightmost bar of the screening-volume trend chart below.
    const weeklyBuckets = [0, 0, 0, 0, 0, 0]; // [0]=this week (0-6d) ... [5]=5 weeks ago (35-41d)
    allApplications.forEach((a) => {
      const wk = Math.min(5, Math.floor(a.appliedDaysAgo / 7));
      weeklyBuckets[wk] += 1;
    });
    const newThisWeek = weeklyBuckets[0];
    const newLastWeek = weeklyBuckets[1];
    const weeklyTrend = [...weeklyBuckets].reverse(); // oldest (-5w) -> newest (Now), for the chart

    // "What HireLab handled for you" this month: every application gets
    // automatically screened (resume + GitHub cross-check), and each one
    // saves roughly the manual review time a recruiter would otherwise
    // spend on a first pass (~45 minutes).
    const screenedCount = totalApplicants;
    const hoursSaved = Math.round((totalApplicants * 45) / 60);

    // Evidence-based hiring's signature metric: of the candidates who cleared
    // the bar, how many backed it up with a shipped, working project.
    const shippedQualified = qualifiedCandidates.filter((a) => a.shipped).length;
    const shippedRate = qualifiedCandidates.length ? Math.round((shippedQualified / qualifiedCandidates.length) * 100) : 0;

    // Skill signal: the single most common top-skill among qualified
    // candidates org-wide — a small, honest insight instead of a generic tip.
    const skillCounts = {};
    qualifiedCandidates.forEach((a) => (a.skills || []).forEach((s) => { skillCounts[s] = (skillCounts[s] || 0) + 1; }));
    let topSkill = null, topSkillCount = 0;
    Object.entries(skillCounts).forEach(([skill, count]) => { if (count > topSkillCount) { topSkill = skill; topSkillCount = count; } });
    const topSkillPct = qualifiedCandidates.length ? Math.round((topSkillCount / qualifiedCandidates.length) * 100) : 0;

    // Roles that have gone quiet: open, live a while, and nobody HireLab has
    // actually evaluated as qualified yet — the thing an employer would
    // otherwise only notice by digging into every posting individually.
    const applicantsByPosition = {};
    const qualifiedByPosition = {};
    allApplications.forEach((a) => {
      applicantsByPosition[a.posId] = (applicantsByPosition[a.posId] || 0) + 1;
      if (a.status === "QUALIFIED") qualifiedByPosition[a.posId] = (qualifiedByPosition[a.posId] || 0) + 1;
    });
    const needsAttention = positions
      .filter((p) => p.status === "OPEN" && p.daysAgo >= 5 && !qualifiedByPosition[p.id])
      .map((p) => ({ id: p.id, title: p.title, location: p.location, daysAgo: p.daysAgo, applicantsSeen: applicantsByPosition[p.id] || 0 }))
      .sort((a, b) => b.daysAgo - a.daysAgo);

    const recentActivity = [...allApplications].sort((a, b) => a.appliedDaysAgo - b.appliedDaysAgo).slice(0, 6);

    return {
      totalPostings: positions.length, statusCounts: counts,
      totalApplicants, totalQualified, openQualified, processingCount, reviewedCount,
      avgQualifiedMatch, qualifyRate, newThisWeek, newLastWeek, weeklyTrend, shippedRate, topSkill, topSkillPct,
      screenedCount, hoursSaved,
      topCandidate, runnersUp, needsAttention, recentActivity,
    };
  }

  // The most recently created posting — a quick "how's my newest role
  // doing" glance, surfaced on mobile above the top candidate card.
  function computeLatestPosting(positions){
    if (!positions.length) return null;
    return positions.reduce((newest, p) => (!newest || p.daysAgo < newest.daysAgo) ? p : newest, null);
  }

  async function openPosition(id){
    state.view = "position"; state.positionId = id; state.candidateId = null;
    if (state.filterPositionId !== id) {
      // Filters, search and page belong to the position they were set on: don't carry them into another one.
      state.filters = { topN: state.filters.topN, techStack: [], minConsistency: 0, minCollaboration: 0, shippedOnly: false, page: 1 };
      state.candidateSearch = ""; state.techOptions = []; state.filterDraft = null; state.filterPanelOpen = false; state.topNPanelOpen = false;
      state.filterPositionId = id;
    }
    state.loading = true; state.loadError = null; render();
    try {
      const [posRes, appsRes] = await Promise.all([API.getPosition(id), API.getApplications(id, filterParams())]);
      const idx = POSITIONS.findIndex((p) => p.id === id);
      const adapted = adaptPositionDetail(posRes.position);
      if (idx >= 0) POSITIONS[idx] = { ...POSITIONS[idx], ...adapted }; else POSITIONS.push(adapted);
      POSITIONS = sortPositionsForDisplay(POSITIONS); // status may have just changed (e.g. Pause/Close), which moves its group
      currentCandidateRows = (appsRes.applications || []).map(adaptCandidateRow);
      if (Array.isArray(appsRes.techOptions)) state.techOptions = appsRes.techOptions;
      state.loading = false; render();
    } catch (err) {
      if (err.message === "unauthorized") return;
      state.loading = false; state.loadError = err.message; render();
    }
  }

  function openEditPosition(){
    const p = getPosition();
    if (!p) return;
    state.editingPositionId = p.id;
    state.newPosDraft = {
      title: p.title, location: p.location, employmentType: p.employmentType,
      status: statusLabel(p.status), description: p.description, chips: p.chips.slice(),
      endDate: p.endDate || "",
      ...Object.assign({}, ...NP_EXTRA_FIELDS.map((f) => npFieldInit(f, p[f.key]))),
    };
    state.view = "new-position";
    render();
  }

  function filterParams(){
    const p = {};
    // Always ask for every match. "N per page" is how many rows are SHOWN at once (paged client-side); sending it as
    // the limit made the server drop everyone beyond the first page, so pagination never had a second page.
    p.limit = "all";
    if (state.filters.techStack.length) p.tech = state.filters.techStack.join(",");
    if (state.filters.minConsistency) p.minConsistency = state.filters.minConsistency;
    if (state.filters.minCollaboration) p.minCollaboration = state.filters.minCollaboration;
    if (state.filters.shippedOnly) p.shippedOnly = "true";
    return p;
  }

  function cloneFilters(f){ return { ...f, techStack: f.techStack.slice() }; }
  // The filter panel edits a draft; closing it any way other than Apply discards the draft, so the chips, the
  // badge and the list always describe the same (applied) filters.
  function closeFilterPanel(){ state.filterPanelOpen = false; state.filterDraft = null; }

  let candidateListRequestSeq = 0;
  async function refreshCandidateList(){
    const seq = ++candidateListRequestSeq; // a slower, older response must never overwrite a newer one
    const listEl = document.querySelector(".candidate-list");
    if (listEl) { listEl.style.opacity = "0.45"; listEl.style.pointerEvents = "none"; listEl.style.transition = "opacity .15s ease"; }
    try {
      const appsRes = await API.getApplications(state.positionId, filterParams());
      if (seq !== candidateListRequestSeq) return;
      currentCandidateRows = (appsRes.applications || []).map(adaptCandidateRow);
      if (Array.isArray(appsRes.techOptions)) state.techOptions = appsRes.techOptions;
      render();
      // Bring the (new) top of the list into view if the person had scrolled past it.
      const anchor = document.querySelector(".toolbar") || document.getElementById("candidate-rows-wrap");
      if (anchor) {
        const top = anchor.getBoundingClientRect().top;
        if (top < 0 || top > window.innerHeight * 0.6) anchor.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    } catch (err) {
      if (seq !== candidateListRequestSeq) return;
      if (err.message === "unauthorized") { if (listEl) { listEl.style.opacity = ""; listEl.style.pointerEvents = ""; } return; }
      if (!isApiKeyError(err)) showToast("Couldn't refresh the candidate list. Showing the last loaded results.", "error");
      if (listEl) { listEl.style.opacity = ""; listEl.style.pointerEvents = ""; }
    }
  }

  async function openCandidate(id){
    state.view = "candidate"; state.candidateId = id;
    if (candidateDetailCache[id]) { render(); return; }
    state.loading = true; render();
    try {
      const [full, notesRes] = await Promise.all([API.getApplication(id), API.getNotes(id)]);
      candidateDetailCache[id] = adaptCandidateDetail(full);
      state.candidateNotes[id] = notesRes.notes || [];
      state.loading = false; render();
    } catch (err) {
      if (err.message === "unauthorized") return;
      state.loading = false; state.loadError = err.message; render();
    }
  }

  // Each settings section is fetched once, on first visit — cached after
  // that like every other view in this app (candidateDetailCache, etc.),
  // not re-fetched on every tab click. "api-keys" isn't listed here since
  // it's loaded once at bootstrap (see Init, below) because it also gates
  // "New position" before Settings is ever opened.
  const settingsLoaded = { team: false, personal: false, organization: false, notifications: false };
  async function loadSettingsSection(id){
    if (settingsLoaded[id]) return;
    try {
      if (id === "team") {
        const data = await API.getTeam();
        state.orgTeam = data.members || [];
        state.orgPendingInvites = data.pendingInvites || [];
        settingsLoaded.team = true;
      } else if (id === "personal") {
        const me = await API.getMe();
        state.personal = { name: me.name, email: me.email, phone: me.phone || "" };
        settingsLoaded.personal = true;
      } else if (id === "organization") {
        const org = await API.getOrganization();
        state.orgName = org.name;
        state.orgProfile = {
          website: org.website || "", industry: org.industry || "",
          contactEmail: org.contactEmail || "", contactPhone: org.contactPhone || "",
          description: org.description || "",
        };
        settingsLoaded.organization = true;
      } else if (id === "notifications") {
        state.notificationPrefs = await API.getNotificationPreferences();
        settingsLoaded.notifications = true;
      } else {
        return;
      }
      render();
    } catch (err) {
      if (err.message === "unauthorized") return;
      showToast(err.message || "Failed to load this settings section.", "error");
    }
  }

  function animateIn(){
    // Overview: cards rise in one after another; stat tiles follow a beat behind
    document.querySelectorAll(".ov2-col, .ov2-mobile-stack").forEach((col) => {
      [...col.children].forEach((el, i) => { el.style.animationDelay = (i * 0.08) + "s"; });
    });
    document.querySelectorAll(".ov2-stat-grid").forEach((g) => {
      [...g.children].forEach((el, i) => { el.style.animationDelay = (i * 0.05) + "s"; });
    });
    document.querySelectorAll(".positions-grid .position-card, .candidate-list .candidate-row").forEach((el, i) => {
      el.style.animationDelay = Math.min(i * 0.035, 0.4) + "s";
    });
    document.querySelectorAll("[data-count]").forEach((el) => {
      const target = parseInt(el.getAttribute("data-count"), 10) || 0;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = target; return; }
      let current = 0;
      const step = Math.max(1, Math.ceil(target / 30));
      const timer = setInterval(() => {
        current += step;
        if (current >= target) { current = target; clearInterval(timer); }
        el.textContent = current;
      }, 20);
    });
    // Fill bars (funnel stages, comp-block segments, pipeline health) are
    // rendered at width:0 with the real value stashed in data-fill, so the
    // already-defined `transition: width` rules actually have a "from" state
    // to animate out of instead of just appearing at full size instantly.
    // (prefers-reduced-motion already strips the transition globally, so no
    // extra branching is needed here — the end state is the same either way.)
    const fillEls = document.querySelectorAll("[data-fill]");
    if (fillEls.length) {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          fillEls.forEach((el) => { el.style.width = el.getAttribute("data-fill") + "%"; });
        });
      });
    }
  }

  // Sidebar

  // ---- Sidebar expand / collapse (desktop; remembered between visits) ----
  let sidebarCollapsed = (() => { try { return localStorage.getItem("hl-sidebar-collapsed") === "1"; } catch (e) { return false; } })();
  function applySidebarState(){
    const sb = document.getElementById("sidebar");
    if (sb) sb.classList.toggle("collapsed", sidebarCollapsed);
    const t = document.getElementById("sidebar-toggle");
    if (t) t.setAttribute("aria-expanded", String(!sidebarCollapsed));
  }
  function bindSidebarChrome(){
    const tip = document.getElementById("rail-tip");
    if (tip) tip.classList.remove("show");
    document.querySelectorAll("#sidebar .rail-item").forEach((b) => {
      const show = () => {
        if (!sidebarCollapsed || !tip) return;
        const r = b.getBoundingClientRect();
        tip.textContent = b.dataset.tip; tip.style.top = (r.top + r.height / 2) + "px"; tip.style.left = (r.right + 14) + "px"; tip.classList.add("show");
      };
      const hide = () => { if (tip) tip.classList.remove("show"); };
      b.addEventListener("mouseenter", show); b.addEventListener("focus", show);
      b.addEventListener("mouseleave", hide); b.addEventListener("blur", hide);
    });
    applySidebarState();
  }
  applySidebarState(); // restore saved state before first paint (no animation on load)
  document.getElementById("sidebar-toggle").addEventListener("click", () => { // header icon; static markup, so bound once
    sidebarCollapsed = !sidebarCollapsed;
    try { localStorage.setItem("hl-sidebar-collapsed", sidebarCollapsed ? "1" : "0"); } catch (e) {}
    const tip = document.getElementById("rail-tip"); if (tip) tip.classList.remove("show");
    applySidebarState(); // class toggle only (no re-render) so the width/label transitions animate
  });

  function renderSidebar(){
    const navEl = document.getElementById("sidebar-nav");
    const footEl = document.getElementById("sidebar-footer");
    if (!navEl || !footEl) return;
    const postingsActive = ["positions", "position", "candidate", "new-position", "link-share"].includes(state.view);
    const unreadCount = (state.overviewData?.recentActivity || []).filter((a) => !state.notificationsRead[a.id]).length;
    const navBtn = (active, id, tip, icon, badge) => `<button class="rail-item ${active ? "active" : ""}" id="${id}" data-tip="${tip}"><i class="ph${active ? "-fill" : ""} ph-${icon}"></i><span class="rail-label">${tip}</span>${badge ? `<span class="rail-count">${badge > 9 ? "9+" : badge}</span><span class="rail-item-dot"></span>` : ""}</button>`;
    navEl.innerHTML = `
      ${navBtn(state.view === "overview", "nav-overview", "Overview", "squares-four")}
      ${navBtn(postingsActive, "nav-postings", "Postings", "cards-three")}
      ${navBtn(state.view === "notifications", "nav-notifications", "Notifications", "bell", unreadCount)}
      ${navBtn(state.view === "help", "nav-help", "Help", "book")}
      ${navBtn(state.view === "settings", "nav-settings", "Settings", "gear")}
    `;
    footEl.innerHTML = `
      <button class="rail-item" id="logout-btn" data-tip="Log out">${ICON.logOut}<span class="rail-label">Log out</span></button>
    `;
    document.getElementById("nav-overview").addEventListener("click", () => { if (!state.loading) loadOverview(); });
    document.getElementById("nav-postings").addEventListener("click", () => { if (!state.loading) loadPositionsView(); });
    document.getElementById("nav-notifications").addEventListener("click", () => {
      state.view = "notifications"; state.loading = false; state.loadError = null; render();
    });
    document.getElementById("nav-help").addEventListener("click", () => {
      state.view = "help"; state.loading = false; state.loadError = null; render();
    });
    document.getElementById("nav-settings").addEventListener("click", () => {

    document.getElementById("logout-btn").addEventListener("click", () => { API.logout(); });
    [navEl.querySelector("#nav-overview"), navEl.querySelector("#nav-postings"), navEl.querySelector("#nav-notifications"),
     navEl.querySelector("#nav-help"), navEl.querySelector("#nav-settings"), footEl.querySelector("#logout-btn")]
      .forEach(attachRipple);
    bindSidebarChrome();
  }

  function renderMobileTabbar(){
    const el = document.getElementById("mobile-tabbar-inner");
    if (!el) return;
    // "+" is the active tab while a brand-new position is being created (editing an existing one stays under Postings)
    const newPosActive = state.view === "new-position" && !state.editingPositionId;
    const postingsActive = ["positions", "position", "candidate", "new-position", "link-share"].includes(state.view) && !newPosActive;
    const settingsActive = ["settings", "help"].includes(state.view);
    const overviewActive = state.view === "overview";
    el.innerHTML = `
      <button class="mobile-tab-btn ${overviewActive ? "active" : ""}" id="mtab-overview" aria-label="Overview"><i class="ph-fill ph-house"></i></button>
      <button class="mobile-tab-btn ${postingsActive ? "active" : ""}" id="mtab-postings" aria-label="Posting"><i class="ph-fill ph-cards-three"></i></button>
      ${canManagePosition() ? `<button class="mobile-tab-btn ${newPosActive ? "active" : ""}" id="mtab-new-position" aria-label="New position"><i class="ph-fill ph-plus-circle"></i></button>` : ""}

    el.querySelector("#mtab-postings").addEventListener("click", () => { if (!state.loading) { state.mobileFilterSheetOpen = false; loadPositionsView(); } });
    el.querySelector("#mtab-settings").addEventListener("click", () => {
      if (state.loading) return;
      state.mobileFilterSheetOpen = false;
      state.view = "settings"; state.mobileSettingsScreen = "menu"; state.loading = false; state.loadError = null; render();
    });
    const mtabNew = el.querySelector("#mtab-new-position");

      if (state.loading) return;

      if (state.view === "new-position" && !state.editingPositionId) return;
      state.mobileFilterSheetOpen = false;

      tryOpenNewPosition();
    });

  function renderLoggedOut(){
    const brandSrc = document.querySelector(".rail-brand img")?.src || "";
    const html = `
      <div class="loggedout-wrap" id="loggedout-wrap">
        <div class="auth-card anim-in">
          <div class="auth-hero">
            <img class="auth-hero-img" src="${AUTH_HERO_IMG}" alt="A HireLab team member reviewing candidates on a laptop" />
          </div>
          <div class="auth-panel">
            <div class="auth-brand"><img src="${brandSrc}" alt="" /><span>HireLab</span></div>
            ${state.authMode === "signup" ? renderAuthSignupPane() : renderAuthLoginPane()}
          </div>
        </div>
      </div>
    `;
    const existing = document.getElementById("loggedout-wrap");
    if (existing) { existing.outerHTML = html; } else { document.body.insertAdjacentHTML("beforeend", html); }
    attachAuthListeners();
  }

  function renderAuthLoginPane(){
    const v = state.authValues;
    const fe = state.authFieldErrors;
    return `
      <div class="auth-pane" id="pane-login">
        <h1 class="auth-title">Welcome back!</h1>
        <p class="auth-subtitle">Enter your details below</p>
        <div class="auth-banner-error ${state.authError ? "show" : ""}">${escapeHtml(state.authError || "")}</div>
        <form novalidate id="login-form">
          <div class="auth-field ${fe.email ? "has-error" : ""}" data-field="email">
            <span class="auth-field-label">Email</span>
            <input type="email" id="auth-login-email" autocomplete="email" placeholder="you@company.com" required value="${escapeHtml(v.loginEmail || "")}" />
            <span class="auth-error-msg">${escapeHtml(fe.email || "Enter a valid email address.")}</span>
          </div>
          <div class="auth-field ${fe.password ? "has-error" : ""}" data-field="password">
            <span class="auth-field-label">Password</span>
            <div class="auth-input-row">
              <input type="password" id="auth-login-password" autocomplete="current-password" placeholder="Enter your password" required minlength="6" value="${escapeHtml(v.loginPassword || "")}" />
              <button type="button" class="auth-eye-btn" aria-label="Show password">${ICON.eye}</button>
            </div>
            <span class="auth-error-msg">${escapeHtml(fe.password || "Password must be at least 6 characters.")}</span>
          </div>
          <div class="auth-row-between">
            <label class="auth-checkbox"><input type="checkbox" id="auth-remember" ${v.loginRemember === false ? "" : "checked"} /> Remember me</label>
            <button type="button" class="auth-link" id="auth-forgot">Forgot password?</button>
          </div>
          <button type="submit" class="auth-btn-primary ${state.authLoading ? "loading" : ""}" id="auth-submit" ${state.authLoading ? "disabled" : ""}>
            <span class="btn-label">Log in</span>
            <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
          </button>
          <button type="button" class="auth-btn-google" ${state.authLoading ? "disabled" : ""}>${AUTH_GOOGLE_ICON} Log in with Google</button>
        </form>
        <p class="auth-switch">Don't have an account? <button type="button" id="auth-switch-btn">Sign Up</button></p>
      </div>
    `;
  }

  function renderAuthSignupPane(){
    const v = state.authValues;
    const fe = state.authFieldErrors;
    return `
      <div class="auth-pane" id="pane-signup">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Start hiring smarter today</p>
        <div class="auth-banner-error ${state.authError ? "show" : ""}">${escapeHtml(state.authError || "")}</div>

  function attachAuthListeners(){
    const wrap = document.getElementById("loggedout-wrap");
    if (!wrap) return;

    // Clear a field's error state as the person edits it — direct DOM
    // update only, no re-render, so nothing else in the form is disturbed.
    wrap.querySelectorAll(".auth-field input").forEach((input) => {
      input.addEventListener("input", () => {
        const field = input.closest(".auth-field");
        if (field) field.classList.remove("has-error");
      });
    });
    const agreeInput = wrap.querySelector("#auth-signup-agree");
    if (agreeInput) agreeInput.addEventListener("change", () => {
      if (!agreeInput.checked) return;
      const msg = agreeInput.closest(".auth-terms-wrap")?.querySelector(".auth-error-msg");
      if (msg) msg.remove();
    });

    // Password visibility toggles — direct DOM update, no re-render, so
    // typed text and focus are never disturbed.
    wrap.querySelectorAll(".auth-eye-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = btn.closest(".auth-input-row").querySelector("input");
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.innerHTML = showing ? ICON.eye : ICON.eyeOff;
        btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      });
    });

    const switchBtn = wrap.querySelector("#auth-switch-btn");
    if (switchBtn) switchBtn.addEventListener("click", () => {
      state.authMode = state.authMode === "signup" ? "login" : "signup";
      state.authError = ""; state.authFieldErrors = {}; state.authValues = {};
      render();
    });

    // Forgot password / Google sign-in have no real backend endpoint in
    // this app yet — say so plainly rather than faking a reset email or a
    // successful login.
    const forgotBtn = wrap.querySelector("#auth-forgot");
    if (forgotBtn) forgotBtn.addEventListener("click", () => {
      forgotBtn.textContent = "Password reset isn't available yet";
      forgotBtn.disabled = true;
    });
    wrap.querySelectorAll(".auth-btn-google").forEach((btn) => {
      btn.addEventListener("click", () => { showToast("Google sign-in isn't available yet.", "error"); });
    });

    const loginForm = wrap.querySelector("#login-form");
    if (loginForm) loginForm.addEventListener("submit", handleAuthLoginSubmit);
    const signupForm = wrap.querySelector("#signup-form");
    if (signupForm) signupForm.addEventListener("submit", handleAuthSignupSubmit);

    const firstErrorField = wrap.querySelector(".auth-field.has-error input");
    if (firstErrorField) firstErrorField.focus();
  }

  async function handleAuthLoginSubmit(e){
    e.preventDefault();
    const emailInput = document.getElementById("auth-login-email");
    const pwInput = document.getElementById("auth-login-password");
    const rememberInput = document.getElementById("auth-remember");
    const email = emailInput.value.trim();
    const password = pwInput.value;
    state.authValues = { ...state.authValues, loginEmail: email, loginPassword: password, loginRemember: rememberInput.checked };

    const fieldErrors = {};
    if (!emailInput.checkValidity()) fieldErrors.email = "Enter a valid email address.";
    if (password.length < 6) fieldErrors.password = "Password must be at least 6 characters.";
    if (Object.keys(fieldErrors).length) {
      state.authFieldErrors = fieldErrors; state.authError = ""; render();
      return;
    }

    state.authFieldErrors = {}; state.authError = ""; state.authLoading = true; render();
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || "Log in failed. Check your email and password.");
      }
      state.loggedOut = false; state.authLoading = false; state.authError = ""; state.authFieldErrors = {}; state.authValues = {};
      resetUserScopedState();
      loadOverview();
      loadSession();
    } catch (err) {
      state.authLoading = false;
      state.authError = err.message || "Something went wrong. Please try again.";
      render();
    }
  }

  async function handleAuthSignupSubmit(e){
    e.preventDefault();
    const nameInput = document.getElementById("auth-signup-name");
    const companyInput = document.getElementById("auth-signup-company");
    const emailInput = document.getElementById("auth-signup-email");
    const pwInput = document.getElementById("auth-signup-password");
    const confirmInput = document.getElementById("auth-signup-confirm");
    const agreeInput = document.getElementById("auth-signup-agree");

    const name = nameInput.value.trim();
    const company = companyInput.value.trim();
    const email = emailInput.value.trim();
    const password = pwInput.value;
    const confirm = confirmInput.value;
    const agree = agreeInput.checked;
    state.authValues = {
      ...state.authValues,
      signupName: name, signupCompany: company, signupEmail: email,
      signupPassword: password, signupConfirm: confirm, signupAgree: agree,
    };

    const fieldErrors = {};
    if (name.length <= 1) fieldErrors.name = "Enter your full name.";
    if (!emailInput.checkValidity()) fieldErrors.email = "Enter a valid email address.";
    if (password.length < 6) fieldErrors.password = "Password must be at least 6 characters.";
    if (!confirm || confirm !== password) fieldErrors.confirm = "Passwords don't match.";
    if (!agree) fieldErrors.terms = "Please accept the Terms to continue.";
    if (Object.keys(fieldErrors).length) {
      state.authFieldErrors = fieldErrors; state.authError = ""; render();
      return;
    }

    state.authFieldErrors = {}; state.authError = ""; state.authLoading = true; render();
    try {
      const res = await fetch("/api/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ organizationName: company, name, email, password }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || "Could not create your account. Please try again.");
      }
      state.loggedOut = false; state.authLoading = false; state.authError = ""; state.authFieldErrors = {}; state.authValues = {};
      resetUserScopedState();
      loadOverview();
      loadSession();
    } catch (err) {
      state.authLoading = false;
      state.authError = err.message || "Something went wrong. Please try again.";
      render();
    }
  }

  function copyToClipboard(text, onDone){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone).catch(() => fallbackCopy(text, onDone));
    } else { fallbackCopy(text, onDone); }
  }
  function fallbackCopy(text, onDone){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    onDone();
  }

  function attachRipple(el){
    if (!el) return;
    el.style.position = el.style.position || "relative";
    el.style.overflow = "hidden";
    el.addEventListener("pointerdown", (e) => {
      if (el.disabled) return;
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2.4;
      const originX = (e.clientX ?? rect.left + rect.width / 2) - rect.left;
      const originY = (e.clientY ?? rect.top + rect.height / 2) - rect.top;
      const span = document.createElement("span");
      span.className = "ripple-fx";
      span.style.width = span.style.height = size + "px";
      span.style.left = (originX - size / 2) + "px";
      span.style.top = (originY - size / 2) + "px";
      el.appendChild(span);
      span.addEventListener("animationend", () => span.remove());
      setTimeout(() => span.remove(), 900);
    });
  }

  // ============================================================
  // Toasts — lightweight, visible feedback for background actions
  // and failures, so nothing fails silently.
  // ============================================================
  function showToast(message, type = "default"){
    const stack = document.getElementById("toast-stack");
    if (!stack) return;
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `${type === "error" ? ICON.alertTriangle : ICON.checkCircle}<span></span>`;
    el.querySelector("span").textContent = message;
    stack.appendChild(el);
    setTimeout(() => {
      el.classList.add("leaving");
      setTimeout(() => el.remove(), 220);
    }, 3400);
  }

  // ============================================================
  // Confirm dialog — reusable, neutral-styled (no danger red),
  // just a clear question and two buttons. Used anywhere a
  // destructive-ish action (remove, revoke, etc.) needs a beat
  // of confirmation before it happens.
  // ============================================================
  function askConfirm({ title = "Are you sure?", message = "", confirmLabel = "Confirm", onConfirm }){
    document.getElementById("confirm-modal-title").textContent = title;
    document.getElementById("confirm-modal-message").textContent = message;
    document.getElementById("confirm-modal-confirm").textContent = confirmLabel;
    document.getElementById("confirm-modal").classList.add("show");
    document.getElementById("confirm-modal")._onConfirm = onConfirm;
  }

  // ============================================================
  // Async button helper — the disable/relabel/restore pattern already
  // used correctly by "Publish position", generalized and paired with a
  // toast so failures are always visible instead of silently resetting.
  // ============================================================
  async function withAsyncButton(btn, loadingLabel, fn, successLabel){
    if (!btn || btn.disabled) return;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = loadingLabel;
    try {
      await fn();
      if (successLabel) {
        btn.innerHTML = successLabel;
        setTimeout(() => { btn.disabled = false; btn.innerHTML = original; }, 1200);
      } else {
        btn.disabled = false;
        btn.innerHTML = original;
      }
    } catch (err) {
      // An API-key error already has its own pop-up explaining it; a second red toast would just repeat it.
      if (!isApiKeyError(err)) showToast((err && err.message) || "Something went wrong. Please try again.", "error");
      btn.disabled = false;
      btn.innerHTML = original;
    }
  }

  // ============================================================
  // New position view
  // ============================================================
  // Optional details on the New position form. Every list starts with "None" and ends with a "custom" choice
  // that reveals a text box, so people can enter their own requirement.
  const NP_EXTRA_FIELDS = [
    { key: "salary", label: "Salary", options: ["None", "Up to 30k", "30k \u2013 60k", "60k \u2013 90k", "90k \u2013 120k", "120k \u2013 160k", "160k+"], other: "Custom range", ph: "e.g. 85k \u2013 105k", type: "text" },
    { key: "gender", label: "Gender", options: ["None", "Male", "Female", "Non-binary"], other: "Other (specify)", ph: "e.g. Self-described", type: "text" },
    { key: "vacancies", label: "Vacancies", options: ["None", "1", "2", "3", "4", "5", "6\u201310", "More than 10"], other: "Custom number", ph: "e.g. 12", type: "numeric" },
    { key: "education", label: "Education qualifications", options: ["None", "High school", "Diploma", "Bachelor's degree", "Master's degree", "Doctorate (PhD)"], other: "Other (specify)", ph: "e.g. Degree in a related field", type: "text" },
    { key: "experience", label: "Experience level", options: ["None", "Internship", "Entry level", "Junior", "Mid level", "Senior", "Lead", "Executive"], other: "Other (specify)", ph: "e.g. 3+ years in a similar role", type: "text" },
  ];
  // saved value -> draft entries (a value that isn't a preset becomes the custom text)
  function npFieldInit(f, v){
    v = v || "None";
    return f.options.includes(v) ? { [f.key]: v, [f.key + "Other"]: "" } : { [f.key]: f.other, [f.key + "Other"]: v };
  }
  // draft -> value to save
  function npFieldValue(d, f){
    return d[f.key] === f.other ? ((d[f.key + "Other"] || "").trim() || "None") : (d[f.key] || "None");
  }
  function npFieldHTML(d, k){
    const f = NP_EXTRA_FIELDS.find((x) => x.key === k), value = d[k] || "None", isOther = value === f.other;
    return `<div class="form-field">
      <label id="np-${k}-label-text">${f.label}</label>
      <div class="np-select-wrap">
        <button type="button" class="np-select-btn" id="np-${k}-toggle" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="np-${k}-label-text">
          <span id="np-${k}-label">${escapeHtml(value)}</span>${ICON.chevronDown}
        </button>
        <div class="np-select-panel" id="np-${k}-panel" role="listbox">
          ${f.options.concat(f.other).map((o) => `<button type="button" class="np-select-option ${value === o ? "active" : ""}" data-np-field="${k}" data-value="${escapeHtml(o)}" role="option" aria-selected="${value === o ? "true" : "false"}">${escapeHtml(o)} ${value === o ? ICON.check : ""}</button>`).join("")}
        </div>
      </div>
      <div class="np-other" id="np-${k}-other-wrap" ${isOther ? "" : "hidden"}>
        <input type="text" ${f.type === "numeric" ? 'inputmode="numeric" pattern="[0-9]*"' : ""} id="np-${k}-other" placeholder="${escapeHtml(f.ph)}" aria-label="${f.label}: ${escapeHtml(f.other)}" value="${escapeHtml(d[k + "Other"] || "")}" />
      </div>
    </div>`;
  }
  function renderNpFieldRow(d, keys, extraHTML){
    return `<div class="form-row-2">${keys.map((k) => npFieldHTML(d, k)).join("")}${extraHTML || ""}</div>`;
  }

          <div class="card-body">
            <div class="funnel-row"><div class="funnel-label">Applied</div><div class="funnel-track"><div class="funnel-fill" style="width:0%" data-fill="${(f.applied / funnelMax) * 100}"><span>${f.applied}</span></div></div></div>
            <div class="funnel-row"><div class="funnel-label">Processing</div><div class="funnel-track"><div class="funnel-fill" style="width:0%" data-fill="${(f.processing / funnelMax) * 100}"><span>${f.processing}</span></div></div></div>
            <div class="funnel-row"><div class="funnel-label">Ready</div><div class="funnel-track"><div class="funnel-fill" style="width:0%" data-fill="${(f.ready / funnelMax) * 100}"><span>${f.ready}</span></div></div></div>
            <div class="funnel-row"><div class="funnel-label">Qualified</div><div class="funnel-track"><div class="funnel-fill" style="width:0%" data-fill="${(f.qualified / funnelMax) * 100}"><span>${f.qualified}</span></div></div></div>
          </div>
        </div>
        <div class="card anim-in">
          <div class="card-header">${ICON.users}<h3>Hiring team</h3><span class="card-badge">${p.team.length}</span></div>
          <div class="card-body">
            <div class="team-list">
              ${p.team.map((t) => `
                <div class="team-member">
                  <div class="team-avatar">${computeInitials(t.name)}</div>
                  <div class="team-name-block"><div class="team-name">${escapeHtml(t.name)}</div><div class="team-role">${roleLabel(t.role)}</div></div>
                  ${canManagePosition() ? `<button class="team-remove" data-remove-team="${t.userId}" data-remove-team-name="${escapeHtml(t.name)}">${ICON.trash}</button>` : ""}
                </div>
              `).join("") || `<div style="font-size:13px;color:var(--text-faint);">No team members yet.</div>`}
            </div>
            ${canManagePosition() ? `
            <button class="btn-add-team" id="team-invite-toggle">${ICON.plus} Invite team member</button>
            <div class="team-invite-form" id="team-invite-form">
              <input type="text" id="ti-name" placeholder="Name" />
              <input type="text" id="ti-email" placeholder="Email" />
              <div class="role-select" id="ti-role-wrap">
                <input type="hidden" id="ti-role" value="Admin" />
                <button type="button" class="role-select-btn" id="ti-role-toggle" aria-haspopup="listbox" aria-expanded="false"><span id="ti-role-label">Admin</span>${ICON.chevronDown}</button>
                <div class="role-select-panel" id="ti-role-panel" role="listbox">
                  ${["Admin", "Recruiter", "Viewer"].map((r) => `<button type="button" class="role-select-option ${r === "Admin" ? "active" : ""}" data-role="${r}" role="option" aria-selected="${r === "Admin" ? "true" : "false"}">${r} ${r === "Admin" ? ICON.check : ""}</button>`).join("")}
                </div>
              </div>
              <button class="btn-primary" id="ti-submit">Invite</button>
            </div>
            ` : `<div class="note-readonly-hint" style="margin-top:12px;">${rolePlural()} can view the hiring team but can't invite or remove members.</div>`}
          </div>
        </div>
      </div>

      ${renderCandidateListSection()}
    `;
  }

  // ============================================================
  // Candidate list (within position detail)
  // ============================================================
  function filtersActive(f){ return (f.techStack.length ? 1 : 0) + (f.minConsistency > 0 ? 1 : 0) + (f.minCollaboration > 0 ? 1 : 0) + (f.shippedOnly ? 1 : 0) > 0; }

  // Group headers for the filtered list: "Matching your filters" above the matches, then "Other candidates" above the rest.
  function candGroupHeaderHTML(kind, n){
    if (kind === "match") return `<div class="cand-group-header cand-group-match"><span>Matching your filters</span><span class="cand-group-count">${n}</span></div>`;
    if (kind === "none") return `<div class="cand-group-header cand-group-none"><div><b>No candidates match these filters.</b> Showing everyone else, best match first.</div><button class="btn-outline-dash" id="cand-clear-filters">Clear filters</button></div>`;
    return `<div class="cand-group-header cand-group-other"><span>Other candidates</span><span class="cand-group-count">${n}</span><span class="cand-group-hint">Don't match every filter</span></div>`;
  }

  function renderCandidateRowsHTML(){
    const q = state.candidateSearch.trim().toLowerCase();
    const rows = q
      ? currentCandidateRows.filter((c) => c.name.toLowerCase().includes(q) || (c.email || "").toLowerCase().includes(q))
      : currentCandidateRows;
    const f = state.filters;
    const hasActiveFilters = filtersActive(f);

    if (rows.length) {
      const matchedTotal = rows.filter((c) => c.matches).length;
      const othersTotal = rows.length - matchedTotal;
      // A header goes above the first row of each group on the page (and at the top of a page that starts mid-group,
      // so the context isn't lost when paging).
      const rowHeaderHTML = (c, i, list) => {
        if (!hasActiveFilters) return "";
        if (c.matches) return i === 0 ? candGroupHeaderHTML("match", matchedTotal) : "";
        return (i === 0 || list[i - 1].matches) ? candGroupHeaderHTML(matchedTotal === 0 ? "none" : "other", othersTotal) : "";
      };
      const pageSize = state.filters.topN;
      const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
      const page = Math.min(Math.max(1, state.filters.page), totalPages);
      state.filters.page = page;
      const start = (page - 1) * pageSize;
      const pageRows = rows.slice(start, start + pageSize);
      const rowsHTML = pageRows.map((c, i) => rowHeaderHTML(c, i, pageRows) + `
        <button class="candidate-row${hasActiveFilters && !c.matches ? " is-other" : ""}" data-open-candidate="${c.id}">
          <div class="rank-num">${start + i + 1}</div>
          <div class="avatar">${computeInitials(c.name)}</div>
          <div class="cand-name-block"><div class="cand-name">${escapeHtml(c.name)}</div><div class="cand-sub">Applied ${c.appliedDaysAgo === 0 ? "today" : c.appliedDaysAgo + "d ago"}</div></div>
          <div class="skills-block">${c.skills.map((s) => `<span class="pill">${escapeHtml(s)}</span>`).join("")}</div>
          <div class="comp-block">
            <div class="comp-bar">${c.composite.map((v, ci) => `<div class="${COMP_CLASSES[ci]}" style="width:0%" data-fill="${v}"></div>`).join("")}</div>
          </div>
          <div class="standout-text">${escapeHtml(c.standout)}</div>
          <span class="match-badge ${matchClass(c.matchPct)}">${c.matchPct}%</span>
          <span class="row-chevron">${ICON.chevronRight}</span>
        </button>
      `).join("");
      const paginationHTML = totalPages > 1 ? `
        <div class="cand-pagination">
          <div class="cand-pagination-count">Showing ${start + 1}–${Math.min(start + pageSize, rows.length)} of ${rows.length}</div>
          <div class="cand-pagination-controls">
            <button class="cand-page-btn" id="cand-page-prev" ${page <= 1 ? "disabled" : ""}>${ICON.caretLeft} Previous</button>
            <span class="cand-pagination-current">Page ${page} of ${totalPages}</span>
            <button class="cand-page-btn" id="cand-page-next" ${page >= totalPages ? "disabled" : ""}>Next ${ICON.chevronRight}</button>
          </div>
        </div>
      ` : "";
      return rowsHTML + paginationHTML;
    }

    const hasAnyApplicants = (getPosition()?.applicantCount || 0) > 0;

    if (hasAnyApplicants) {
      // Applicants exist, but the current search/filters narrowed the list to zero.
      return `
        <div class="cand-empty">
          <div class="cand-empty-icon">${ICON.search}</div>
          <h4>No matches</h4>
          <p>${q ? `No candidates match &ldquo;${escapeHtml(state.candidateSearch.trim())}&rdquo;.` : "No candidates match the current filters."}</p>
          ${(q || hasActiveFilters) ? `<button class="btn-outline-dash" id="cand-clear-filters">Clear filters</button>` : ""}
        </div>`;
    }
    // No one has applied to this posting at all yet.
    return `
      <div class="cand-empty">
        <div class="cand-empty-icon">${ICON.users}</div>
        <h4>No applicants yet</h4>
        <p>Share this posting's apply link to start receiving candidates — they'll show up here, ranked and scored automatically.</p>
        <button class="btn-outline-dash" id="cand-empty-copy-link">${ICON.copy} Copy apply link</button>
      </div>`;
  }

  function updateCandidateRows(){
    const wrap = document.getElementById("candidate-rows-wrap");
    if (!wrap) return;
    wrap.innerHTML = renderCandidateRowsHTML();
    attachCandidateRowListeners();
    animateIn();
  }

  function attachCandidateRowListeners(){
    document.querySelectorAll("[data-open-candidate]").forEach((el) => {
      el.addEventListener("click", () => openCandidate(el.getAttribute("data-open-candidate")));
    });
    const clearBtn = document.getElementById("cand-clear-filters");
    if (clearBtn) clearBtn.addEventListener("click", () => {
      state.candidateSearch = "";
      state.filters = { topN: state.filters.topN, techStack: [], minConsistency: 0, minCollaboration: 0, shippedOnly: false, page: 1 };
      refreshCandidateList();
    });
    const copyLinkBtn = document.getElementById("cand-empty-copy-link");
    if (copyLinkBtn) copyLinkBtn.addEventListener("click", () => {
      copyToClipboard(applyUrlFor(state.positionId), () => showToast("Apply link copied."));
    });
    const pagePrev = document.getElementById("cand-page-prev");
    if (pagePrev) pagePrev.addEventListener("click", () => {
      state.filters.page = Math.max(1, state.filters.page - 1);
      updateCandidateRows();
      document.querySelector(".candidate-list")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    const pageNext = document.getElementById("cand-page-next");
    if (pageNext) pageNext.addEventListener("click", () => {
      state.filters.page = state.filters.page + 1;
      updateCandidateRows();
      document.querySelector(".candidate-list")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
  }

  function renderCandidateListSection(){
    const f = state.filters; // applied: drives the badge, the chips and the list
    const d = state.filterDraft || f; // what the open panel is editing
    const activeCount = (f.techStack.length ? 1 : 0) + (f.minConsistency > 0 ? 1 : 0) + (f.minCollaboration > 0 ? 1 : 0) + (f.shippedOnly ? 1 : 0);
    // Options come from the whole applicant pool (server: techOptions), so applying a filter never shrinks them.
    const poolTech = state.techOptions.length ? state.techOptions : Array.from(new Set(currentCandidateRows.flatMap((c) => c.skills)));
    const allTech = Array.from(new Set([...poolTech, ...d.techStack]));

    return `
      <div class="toolbar">
        <div class="topn-wrap">
          <button class="topn-btn" id="topn-toggle" aria-haspopup="listbox" aria-expanded="${state.topNPanelOpen ? "true" : "false"}"><b>${f.topN}</b>&nbsp;per page ${ICON.chevronDown}</button>
          <div class="topn-panel ${state.topNPanelOpen ? "open" : ""}" id="topn-panel" role="listbox">
            ${[5, 10, 25, 50, 100].map((n) => `<button class="topn-option ${f.topN === n ? "active" : ""}" data-topn="${n}" role="option" aria-selected="${f.topN === n ? "true" : "false"}">${n} per page ${f.topN === n ? ICON.check : ""}</button>`).join("")}
          </div>
        </div>
        <div class="search-wrap">${ICON.search}<input type="text" placeholder="Search candidates" id="candidate-search" value="${escapeHtml(state.candidateSearch)}" /></div>
        <div class="filter-btn-wrap">
          <button class="filter-btn" id="filter-toggle"><i class="ph ph-funnel"></i> Filters ${activeCount ? `<span class="filter-count">${activeCount}</span>` : ""}</button>
          <div class="filter-panel ${state.filterPanelOpen ? "open" : ""}" id="filter-panel">
            <div class="filter-panel-header"><span>Filters</span><button id="filter-close">${ICON.x}</button></div>
            <div class="filter-section">
              <div class="filter-section-label">Tech stack</div>
              <div class="tech-pills">${allTech.map((t) => `<button class="tech-pill ${d.techStack.includes(t) ? "active" : ""}" data-tech="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join("") || `<span style="font-size:12px;color:var(--text-faint);">No skills detected yet</span>`}</div>
            </div>
            <div class="filter-section">
              <div class="slider-row">
                <div class="slider-label"><span>Min consistency</span><span>${d.minConsistency}%</span></div>
                <input type="range" min="0" max="100" step="5" value="${d.minConsistency}" id="slider-consistency" />
              </div>
              <div class="slider-row">
                <div class="slider-label"><span>Min collaboration</span><span>${d.minCollaboration}%</span></div>
                <input type="range" min="0" max="100" step="5" value="${d.minCollaboration}" id="slider-collaboration" />
              </div>
            </div>
            <label class="checkbox-row"><input type="checkbox" id="check-shipped" ${d.shippedOnly ? "checked" : ""}/> <span style="font-size:13px;">Shipped a real project only</span></label>
            <div class="filter-actions"><button class="btn-ghost" id="filter-reset">Reset</button><button class="btn-primary" id="filter-apply">Apply</button></div>
          </div>
        </div>
      </div>
      ${activeCount ? `<div class="active-chips">
        ${f.techStack.map((t) => `<span class="chip">${escapeHtml(t)}<button data-remove-filter="tech" data-value="${escapeHtml(t)}">${ICON.x}</button></span>`).join("")}
        ${f.minConsistency > 0 ? `<span class="chip">Consistency ≥ ${f.minConsistency}%<button data-remove-filter="minConsistency">${ICON.x}</button></span>` : ""}
        ${f.minCollaboration > 0 ? `<span class="chip">Collaboration ≥ ${f.minCollaboration}%<button data-remove-filter="minCollaboration">${ICON.x}</button></span>` : ""}
        ${f.shippedOnly ? `<span class="chip">Shipped only<button data-remove-filter="shippedOnly">${ICON.x}</button></span>` : ""}
      </div>` : ""}
      <div class="candidate-list" id="candidate-rows-wrap">${renderCandidateRowsHTML()}</div>
    `;
  }

  // ============================================================
  // Candidate detail
  // ============================================================
  function candidateSignal(c){ return `${c.matchPct}|${c.status}`; }

  function renderNoteCard(n){
    const isMine = !!n.authorId && n.authorId === state.currentUserId;
    const isManager = state.currentUserRole === "OWNER" || state.currentUserRole === "ADMIN";
    const canDelete = canWriteNotes() && (isMine || isManager);
    const canEdit = canWriteNotes() && isMine;
    const isEditing = state.editingNoteId === n.id;
    return `
      <div class="note-card" data-note-id="${n.id}">
        <div class="note-card-top">
          <div class="note-avatar" style="background:${noteAvatarColor(n.authorName)}">${computeInitials(n.authorName)}</div>
          <div class="note-author-block">
            <div class="note-author-name">${escapeHtml(n.authorName)}</div>
            <div class="note-author-role">${roleLabel(n.authorRole)}</div>
          </div>
          <div class="note-meta">${formatNoteTime(n.createdAt)}${n.editedAt ? " · edited" : ""}</div>
        </div>
        ${isEditing ? `
          <textarea class="note-edit-textarea" id="note-edit-${n.id}" rows="3">${escapeHtml(n.text)}</textarea>
          <div class="note-composer-actions">
            <button class="btn-outline-dash" data-cancel-edit-note="${n.id}">Cancel</button>
            <button class="btn-new" data-save-edit-note="${n.id}">Save</button>
          </div>
        ` : `
          <div class="note-text">${escapeHtml(n.text)}</div>
          ${(canEdit || canDelete) ? `
            <div class="note-actions">
              ${canEdit ? `<button class="note-action-btn" data-edit-note="${n.id}">${ICON.edit}Edit</button>` : ""}
              ${canDelete ? `<button class="note-action-btn" data-delete-note="${n.id}">${ICON.trash}Delete</button>` : ""}
            </div>
          ` : ""}
        `}
      </div>
    `;
  }

  function renderNotesCard(candidateId){
    const notes = getCandidateNotes(candidateId);
    const ordered = notes.slice().reverse();
    return `
      <div class="card anim-in">
        <div class="card-header">${ICON.messageSquare}<h3>Notes</h3>${notes.length ? `<span class="card-badge">${notes.length}</span>` : ""}</div>
        <div class="card-body">
          ${canWriteNotes() ? `
            <div class="note-composer">
              <textarea id="note-input" placeholder="Add a note about this candidate…" rows="3"></textarea>
              <div class="note-composer-actions"><button class="btn-new" id="note-submit">Add note</button></div>
            </div>
          ` : `<div class="note-readonly-hint">Viewers can read notes but can't add or edit them.</div>`}
          <div class="note-list" id="note-list">
            ${ordered.length ? ordered.map((n) => renderNoteCard(n)).join("") : `<div class="note-empty">No notes yet${canWriteNotes() ? " — be the first to add one." : "."}</div>`}
          </div>
        </div>
      </div>
    `;
  }

  function renderCandidateDetail(){
    const c = candidateDetailCache[state.candidateId];
    if (!c) return `<p>Candidate not found.</p>`;
    const a = c.analysis;
    const langColors = getTheme() === "dark" ? ["#F5F5F5", "#B8B8B8", "#8C8C8C", "#6F6F6F", "#4A4A4A"] : ["#17171A", "#6B6963", "#9C9994", "#C4C1BC", "#DAD7D2"];
    langColors[0] = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || langColors[0];

    return `
      ${mHeaderHTML("position", c.name)}
      <button class="back-btn" id="back-to-position">${ICON.caretLeft} Back to candidates</button>
      <div class="detail-header">
        <div class="detail-id">
          <div class="avatar lg">${computeInitials(c.name)}</div>
          <div>
            <div class="detail-name-row"><h2>${escapeHtml(c.name)}</h2><span class="rank-tag">#${c.rank} of ${c.totalRanked}</span></div>
            ${c.percentile != null ? `<div class="percentile-line">Top ${100 - c.percentile}% for this role</div>` : ""}
            <div class="detail-sub">Applied ${c.appliedDaysAgo === 0 ? "today" : c.appliedDaysAgo + " days ago"}</div>
          </div>
        </div>
        <div class="detail-actions">
          <span class="match-badge ${matchClass(c.matchPct)}" style="font-size:15px;padding:8px 16px;">${c.matchPct}% match</span>
          <a class="btn-email" href="mailto:${escapeHtml(c.email)}">${ICON.mail} Email</a>
          ${c.phone ? `<a class="btn-phone" href="tel:${escapeHtml(c.phone)}">${ICON.phone} Call</a>` : ""}
        </div>
      </div>

      <div class="m-desktop-hint m-only">
        <i class="ph ph-desktop"></i>
        <span>This page is easiest to review in full on a desktop — tables and score breakdowns have more room to breathe there.</span>
      </div>

      <div class="detail-grid">
        <div class="detail-col">
          <div class="card anim-in">
            <div class="card-header">${ICON.target}<h3>Requirements vs. evidence</h3></div>
            <div class="card-body">
              <div class="evidence-table-scroll">
                <table class="evidence-table">
                  <thead><tr><th>Requirement</th><th></th><th>Evidence</th></tr></thead>
                  <tbody>
                    ${a.evidenceMatrix.map((row) => `
                      <tr>
                        <td class="evidence-req">${escapeHtml(row.requirement)}</td>
                        <td class="evidence-status"><span class="${row.met ? "yes" : "no"}">${row.met ? ICON.checkCircle : ICON.alertTriangle}</span></td>
                        <td class="evidence-note">${escapeHtml(row.evidence)}</td>
                      </tr>
                    `).join("") || `<tr><td colspan="3" style="color:var(--text-faint);">No structured requirements evaluated.</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="card anim-in">
            <div class="card-header">${ICON.briefcase}<h3>Career &amp; growth timeline</h3></div>
            <div class="card-body">
              <div class="exp-timeline">
                ${a.timeline.map((e) => `
                  <div class="exp-item">
                    <div class="exp-role">${escapeHtml(e.title)}</div>
                    <div class="exp-company">${escapeHtml(e.company)}</div>
                    <div class="exp-dates">${escapeHtml(e.startDate)} — ${escapeHtml(e.endDate || "Present")}</div>
                    <div class="exp-stack">${(e.stack || []).map((s) => `<span class="pill">${escapeHtml(s)}</span>`).join("")}</div>
                    ${(e.achievements || []).length ? `<ul class="exp-achievements">${e.achievements.map((ac) => `<li>${escapeHtml(ac)}</li>`).join("")}</ul>` : ""}
                  </div>
                `).join("") || `<div style="font-size:13px;color:var(--text-faint);">No structured work history extracted.</div>`}
              </div>
            </div>
          </div>

          <div class="card anim-in">
            <div class="card-header">${ICON.activity}<h3>Score breakdown</h3></div>
            <div class="card-body">
              ${[
                ["Requirement match", a.scores.reqMatch, a.scores.percentiles.reqMatch],
                ["Consistency", a.scores.consistency, a.scores.percentiles.consistency],
                ["Collaboration", a.scores.collaboration, a.scores.percentiles.collaboration],
                ["Code quality", a.scores.codeQuality, a.scores.percentiles.codeQuality],
              ].map(([label, val, pct]) => `
                <div class="score-bar-row">
                  <div class="score-bar-top"><span class="lab">${label}</span><span class="val">${val}%${pct != null ? `<span class="pct">${pct}${ordinalSuffix(pct)} percentile</span>` : ""}</span></div>
                  <div class="score-track"><div class="score-fill" style="width:${val}%"></div></div>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="card anim-in">
            <div class="card-header">${ICON.github}<h3>GitHub analysis</h3>${a.github.username ? `<a class="card-badge" href="https://github.com/${escapeHtml(a.github.username)}" target="_blank" rel="noopener">@${escapeHtml(a.github.username)} ${ICON.externalLink}</a>` : ""}</div>
            <div class="card-body">
              <div class="gh-stats">
                <div><div class="gh-stat-value">${a.github.followers}</div><div class="gh-stat-label">Followers</div></div>
                <div><div class="gh-stat-value small">${ICON.star}${a.github.totalStars}</div><div class="gh-stat-label">Total stars</div></div>
                <div><div class="gh-stat-value">${a.github.totalCommitsLastYear}</div><div class="gh-stat-label">Commits (1yr)</div></div>
                <div><div class="gh-stat-value">${a.github.accountAgeYears}y</div><div class="gh-stat-label">Account age</div></div>
              </div>
              ${a.github.languages.length ? `
                <div class="lang-legend">
                  ${a.github.languages.slice(0, 5).map((l, i) => `<div class="lang-legend-item"><span class="lang-dot" style="background:${langColors[i % langColors.length]}"></span>${escapeHtml(l.name)} <span class="pct">${l.pct}%</span></div>`).join("")}
                </div>` : ""}
              ${a.github.shippedProjects.length ? `
                <div class="shipped-list">
                  ${a.github.shippedProjects.map((s) => `
                    <div class="shipped-item">
                      <div class="shipped-name">${ICON.checkCircle}${escapeHtml(s.name)}</div>
                      <a class="shipped-url" href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${ICON.link} ${escapeHtml((s.url || "").replace(/^https?:\/\//, ""))}</a>
                    </div>
                  `).join("")}
                </div>` : ""}
            </div>
          </div>

          <div class="card card-repo">
            <div class="card-header">${ICON.gitFork}<h3>Per-repository breakdown</h3></div>
            <div class="card-body">
              <p class="repo-swipe-hint m-only">Swipe horizontally to view all repository columns.</p>
              <div class="repo-table-scroll">
                <table class="repo-table">
                  <thead><tr><th>Repo</th><th>Origin</th><th>Stars</th><th>Commits</th><th>Complexity</th></tr></thead>
                  <tbody>
                    ${a.github.repos.map((r) => `

  // ============================================================
  // Settings (org-level, admin-facing)
  // ============================================================
  // Mobile root menu row: a big tappable card with icon + label + chevron,
  // used for the mobile "Settings" landing screen.
  // Settings search index: one entry per section (label, short description, and the settings inside it)
  const SETTINGS_INDEX = {
    personal: { label: "Personal", desc: "Your name and contact details", items: ["Full name", "Email", "Phone", "Change password", "Current password", "New password"] },
    organization: { label: "Organization", desc: "Company details shown on postings", items: ["Organization name", "Website", "Industry", "Contact email", "Contact phone", "Company description"] },
    team: { label: "Team", desc: "Invite members and set their roles", items: ["Invite team member", "Admin", "Recruiter", "Viewer", "Remove member"] },
    "api-keys": { label: "API Keys", desc: "Your AI key and preferred model", items: ["AI provider API key", "Provider", "Preferred model", "Replace key"] },
    notifications: { label: "Notifications", desc: "Choose what you hear about", items: ["New applicants", "Qualified candidates", "Team activity", "Email digest"] },
    appearance: { label: "Appearance", desc: "Theme and accent color", items: ["Theme", "Light", "Dark", "Dark mode", "Accent color"] },
    help: { label: "Help", desc: "Answers to common questions", items: ["FAQ"] },
    logout: { label: "Log out", desc: "Sign out of your account", items: ["Sign out"] },
  };
  // null = hide; "" = show as-is; text = show, with the matching settings named in the description
  function settingsSearchMatch(id, q){
    if (!q) return "";
    const e = SETTINGS_INDEX[id];
    if (!e) return null;
    if (e.label.toLowerCase().includes(q) || e.desc.toLowerCase().includes(q)) return "";
    const hits = e.items.filter((i) => i.toLowerCase().includes(q));
    return hits.length ? hits.slice(0, 2).join(", ") : null;
  }
  function applySettingsSearch(){
    const q = (state.settingsSearch || "").trim().toLowerCase();
    document.querySelectorAll("[data-settings-tab], [data-settings-row]").forEach((el) => {
      const m = settingsSearchMatch(el.getAttribute("data-settings-tab") || el.getAttribute("data-settings-row"), q);
      el.hidden = m === null;
      const d = el.querySelector(".settings-tab-desc, .m-settings-row-desc");
      if (d) { d.textContent = m ? "Matches: " + m : d.dataset.desc; d.classList.toggle("is-match", !!m); }
    });
    document.querySelectorAll(".settings-nav, .m-settings-menu").forEach((c) => {
      const empty = c.querySelector(".settings-search-empty");
      if (empty) empty.hidden = [...c.querySelectorAll("[data-settings-tab], [data-settings-row]")].some((el) => !el.hidden);
    });
  }

  function mSettingsMenuRow(id, icon, label){
    const desc = SETTINGS_INDEX[id] ? SETTINGS_INDEX[id].desc : "";
    return `<button class="m-settings-row" data-settings-row="${id}">
      <span class="m-settings-row-icon">${icon}</span>
      <span class="m-settings-row-text"><span class="m-settings-row-label">${escapeHtml(label)}</span><span class="m-settings-row-desc" data-desc="${escapeHtml(desc)}">${escapeHtml(desc)}</span></span>
      <span class="m-settings-row-chevron">${ICON.chevronRight}</span>
    </button>`;
  }

  // ---- Appearance (theme). Saved in localStorage; the head script re-applies it before first paint. ----
  function getTheme(){ return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
  function setTheme(t){
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("hl-theme", t); } catch (e) {}
  }
  const ACCENT_OPTIONS = [["ink", "Ink"], ["blue", "Signal Blue"], ["lime", "Lime"], ["purple", "Purple"], ["pink", "Pink"]];
  function getAccent(){ return document.documentElement.getAttribute("data-accent") || "ink"; }
  function setAccent(id){
    if (id === "ink") document.documentElement.removeAttribute("data-accent"); else document.documentElement.setAttribute("data-accent", id);
    try { localStorage.setItem("hl-accent", id); } catch (e) {}
  }
  function renderSettingsAppearance(){
    const theme = getTheme(), accent = getAccent();
    const opt = (id, name, sub) => `
      <button type="button" class="appearance-option ${theme === id ? "selected" : ""}" data-theme-option="${id}" role="radio" aria-checked="${theme === id}">
        <span class="appearance-radio"></span>
        <span class="appearance-option-text"><span class="appearance-option-name">${name}</span><span class="appearance-option-sub">${sub}</span></span>
        <span class="appearance-preview appearance-preview-${id}"><span class="ap-side"></span><span class="ap-main"><span class="ap-bar"></span><span class="ap-card"></span></span></span>
      </button>`;
    return `
      <div class="settings-section-title">Appearance</div>
      <div class="settings-section-sub">Choose how HireLab looks on this device. Your choice is saved and applied whenever you come back.</div>
      <div class="appearance-group" role="radiogroup" aria-label="Theme">
        <div class="appearance-label">Theme</div>
        ${opt("light", "Light", "The default, bright look")}
        ${opt("dark", "Dark", "Easier on the eyes in low light")}
      </div>
      <div class="appearance-group">
        <div class="appearance-label">Accent color <span class="appearance-current">${(ACCENT_OPTIONS.find((o) => o[0] === accent) || ACCENT_OPTIONS[0])[1]}</span></div>
        <p class="appearance-hint">Used for active navigation, buttons, focus rings and links.</p>
        <div class="appearance-swatches" role="radiogroup" aria-label="Accent color">
          ${ACCENT_OPTIONS.map(([id, n]) => `<button type="button" class="appearance-swatch sw-${id} ${accent === id ? "selected" : ""}" data-accent-option="${id}" role="radio" aria-checked="${accent === id}" aria-label="${n}"></button>`).join("")}
        </div>
      </div>`;
  }

  function renderSettingsView(){
    const tabs = [
      { id: "personal", label: "Personal", icon: ICON.user },
      { id: "organization", label: "Organization", icon: ICON.briefcase },
      { id: "team", label: "Team", icon: ICON.users },

    ];
    const panels = {

    // The mobile detail screen only exists at mobile widths (<= 860px, see --mobile-bp). Several entry points set
    // mobileSettingsScreen = "detail" even on desktop; rendering that panel a second time there duplicated every
    // element id in it, and getElementById() (which the handlers use) then found the hidden copy first.
    const isDetail = state.mobileSettingsScreen === "detail" && window.matchMedia("(max-width: 860px)").matches;
    const activeTab = tabs.find((t) => t.id === state.settingsSection) || tabs[0];

    // ---- mobile: either the root menu list, or the single open section ----
    const mobileBody = isDetail

    return `

      <div class="settings-search ${isDetail ? "settings-search-hide-m" : ""}">

          ${tabs.map((t) => `<button class="settings-tab ${state.settingsSection === t.id ? "active" : ""}" data-settings-tab="${t.id}">${t.icon}<span class="settings-tab-text"><span class="settings-tab-label">${t.label}</span><span class="settings-tab-desc" data-desc="${escapeHtml(SETTINGS_INDEX[t.id].desc)}">${escapeHtml(SETTINGS_INDEX[t.id].desc)}</span></span></button>`).join("")}
          <div class="settings-search-empty" hidden>No settings match your search.</div>
        </div>
        <div class="settings-panel">

  }

  // the model list to whichever provider is selected — see renderSettingsApiKeys.

  // Meta isn't offered: unlike the other five, Meta has no first-party inference API to hold a direct BYOK key
  // for — Llama models are only reachable through a specific third-party host (Together, Groq, Bedrock, ...),

  // ---- Ending date picker (New position) ----
  function dpIso(y, m, d){ return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
  function dpAdd(n){ const t = new Date(); t.setDate(t.getDate() + n); return dpIso(t.getFullYear(), t.getMonth(), t.getDate()); }
  function renderEndDatePicker(d, open, view){
    const today = dpAdd(0);
    const [vy, vm] = (view || (d.endDate || today).slice(0, 7)).split("-").map(Number);
    const first = new Date(vy, vm - 1, 1);
    const cells = Array(first.getDay()).fill(0).concat(Array.from({ length: new Date(vy, vm, 0).getDate() }, (_, i) => i + 1));
    const label = d.endDate ? new Date(d.endDate + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
    return `
      <div class="np-select-wrap" id="np-end-date-picker" data-open="${open ? 1 : 0}" data-view="${vy}-${String(vm).padStart(2, "0")}">
        <button type="button" class="np-select-btn ${open ? "open" : ""}" id="np-end-date-toggle" aria-haspopup="dialog" aria-expanded="${open ? "true" : "false"}">
          <i class="ph ph-calendar-blank"></i><span class="date-text ${label ? "" : "empty"}">${label || "Choose a date"}</span>${ICON.chevronDown}
        </button>
        <div class="np-select-panel date-pop ${open ? "open" : ""}" role="dialog" aria-label="Choose deadline">
          <div class="date-quick">${[["In 1 week", 7], ["In 2 weeks", 14], ["In 30 days", 30]].map(([l, n]) => `<button type="button" class="date-chip ${d.endDate === dpAdd(n) ? "active" : ""}" data-date-pick="${dpAdd(n)}">${l}</button>`).join("")}</div>
          <div class="date-head">
            <button type="button" class="date-nav" data-date-nav="-1" aria-label="Previous month"><i class="ph ph-caret-left"></i></button>
            <span>${first.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</span>
            <button type="button" class="date-nav" data-date-nav="1" aria-label="Next month"><i class="ph ph-caret-right"></i></button>
          </div>
          <div class="date-grid">
            ${["S", "M", "T", "W", "T", "F", "S"].map((w) => `<span class="date-dow">${w}</span>`).join("")}
            ${cells.map((n) => { if (!n) return "<span></span>"; const iso = dpIso(vy, vm - 1, n); return `<button type="button" class="date-day ${iso === d.endDate ? "sel" : ""} ${iso === today ? "today" : ""}" data-date-pick="${iso}" ${iso < today ? "disabled" : ""}>${n}</button>`; }).join("")}
          </div>

        </div>
      </div>`;
  }
  function refreshEndDatePicker(open, view){
    const el = document.getElementById("np-end-date-picker");
    if (!el) return;
    el.outerHTML = renderEndDatePicker(state.newPosDraft, open, view);
    bindEndDatePicker();
  }
  function bindEndDatePicker(){
    const root = document.getElementById("np-end-date-picker");
    if (!root) return;
    const isOpen = root.dataset.open === "1", view = root.dataset.view;
    root.querySelector("#np-end-date-toggle").addEventListener("click", (e) => { e.stopPropagation(); refreshEndDatePicker(!isOpen); });
    root.querySelectorAll("[data-date-nav]").forEach((b) => b.addEventListener("click", (e) => {
      e.stopPropagation();
      const [y, m] = view.split("-").map(Number), t = new Date(y, m - 1 + Number(b.dataset.dateNav), 1);
      refreshEndDatePicker(true, dpIso(t.getFullYear(), t.getMonth(), 1).slice(0, 7));
    }));
    root.querySelectorAll("[data-date-pick]").forEach((b) => b.addEventListener("click", (e) => {
      e.stopPropagation(); state.newPosDraft.endDate = b.dataset.datePick; refreshEndDatePicker(false);
      document.getElementById("np-deadline-field")?.classList.remove("has-error");
      const dlErr = document.getElementById("np-deadline-error"); if (dlErr) dlErr.hidden = true;
    }));
  }
