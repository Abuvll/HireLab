  .ov2-card-eyebrow{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text); margin-bottom:6px; }

  /* ---- 4 stat tiles ---- */
  .ov2-stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .ov2-stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow-card); padding:18px 20px; display:flex; flex-direction:column; gap:16px; text-align:left; width:100%; }
  .ov2-stat-icon{ color:var(--text-faint); line-height:1; }
  .ov2-stat-icon svg{ width:22px; height:22px; }
  .ov2-stat-num{ font-family:var(--serif-display); font-size:29px; font-weight:600; letter-spacing:-0.02em; line-height:1; color:var(--text); }
  .ov2-stat-label{ font-size:13px; color:var(--text-muted); margin-top:4px; }

  /* ---- best match ---- */
  .ov2-bestmatch{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-card); padding:22px; }
  .ov2-bm-top{ display:flex; align-items:center; gap:18px; }
  .ov2-bm-title{ font-size:14px; font-weight:700; margin-bottom:6px; }
  .ov2-bm-sub{ font-size:13px; color:var(--text-muted); line-height:1.5; }
  .ov2-bm-sub b{ color:var(--text); font-weight:600; }
  .ov2-view-btn{ display:flex; align-items:center; justify-content:space-between; width:100%; background:var(--surface-sunken); border:none; border-radius:14px; padding:14px 18px; font-size:13.5px; font-weight:600; color:var(--text); margin-top:18px; transition:background .15s ease,transform .15s ease; }
  .ov2-view-btn:hover{ background:var(--accent-soft); transform:translateY(-1px); }
  .ov2-view-btn svg{ width:15px; height:15px; color:var(--text-faint); }
  .ov2-bm-list{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border-light); display:flex; flex-direction:column; gap:2px; }
  .ov2-bm-empty{ padding:20px 4px; text-align:center; font-size:13px; color:var(--text-muted); }

  /* ---- pipeline health ---- */
  .ov2-pipeline{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-card); padding:20px 22px; }
  .ov2-pipeline-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .ov2-pipeline-label{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); }
  .ov2-pipeline-link{ color:var(--text-faint); display:flex; }
  .ov2-pipeline-link svg{ width:16px; height:16px; }
  .ov2-pipeline-num{ font-family:var(--serif-display); font-size:34px; font-weight:600; letter-spacing:-0.02em; line-height:1; margin-bottom:14px; }
  .ov2-pipeline-bar{ height:8px; border-radius:999px; background:var(--tint); overflow:hidden; margin-bottom:12px; }
  .ov2-pipeline-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width 1s cubic-bezier(.16,.8,.3,1); }
  .ov2-pipeline-caption{ font-size:13px; color:var(--text-muted); }

  /* ---- efficiency ---- */
  .ov2-eff-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-card); padding:22px; }
  .ov2-eff-sub{ font-size:13px; color:var(--text-muted); line-height:1.4; margin-bottom:16px; }
  .ov2-eff-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .ov2-eff-right{ display:flex; flex-direction:column; gap:12px; }
  .ov2-eff-cell{ background:var(--surface-sunken); border-radius:14px; padding:16px; display:flex; flex-direction:column; }
  .ov2-eff-tall{ justify-content:space-between; min-height:222px; }
  .ov2-eff-right .ov2-eff-cell{ flex:1; justify-content:flex-start; gap:10px; }
  .ov2-eff-cell{ color:var(--text-faint); }
  .ov2-eff-cell svg{ width:20px; height:20px; }
  .ov2-eff-highlight{ background:var(--accent-highlight); }
  .ov2-eff-num{ font-family:var(--serif-display); font-size:29px; font-weight:600; letter-spacing:-0.02em; line-height:1; color:var(--text); }
  .ov2-eff-unit{ font-size:15px; font-weight:500; margin-left:3px; color:var(--text-muted); }
  .ov2-eff-label{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }

  /* ---- screening volume ---- */
  .ov2-screen-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-card); padding:22px; }
  .ov2-screen-num-row{ display:flex; align-items:baseline; gap:8px; margin:14px 0 4px; }
  .ov2-screen-num{ font-family:var(--sans); font-size:42px; font-weight:800; letter-spacing:-0.02em; color:var(--text); }
  .ov2-screen-num-suffix{ font-size:14px; color:var(--text-muted); }
  .ov2-screen-delta{ font-size:13.5px; color:var(--text-muted); margin-bottom:78px; }
  .ov2-screen-chart{ display:flex; align-items:flex-end; gap:10px; height:80px; }
  .ov2-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:10px; }
  .ov2-bar{ width:100%; max-width:30px; border-radius:999px; background:#E9E9EC; min-height:6px; }
  .ov2-bar-active{ background:linear-gradient(180deg,var(--accent-grad-a),var(--accent-grad-b)); }
  .ov2-bar-label{ font-size:10.5px; color:var(--text-faint); }

  @media (max-width: 1000px){
    .ov2-grid{ grid-template-columns:1fr; }
  }

  @media (max-width: 1000px){
    .detail-grid, .pos-lower-grid, .ov-hero-row, .ov-secondary-row{grid-template-columns:1fr;}
    .stats-grid, .positions-grid, .ov-tiles{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width: 720px){
    .app{padding:12px;gap:12px;}
    .sidebar{width:64px;}
    .rail-item{width:38px;height:38px;}
    .rail-brand{width:36px;height:36px;}
    .stats-grid, .positions-grid, .gh-stats, .ov-tiles{grid-template-columns:1fr 1fr;}
  }

  /* ================================================================
     MOBILE EXPERIENCE
     3 bottom tabs — Overview / Posting / Settings — replace the
     desktop rail + breadcrumb below the mobile breakpoint. Everything
     in this block is inert (display:none) above the breakpoint so the
     desktop app is untouched.
  ================================================================ */
  :root{
    --mobile-bp: 860px;
    /* Fluid tokens: scale smoothly across the whole phone range (340px small
       phones -> 860px large phones/phablets) instead of jumping between a
       handful of fixed breakpoints. Every mobile rule below that previously
       hardcoded a size now pulls from one of these, so small phones get a
       usable floor and large phones get real growth instead of empty margin. */
    --m-pad: clamp(14px, 6.154px + 2.308vw, 26px);        /* content side padding */
    --m-gap: clamp(10px, 4.769px + 1.538vw, 18px);        /* section-to-section gap */
    --m-card-pad: clamp(14px, 10.08px + 1.154vw, 20px);   /* card-body padding */
    --tabbar-h: clamp(66px, 52.92px + 3.846vw, 86px);
    --tab-btn: clamp(40px, 30.85px + 2.692vw, 54px);
    --tab-icon: clamp(18px, 13.42px + 1.346vw, 25px);
    --tab-pill-maxw: clamp(240px, 187.7px + 15.38vw, 320px);
    --m-hbtn: clamp(32px, 26.77px + 1.538vw, 40px);
    --m-hbtn-icon: clamp(15px, 13.04px + 0.577vw, 18px);
    --m-header-fs: clamp(16px, 14.04px + 0.577vw, 19px);
    --m-header-fs-noback: clamp(19px, 15.73px + 0.962vw, 24px);
    --m-wordmark-fs: clamp(21px, 17.08px + 1.154vw, 27px);
    --stat-num-fs: clamp(19px, 14.42px + 1.346vw, 26px);
    --stat-label-fs: clamp(10px, 8.692px + 0.385vw, 12px);
    --stat-tile-pad: clamp(11px, 7.731px + 0.962vw, 16px);
    --stat-tile-minh: clamp(78px, 66.23px + 3.462vw, 96px);
    --stat-tile-icon: clamp(15px, 12.38px + 0.769vw, 19px);
    --avatar-sm: clamp(28px, 22.77px + 1.538vw, 36px);
    --avatar-sm-fs: clamp(10px, 8.038px + 0.577vw, 13px);
    --avatar-lg: clamp(42px, 32.85px + 2.692vw, 56px);
    --avatar-lg-fs: clamp(13px, 10.38px + 0.769vw, 17px);
  }

  .m-only{ display:none; }
  .d-only{ display:initial; }
  .side-stat-value{ font-size:22px; font-weight:700; letter-spacing:-0.02em; font-family:var(--mono); }
  .side-card-btn{ display:block; width:100%; text-align:left; }
  .btn-view-candidate{
    display:inline-flex; align-items:center; gap:4px; background:var(--tint); border:none;
    border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--text);
  }
  .btn-view-candidate svg{width:12px;height:12px;}

  @media (max-width: 860px){
    /* ---- kill desktop chrome, let mobile chrome take over ---- */
    .app{padding:0;gap:0;display:block;min-height:100vh;}
    .sidebar{display:none;}
    .main{width:100%;}
    .topbar{display:none;}
    .content{padding:0 var(--m-pad) calc(var(--tabbar-h) + 20px);width:100%;max-width:min(760px, 100vw);margin:0 auto;box-sizing:border-box;}
    .help-topic-grid{grid-template-columns:repeat(2,1fr);padding:14px;}

    .m-only{ display:block; }
    .m-only.m-flex{ display:flex; }
    .d-only{ display:none !important; }

    /* ---------- overview redesign: mobile stack ---------- */
    .ov2-desktop{ display:none; }
    .ov2-mobile-stack{ gap:var(--m-gap); }
    .ov2-mobile-stack .ov2-stat-grid{ gap:8px; }
    .ov2-mobile-stack .ov2-stat-tile{ padding:var(--stat-tile-pad); gap:10px; min-height:var(--stat-tile-minh); border-radius:14px; }
    .ov2-mobile-stack .ov2-stat-icon svg{ width:var(--stat-tile-icon); height:var(--stat-tile-icon); }
    .ov2-mobile-stack .ov2-stat-num{ font-size:var(--stat-num-fs); }
    .ov2-mobile-stack .ov2-stat-label{ font-size:var(--stat-label-fs); }
    .ov2-mobile-stack .ov2-bestmatch,
    .ov2-mobile-stack .ov2-pipeline,
    .ov2-mobile-stack .ov2-eff-card,
    .ov2-mobile-stack .ov2-screen-card{ padding:var(--m-card-pad); border-radius:18px; }
    .ov2-mobile-stack .ov2-eff-tall{ min-height:180px; }
    .ov2-mobile-stack .ov2-screen-num{ font-size:36px; }
    .ov2-mobile-stack .ov2-screen-delta{ margin-bottom:36px; }

    /* ---------- bottom tab bar ---------- */
    .mobile-tabbar{
      position:fixed; left:0; right:0; bottom:0; z-index:90;
      display:flex; justify-content:center;
      padding: 0 18px calc(12px + env(safe-area-inset-bottom, 0px));
      pointer-events:none;
    }
    .mobile-tabbar-inner{
      pointer-events:auto;
      display:flex; align-items:center; gap:clamp(4px, 1vw, 8px);
      background:
        radial-gradient(130% 200% at 20% -30%, rgba(255,255,255,.95), transparent 55%),
        linear-gradient(165deg, rgba(255,255,255,.84), rgba(255,255,255,.6));
      backdrop-filter:blur(26px) saturate(2.2);
      -webkit-backdrop-filter:blur(26px) saturate(2.2);
      border:1px solid rgba(255,255,255,.9);
      border-radius:999px;
      padding:clamp(6px, 1.2vw, 9px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,1), inset 0 0 0 1px rgba(255,255,255,.25),
        0 18px 40px -16px rgba(23,23,26,.32), 0 2px 10px -3px rgba(23,23,26,.12);
      width:100%; max-width:var(--tab-pill-maxw);
    }
    .mobile-tab-btn{
      flex:1; display:flex; align-items:center; justify-content:center;
      height:var(--tab-btn); border:none; background:transparent; border-radius:999px;
      color:var(--text-faint); position:relative; transition:background .25s ease, color .2s ease;
    }
    .mobile-tab-btn i{font-size:var(--tab-icon); line-height:1;}
    #mtab-new-position i{ font-size:calc(var(--tab-icon) * 1.15); } /* plus-circle glyph sits smaller in its box; scale to match the other tab icons */
    .mobile-tab-btn.active{ background:var(--accent-soft); color:var(--accent-text); }
    .mobile-tab-btn:active{ transform:scale(.94); }

    /* ---------- generic mobile section header (Posting, sub-screens) ---------- */
    .m-header{
      display:flex; align-items:center; gap:8px;
      padding:14px 2px 10px;
      position:sticky; top:0; z-index:20;
      background:linear-gradient(var(--bg) 62%, transparent);
      margin:0 calc(var(--m-pad) * -1) 2px; padding-left:var(--m-pad); padding-right:var(--m-pad);
    }
    .m-header-right{ margin-left:auto; flex-shrink:0; }
    .m-header-btn{
      width:var(--m-hbtn); height:var(--m-hbtn); border-radius:999px; border:1px solid var(--border);
      background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
    }
    .m-header-btn i{font-size:var(--m-hbtn-icon);}
    .m-header-title{
      flex:1; text-align:center; font-family:var(--serif-display); font-weight:600;
      font-size:var(--m-header-fs); letter-spacing:-.01em; color:var(--text);
      margin-right:var(--m-hbtn); /* balances the back button so text is optically centered */
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .m-header.no-back .m-header-title{ margin-right:0; text-align:left; font-size:var(--m-header-fs-noback); }

    /* ---------- overview: watermark + notification ---------- */
    .m-overview-top{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 2px 12px;
    }
    .m-wordmark{
      font-family:var(--serif-italic); font-style:italic; font-weight:400;
      font-size:var(--m-wordmark-fs); letter-spacing:.01em; color:var(--text); line-height:1;
    }
    .m-notif-btn{
      position:relative; width:var(--m-hbtn); height:var(--m-hbtn); border-radius:999px; border:1px solid var(--border);
      background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text); flex-shrink:0;
    }
    .m-notif-btn i{font-size:var(--m-hbtn-icon);}
    .m-notif-dot{ position:absolute; top:7px; right:8px; width:6px; height:6px; border-radius:999px; background:#C24E3A; border:1.5px solid var(--surface); }

    /* ---------- overview: editorial stat tiles ---------- */
    .m-stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(8px, 1.6vw, 12px); margin-bottom:var(--m-gap); }
    .m-stat-tile{ border-radius:14px; padding:var(--stat-tile-pad) var(--stat-tile-pad) calc(var(--stat-tile-pad) - 1px); display:flex; flex-direction:column; justify-content:space-between; min-height:var(--stat-tile-minh); }
    .m-stat-tile.light{ background:var(--surface); border:1px solid var(--border-light); box-shadow:var(--shadow-card); }
    .m-stat-tile i{font-size:var(--stat-tile-icon); color:var(--text-faint);}
    .m-stat-num{ font-family:var(--serif-display); font-size:var(--stat-num-fs); font-weight:600; letter-spacing:-.02em; line-height:1.05; margin-top:6px; }
    .m-stat-label{ font-size:var(--stat-label-fs); color:var(--text-muted); margin-top:1px; }

    /* ---------- overview: top-candidate ring card ---------- */
    .match-ring-card{ padding:14px; gap:12px; margin-bottom:0 !important; border-radius:16px; flex-wrap:nowrap; }
    .match-ring, .match-ring svg{ width:56px; height:56px; }
    .match-ring-label{ font-size:12px; }
    .ring-info{ min-width:0; }
    .ring-info .ri-title{ font-size:12px; margin-bottom:3px; }
    .ring-info .ri-sub{ font-size:12px; line-height:1.4; }
    .ring-chips{ margin-top:8px; }

    /* ---------- overview: quality + team, side by side ---------- */
    .pos-lower-grid{ gap:0; margin-bottom:var(--m-gap) !important; }
    .d-qt-col{ display:none; }
    .m-qt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:var(--m-gap); }
    .m-qt-grid .side-card{ margin-bottom:0; padding:14px; }
    .side-card h4{ font-size:10px; margin-bottom:6px; }
    .side-stat-value{ font-size:19px; }
    .side-note{ font-size:11.5px; line-height:1.5; }

    /* ---------- overview: recent activity ---------- */
    .card-header{ padding:12px 14px; }
    .card-header h3{ font-size:12.5px; }
    .activity-row{ padding:11px 14px; gap:10px; }
    .activity-name{ font-size:12.5px; }
    .activity-meta{ font-size:11px; }
    .avatar{ width:var(--avatar-sm); height:var(--avatar-sm); font-size:var(--avatar-sm-fs); }
    .match-badge{ font-size:11px; padding:3px 8px; }
    .activity-time{ font-size:10.5px; }

    /* ---------- overview: bento redesign, mobile scale ---------- */
    .ov-hero-row, .ov-secondary-row{ gap:var(--m-gap); margin-bottom:var(--m-gap); }
    .ov-hero{ padding:20px 20px 22px; min-height:0; border-radius:18px; gap:14px; }
    .ov-hero-num{ font-size:34px; }
    .ov-hero-num span{ font-size:15px; }
    .ov-hero-label{ font-size:13px; max-width:none; }
    .ov-hero-cta{ padding:10px 15px; font-size:13px; }
    .ov-spotlight{ padding:16px 18px; border-radius:18px; }
    .ov-spotlight-top{ gap:12px; }
    .ov-funnel-card{ margin-bottom:var(--m-gap); }
    .ov-funnel-body{ padding:14px 16px 16px; }
    .ov-tiles{ gap:8px; margin-bottom:var(--m-gap); }
    .ov-tile{ padding:var(--stat-tile-pad); gap:10px; min-height:var(--stat-tile-minh); border-radius:14px; }
    .ov-tile-icon{ width:28px; height:28px; border-radius:8px; }
    .ov-tile-icon i{ font-size:var(--stat-tile-icon); }
    .ov-tile-num{ font-size:var(--stat-num-fs); }
    .ov-tile-label{ font-size:var(--stat-label-fs); }
    .ov-tile-sub{ display:none; }
    .ov-insight{ padding:18px 20px; border-radius:18px; }
    .ov-insight-headline{ font-size:18px; }
    .ov-attention{ border-radius:18px; }
    .ov-attention-row{ padding:11px 16px; }

    /* ---------- posting: search + filter ---------- */
    .btn-new-mobile{
      display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
      background:var(--emerald-bg); color:var(--emerald); border:1px solid var(--emerald-border);
      border-radius:999px; padding:14px; font-size:14.5px; font-weight:600; font-family:var(--sans);
      margin-bottom:14px; box-shadow:var(--shadow-card);
    }
    .btn-new-mobile svg{ width:16px; height:16px; color:var(--emerald); }
    .m-search-row{ display:flex; gap:8px; margin-bottom:8px; }
    .m-search-box{
      flex:1; display:flex; align-items:center; gap:8px;
      background:var(--surface); border:1px solid var(--border); border-radius:999px;
      padding:0 14px; height:42px;
    }
    .m-search-box i{ color:var(--text-faint); font-size:16px; flex-shrink:0; }
    .m-search-box input{
      border:none; outline:none; background:transparent; font-size:14px; width:100%;
      color:var(--text); font-family:var(--sans);
    }
    .m-search-box input::placeholder{ color:var(--text-faint); }
    .m-filter-btn{
      width:42px; height:42px; border-radius:999px; border:1px solid var(--border);
      background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;
      flex-shrink:0; position:relative;
    }
    .m-filter-btn i{font-size:17px;}
    .m-filter-btn.has-filters{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
    .m-chip-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none; }
    .m-chip-row::-webkit-scrollbar{ display:none; }
    .m-status-chip{
      flex-shrink:0; padding:7px 14px; border-radius:999px; border:1px solid var(--border);
      background:var(--surface); font-size:12.5px; font-weight:500; color:var(--text-muted); white-space:nowrap;
    }
    .m-status-chip.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
    .m-results-count{ font-size:12px; color:var(--text-faint); margin:0 2px 8px; }

    /* ---------- posting cards now share one editorial skin (see base
       CSS above) on every viewport; only the grid stacks to 1 column here. */
    .positions-grid{ display:flex; flex-direction:column; gap:16px; }

    /* ---------- filter bottom sheet (pop-out) ---------- */
    .m-sheet-overlay{
      position:fixed; inset:0; background:rgba(23,23,26,.35); z-index:120;
      display:none; align-items:flex-end; justify-content:center;
      opacity:0; transition:opacity .22s ease;
    }
    .m-sheet-overlay.show{ display:flex; opacity:1; }
    .m-sheet{
      width:100%; max-width:520px;
      background:var(--surface);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0; padding:12px 18px calc(20px + env(safe-area-inset-bottom, 0px));
      box-shadow:var(--shadow-lift);
      transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
      max-height:80vh; overflow-y:auto;
    }
    .m-sheet-overlay.show .m-sheet{ transform:translateY(0); }
    .m-sheet-handle{ width:36px; height:4px; border-radius:999px; background:var(--border-strong); margin:0 auto 16px; }
    .m-sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .m-sheet-head h3{ font-family:var(--serif-display); font-size:17px; font-weight:600; margin:0; }
    .m-sheet-close{ width:28px; height:28px; border-radius:999px; background:var(--tint); border:none; display:flex; align-items:center; justify-content:center; color:var(--text); }
    .m-sheet-close i{font-size:14px;}
    .m-sheet-group{ margin-bottom:16px; }
    .m-sheet-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin-bottom:10px; }
    .m-sheet-chips{ display:flex; flex-wrap:wrap; gap:8px; }
    .m-sheet-chip{ padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface-sunken); font-size:13px; font-weight:500; color:var(--text-muted); }
    .m-sheet-chip.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
    .m-sheet-apply{
      width:100%; margin-top:4px; padding:14px; border-radius:999px; border:none;
      background:var(--accent); color:var(--on-accent); font-size:14px; font-weight:600; font-family:var(--sans);
    }
    .m-sheet-reset{ width:100%; text-align:center; padding:12px; background:none; border:none; color:var(--text-muted); font-size:13px; margin-top:2px; }

    /* ---------- shared: card body ---------- */
    .card-body{ padding:var(--m-card-pad); }

    /* ---------- position detail: header ---------- */
    .pos-detail-header{ margin-bottom:14px; }
    .pos-title-row{ gap:8px; }
    .pos-title-row h2{ font-size:19px; }
    .pos-loc-line{ font-size:12.5px; margin-top:3px; }
    .jd-chips{ margin:12px 0 6px; gap:6px; }
    .jd-chip{ font-size:11.5px; padding:5px 11px; }
    .jd-toggle{ font-size:12.5px; }
    .jd-full{ font-size:13px; line-height:1.6; padding:12px 14px; }

    /* ---------- position detail: funnel + team ---------- */
    .funnel-row{ gap:8px; margin-bottom:8px; }
    .funnel-label{ width:76px; font-size:11px; }
    .funnel-track{ height:22px; }
    .funnel-fill span{ font-size:11px; }
    .team-list{ gap:8px; margin-bottom:12px; }
    .team-avatar{ width:28px; height:28px; font-size:10px; }
    .team-name{ font-size:12.5px; }
    .team-role{ font-size:10.5px; }
    .btn-add-team{ font-size:12.5px; padding:10px; }
    .card-badge{ font-size:11px; }

    /* ---------- candidate toolbar (search/filter/topN) ---------- */
    .toolbar{ gap:8px; margin-bottom:12px; }
    .topn-wrap{ order:1; }
    .topn-btn{ padding:7px 10px; font-size:13px; }
    .filter-btn-wrap{ order:2; margin-left:auto; }
    .filter-btn{ padding:7px 10px; font-size:13px; }
    .search-wrap{ order:3; flex-basis:100%; padding:7px 10px; }
    .search-wrap input{ font-size:13px; }
    .filter-panel{ width:min(320px, calc(100vw - 64px)); }
    .topn-panel{ width:min(200px, calc(100vw - 64px)); }

    /* ---------- candidate list rows ----------
       Desktop rows are a rigid multi-column flex line (name/skills/composite
       bar/standout text all at fixed widths) that overflows badly under
       ~660px. On mobile we reflow to two lines: identity + match on top,
       skills and the composite bar wrapped below; the rarely-critical
       standout text and chevron (the row is already fully clickable) drop. */
    .candidate-row{ flex-wrap:wrap; padding:12px 14px; gap:6px 8px; align-items:center; }
    .rank-num{ width:16px; font-size:13px; order:1; }
    .candidate-row .avatar{ width:var(--avatar-sm); height:var(--avatar-sm); font-size:var(--avatar-sm-fs); order:2; }
    .cand-name-block{ width:auto; flex:1 1 auto; min-width:0; order:3; }
    .cand-name{ font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cand-sub{ font-size:10.5px; }
    .candidate-row .match-badge{ order:4; font-size:11px; padding:3px 8px; flex-shrink:0; }
    .skills-block{ order:5; flex-basis:100%; width:auto; gap:5px; }
    .comp-block{ order:6; flex-basis:100%; width:auto; }
    .standout-text, .row-chevron{ display:none; }

    /* ---------- candidate detail: desktop recommendation ---------- */
    .m-desktop-hint{
      display:flex; align-items:flex-start; gap:8px;
      background:var(--surface-sunken); border:1px solid var(--border);
      border-radius:12px; padding:10px 12px; margin-bottom:14px;
      font-size:11.5px; color:var(--text-muted); line-height:1.45;
    }
    .m-desktop-hint i{ font-size:15px; color:var(--text-faint); flex-shrink:0; margin-top:1px; }

    /* ---------- candidate detail: header + actions ---------- */
    .detail-header{ gap:12px; margin-bottom:16px; }
    .detail-id{ gap:10px; }
    .avatar.lg{ width:var(--avatar-lg); height:var(--avatar-lg); font-size:var(--avatar-lg-fs); }
    .detail-name-row{ flex-wrap:wrap; }
    .detail-name-row h2{ font-size:17px; }
    .rank-tag{ font-size:11px; }
    .percentile-line{ font-size:11px; }
    .detail-sub{ font-size:12px; }
    .detail-actions{ width:100%; gap:8px; }
    .detail-actions .match-badge{ font-size:13px !important; padding:6px 12px !important; flex-basis:100%; text-align:center; order:1; }
    .btn-email, .btn-phone{ flex:1; justify-content:center; font-size:13px; padding:10px 8px; order:2; }
    .card-header{ flex-wrap:wrap; row-gap:4px; }
    .card-header a.card-badge{ flex-basis:100%; }

    /* ---------- candidate detail: requirements vs evidence ----------
       Keeps the real REQUIREMENT / EVIDENCE table (matching desktop) instead of
       stacking rows into an unlabeled list. It scrolls horizontally only as a
       fallback if it doesn't fit — same contained-scroller mechanism as
       .repo-table-scroll — rather than reflowing the layout. */
    .evidence-table-scroll{
      overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
      overscroll-behavior-x:contain; touch-action:pan-x;
      scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent;
    }
    .evidence-table-scroll::-webkit-scrollbar{ height:3px; }
    .evidence-table-scroll::-webkit-scrollbar-track{ background:var(--border-light); border-radius:999px; }
    .evidence-table-scroll::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:999px; }
    .evidence-table{ width:100%; border-collapse:collapse; }
    .evidence-table td, .evidence-table th{ padding:9px 5px; font-size:12.5px; }
    .evidence-table th{ font-size:10.5px; }
    .evidence-req{ font-size:12.5px; width:36%; }
    .evidence-status{ width:26px; }
    .evidence-status svg{ width:14px; height:14px; }
    .evidence-note{ font-size:12px; line-height:1.5; }

    /* ---------- candidate detail: career timeline ---------- */
    .exp-timeline{ padding-left:16px; }
    .exp-item{ margin-bottom:16px; }
    .exp-item::before{ left:-16px; }
    .exp-role{ font-size:13px; }
    .exp-company{ font-size:12px; }
    .exp-dates{ font-size:10px; }
    .exp-achievements{ font-size:12px; }

    /* ---------- candidate detail: score breakdown ---------- */
    .score-bar-row{ margin-bottom:12px; }
    .score-bar-top{ align-items:flex-start; }
    .score-bar-top .lab{ font-size:12.5px; padding-right:8px; }
    .score-bar-top .val{ font-size:12.5px; text-align:right; flex-shrink:0; }
    .score-bar-top .pct{ display:block; margin-left:0; margin-top:1px; font-size:10px; }

    /* ---------- candidate detail: github analysis ---------- */
    .gh-stats{ grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
    .gh-stat-value{ font-size:17px; }
    .gh-stat-label{ font-size:11px; }
    .lang-legend{ gap:10px; }
    .lang-legend-item{ font-size:11px; }
    .shipped-item{ padding:8px 10px; flex-wrap:wrap; align-items:flex-start; row-gap:4px; }
    .shipped-name{ font-size:12.5px; }
    .shipped-url{ font-size:10.5px; flex-basis:100%; word-break:break-all; }

    /* ---------- candidate detail: per-repo table -> horizontal scroll ----------
       Repo + Origin fill the initial view; swiping horizontally reveals
       Stars / Commits / Complexity. The table itself scrolls inside a
       contained scroller (.repo-table-scroll) so rows stay perfectly
       aligned and the page never moves horizontally. */
    /* .detail-col is a grid item; without min-width:0 its implicit auto-min
       size is content-based, so the fixed-width scrollable table inside
       .card-repo would inflate the whole column instead of scrolling
       internally. This has no visual effect when content already fits. */
    .detail-col{ min-width:0; }
    .card-repo{ min-width:0; }
    .repo-swipe-hint{ font-size:12.5px; color:var(--text-faint); margin:0 0 14px; }
    .repo-table-scroll{
      overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
      overscroll-behavior-x:contain; touch-action:pan-x;
      scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent;
    }
    .repo-table-scroll::-webkit-scrollbar{ height:3px; }
    .repo-table-scroll::-webkit-scrollbar-track{ background:var(--border-light); border-radius:999px; }
    .repo-table-scroll::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:999px; }
    .repo-table{ table-layout:fixed; width:656px; border-collapse:collapse; box-sizing:border-box; }
    .repo-table th{ box-sizing:border-box; font-size:11.5px; font-weight:700; letter-spacing:.02em; padding:0 12px 10px 0; white-space:nowrap; }
    .repo-table td{ box-sizing:border-box; font-size:13.5px; padding:14px 12px 14px 0; white-space:nowrap; }
    .repo-table th:first-child, .repo-table td:first-child{ padding-left:0; }
    .repo-table th:nth-child(1), .repo-table td:nth-child(1){ width:200px; white-space:normal; }
    .repo-table th:nth-child(2), .repo-table td:nth-child(2){ width:128px; }
    .repo-table th:nth-child(3), .repo-table td:nth-child(3){ width:100px; }
    .repo-table th:nth-child(4), .repo-table td:nth-child(4){ width:100px; }
    .repo-table th:nth-child(5), .repo-table td:nth-child(5){ width:128px; }
    .repo-name{ font-weight:700; font-size:13.5px; color:var(--text); }
    .origin-badge{ font-size:10px; padding:3px 10px; }
    .complexity-dots{ gap:4px; }
    .dot{ width:8px; height:8px; }

    /* ---------- candidate detail: tooling + authenticity ---------- */
    .check-row{ padding:7px 0; }
    .check-row span{ font-size:13px; }
    .flag-item{ font-size:13px; }

    /* ---------- settings: mobile root menu ---------- */
    .m-settings-menu{ display:flex; flex-direction:column; gap:10px; }
    .m-settings-row{
      display:flex; align-items:center; gap:12px; width:100%; text-align:left;
      background:var(--surface); border:1px solid var(--border-light); border-radius:var(--r-md);
      padding:13px 16px; box-shadow:var(--shadow-card); transition:background .12s ease, transform .12s ease;
    }
    .m-settings-row:active{ background:var(--accent-soft); transform:scale(.99); }
    .m-settings-row-icon{ display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text-muted); }
    .m-settings-row-icon svg{ width:18px; height:18px; }
    .m-settings-row-icon i{ font-size:18px; line-height:1; }
    .m-settings-row-label{ flex:1; font-size:14.5px; font-weight:700; color:var(--text); letter-spacing:-0.01em; }
    .m-settings-row-chevron{ display:flex; align-items:center; flex-shrink:0; color:var(--text-faint); }
    .m-settings-row-chevron svg{ width:16px; height:16px; }
    .settings-shell{ display:none; } /* replaced on mobile by .m-settings-menu / the single open section, above */
    .settings-panel{ padding:14px 14px; }

    /* ---------- compact form density on mobile ----------
       Desktop form spacing (24px section margins, 16px field gaps, 130px
       textareas) is too tall for shorter phone viewports and pushes fields /
       the save button off-screen. Tighten the vertical rhythm so longer forms
       (Organization, Personal) actually fit the visible screen instead of
       requiring a full extra scroll to reach the bottom. */
    .settings-section-title{ margin-bottom:2px; }
    .settings-section-sub{ margin-bottom:10px; }
    .settings-search{ max-width:none; margin-bottom:12px; }
    .settings-search-hide-m{ display:none; }
    .m-settings-row-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; text-align:left; }
    .m-settings-row-text .m-settings-row-label{ flex:none; }
    .m-settings-row-desc{ font-size:12px; font-weight:400; line-height:1.35; color:var(--text-muted); }
    .form-field{ margin-bottom:7px; }
    .form-field label{ margin-bottom:2px; }
    .form-field input[type="text"], .form-field input[type="password"], .form-field textarea, .form-field select{
      padding:7px 11px;
    }
    .form-field textarea{ min-height:56px; }
    .form-hint{ margin-top:3px; }
    .settings-divider{ margin:14px 0; }
    .submit-row-flat{ padding-top:0; }
    .submit-row-flat .btn-outline-dash, .submit-row-flat .btn-new{ padding:8px 18px; }

    /* ---------- misc component reflow ---------- */
    .positions-header{ display:none !important; } /* replaced by the m-header + search/filter row */
    .stats-grid{ display:none !important; } /* replaced by m-stat-grid tiles */
    .back-btn{ display:none !important; } /* replaced by the m-header back button */
    .detail-grid{ grid-template-columns:1fr !important; }
    .content > .card:first-child{ margin-top:0; }
  }

  /* ================================================================
     LARGE PHONE ENHANCEMENT
     From ~600px (large phones, phablets, unfolded foldables) up to the
     860px desktop handoff, the mobile chrome stays exactly the same
     design — same tab bar, same cards, same type — but there's enough
     width to show more at once instead of just widening the margins.
     Every rule here re-arranges existing markup into more columns; it
     never introduces new components or a different visual language.
  ================================================================ */
  @media (min-width: 600px) and (max-width: 860px){
    /* four stat tiles in one row instead of a 2x2 block */
    .m-stat-grid{ grid-template-columns:repeat(4, 1fr); }

    /* bring back the desktop-style side column (quality signal + team)
       next to the top-candidate ring, instead of the stacked mobile
       tile duplicate below it — same info, better use of the width */
    .pos-lower-grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:var(--m-gap); align-items:stretch; }
    .match-ring-card{ height:100%; }
    .d-qt-col{ display:flex; flex-direction:column; gap:var(--m-gap); }
    .m-qt-grid{ display:none; }

    /* job posting cards side by side */
    .positions-grid{ display:grid; grid-template-columns:1fr 1fr; }

    /* search bar shares a line with Top-N / Filters instead of forcing
       its own row underneath */
    .search-wrap{ flex-basis:auto; flex:1 1 200px; }

    /* candidate rows: skills + composite score sit side by side on
       their own line instead of each stacking full-width */
    .skills-block{ flex-basis:auto; width:auto; flex:1 1 220px; }
    .comp-block{ flex-basis:auto; width:180px; }

    /* GitHub summary back to a single row of four */
    .gh-stats{ grid-template-columns:repeat(4, 1fr); }

    /* overview bento: hero+spotlight and insight+attention side by side,
       four stat tiles in one row — same cards, better use of the width */
    .ov-hero-row, .ov-secondary-row{ grid-template-columns:1.4fr 1fr; }
    .ov-tiles{ grid-template-columns:repeat(4, 1fr); }
  }

  @media (min-width: 861px){
    .mobile-tabbar, .m-sheet-overlay{ display:none !important; }

    /* ---------- Postings: search + filter (same controls as mobile) ---------- */
    .posting-toolbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .view-toggle{ display:flex; gap:4px; padding:4px; margin-left:auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; }
    .view-toggle-btn{ width:34px; height:34px; border:none; border-radius:12px; background:none; color:var(--text-muted); display:flex; align-items:center; justify-content:center; }
    .view-toggle-btn i{ font-size:17px; }
    .view-toggle-btn.active{ background:var(--accent); color:var(--on-accent); }
    #btn-new-position{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
    #btn-new-position svg{ color:var(--on-ink); }
    .positions-grid.is-list{ grid-template-columns:1fr; gap:10px; }
    .is-list .position-card{ display:grid; grid-template-columns:minmax(200px,1.3fr) minmax(260px,1.6fr) minmax(140px,1fr); grid-template-areas:"top stats chips" "loc stats chips"; column-gap:16px; align-items:center; }
    .is-list .position-card-top{ grid-area:top; align-self:end; }
    .is-list .position-loc{ grid-area:loc; align-self:start; margin-bottom:0; padding-bottom:16px; }
    .is-list .position-stats-row{ grid-area:stats; border-top:none; margin:0; padding:0; }
    .is-list .position-chips-preview{ grid-area:chips; padding:0 14px; justify-content:flex-end; }
    .posting-toolbar .m-search-row{ display:flex; gap:8px; flex:1 1 320px; max-width:460px; }
    .posting-toolbar .m-search-box{
      flex:1; display:flex; align-items:center; gap:8px;
      background:var(--surface); border:1px solid var(--border); border-radius:999px;
      padding:0 14px; height:42px; transition:border-color .15s ease, box-shadow .15s ease;
    }
    .posting-toolbar .m-search-box:focus-within{ border-color:var(--text-faint); box-shadow:0 0 0 3px var(--tint); }
    .posting-toolbar .m-search-box i{ color:var(--text-faint); font-size:16px; flex-shrink:0; }
    .posting-toolbar .m-search-box input{
      border:none; outline:none; background:transparent; font-size:14px; width:100%;
      color:var(--text); font-family:var(--sans);
    }
    .posting-toolbar .m-search-box input::placeholder{ color:var(--text-faint); }
    .posting-toolbar .m-filter-btn{
      width:42px; height:42px; border-radius:999px; border:1px solid var(--border);
      background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;
      flex-shrink:0; position:relative;
    }
    .posting-toolbar .m-filter-btn i{ font-size:17px; }
    .posting-toolbar .m-filter-btn.has-filters{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
    .m-results-count{ font-size:12px; color:var(--text-faint); margin:0 2px 8px; }

  }

  @media (max-width: 860px){ .view-toggle{ display:none; } }
  .m-sheet-overlay{ display:none !important; } /* filters use the Position Details-style pop-up on every viewport */
  .filter-btn i{ font-size:15px; }

  /* ---------- new position: ending date picker ---------- */
  .np-select-btn i{ font-size:15px; color:var(--text-faint); }
  .date-text{ flex:1; text-align:left; }
  .date-text.empty{ color:var(--text-faint); }
  .date-pop{ right:auto; width:280px; padding:12px; }
  .date-quick{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .date-chip{ font-size:12px; font-weight:500; border-radius:999px; padding:5px 10px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); }
  .date-chip:hover{ border-color:var(--border-strong); }
  .date-chip.active{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .date-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:13.5px; font-weight:600; }
  .date-nav{ width:28px; height:28px; border-radius:999px; border:none; background:var(--tint); color:var(--text); display:flex; align-items:center; justify-content:center; }
  .date-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; text-align:center; }
  .date-dow{ font-size:11px; font-weight:600; color:var(--text-faint); padding:4px 0; }
  .date-day{ height:34px; border:none; border-radius:999px; background:none; font-size:13px; color:var(--text); }
  .date-day:hover:not(:disabled){ background:var(--accent-soft); }
  .date-day.today{ box-shadow:inset 0 0 0 1px var(--border-strong); }
  .date-day.sel{ background:var(--accent); color:var(--on-accent); }
  .date-day:disabled{ color:var(--border-strong); cursor:default; }
  .date-foot{ display:flex; justify-content:flex-end; margin-top:8px; }

  .m-toast{
    position:fixed; left:50%; bottom:calc(var(--tabbar-h) + 22px); transform:translate(-50%, 8px);
    background:var(--text); color:var(--on-ink); font-size:13px; font-weight:500;
    padding:11px 18px; border-radius:999px; box-shadow:var(--shadow-lift);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:200;
    max-width:86vw; text-align:center;
  }
  .m-toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ================= Dark theme (Settings -> Appearance) ================= */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1C1C1C; --surface:#303030; --surface-sunken:#262626; --border:#3A3A3A; --border-light:#353535; --border-strong:#4A4A4A;
    --text:#F5F5F5; --text-muted:#B8B8B8; --text-faint:#8C8C8C; --text-disabled:#6F6F6F; --tint:#3A3A3A;
    --emerald:#7FC29B; --emerald-bg:#22332A; --emerald-border:#345A44;
    --amber:#E0B071; --amber-bg:#3A2F1E; --amber-border:#5A4726;
    --red:#F0897A; --red-bg:#3A2522; --red-border:#5E3A34; --red-strong:#F2A093;
    --on-ink:#1C1C1C; --on-ink-soft:rgba(28,28,28,.66); --ink-surface:#3A3A3A; --ink-hover:#FFFFFF; --accent-highlight:#2B3345;
    --shadow-card:0 16px 34px -26px rgba(0,0,0,.65); --shadow-lift:0 22px 44px -22px rgba(0,0,0,.75);
  }
  :root[data-theme="dark"] body{
    background:radial-gradient(ellipse 900px 560px at 10% -10%, rgba(120,140,170,.10), transparent 60%),
      radial-gradient(ellipse 760px 520px at 96% 0%, rgba(150,120,110,.08), transparent 58%), var(--bg);
    background-attachment:fixed;
  }
  :root[data-theme="dark"] .rail-brand img, :root[data-theme="dark"] .auth-brand img{ filter:invert(1); }
  :root[data-theme="dark"] .mobile-tabbar-inner{
    background:linear-gradient(165deg, rgba(46,46,46,.94), rgba(30,30,30,.9)); border-color:rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 18px 40px -16px rgba(0,0,0,.7), 0 2px 10px -3px rgba(0,0,0,.4);
  }
  :root[data-theme="dark"] .toggle-switch:checked::after{ background:#1C1C1C; }
  :root[data-theme="dark"] .ov2-bar{ background:#3A3A3A; }
  :root[data-theme="dark"] input:disabled, :root[data-theme="dark"] textarea:disabled, :root[data-theme="dark"] select:disabled{ color:var(--text-disabled); }

  /* ---------- Settings -> Appearance ---------- */
  .settings-tab i{ font-size:15px; line-height:1; flex-shrink:0; }
  .appearance-group{ max-width:480px; margin-bottom:26px; }
  .appearance-label{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; }
  .appearance-hint{ font-size:12.5px; color:var(--text-muted); margin:-4px 0 12px; }
  .appearance-option{ width:100%; display:flex; align-items:center; gap:14px; padding:14px 16px; margin-bottom:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); text-align:left; color:var(--text); transition:border-color .15s ease, box-shadow .15s ease; }
  .appearance-option:hover{ border-color:var(--border-strong); }
  .appearance-option.selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .appearance-radio{ width:16px; height:16px; border-radius:999px; border:1.5px solid var(--border-strong); flex-shrink:0; position:relative; }
  .appearance-option.selected .appearance-radio{ border-color:var(--accent); }
  .appearance-option.selected .appearance-radio::after{ content:""; position:absolute; inset:3px; border-radius:999px; background:var(--accent); }
  .appearance-option-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .appearance-option-name{ font-size:14px; font-weight:600; }
  .appearance-option-sub{ font-size:12px; color:var(--text-muted); }
  .appearance-preview{ display:flex; gap:4px; width:84px; height:52px; padding:6px; border-radius:10px; border:1px solid; flex-shrink:0; }
  .appearance-preview .ap-side{ width:18px; border-radius:5px; }
  .appearance-preview .ap-main{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .appearance-preview .ap-bar{ height:8px; border-radius:4px; }
  .appearance-preview .ap-card{ flex:1; border-radius:5px; }
  .appearance-preview-light{ background:#F4F3F1; border-color:#E3E1DE; }
  .appearance-preview-light .ap-side, .appearance-preview-light .ap-card{ background:#fff; }
  .appearance-preview-light .ap-bar{ background:#17171A; }
  .appearance-preview-dark{ background:#1C1C1C; border-color:#3A3A3A; }
  .appearance-preview-dark .ap-side, .appearance-preview-dark .ap-card{ background:#303030; }
  .appearance-preview-dark .ap-bar{ background:#F5F5F5; }
  .appearance-current{ font-size:10.5px; font-weight:600; letter-spacing:.03em; text-transform:none; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent-text); }
  .appearance-swatches{ display:flex; gap:10px; flex-wrap:wrap; }
  .appearance-swatch{ width:34px; height:34px; border-radius:11px; border:1px solid var(--border); background:var(--surface); position:relative; cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease; }
  .appearance-swatch:hover{ border-color:var(--border-strong); }
  .appearance-swatch.selected{ border-color:var(--focus-ring); box-shadow:0 0 0 1px var(--focus-ring); }
  .appearance-swatch::after{ content:""; position:absolute; inset:9px; border-radius:6px; background:var(--sw); }

  /* ================= Accent colors (Settings -> Appearance) =================
     Default "Ink" = today's look (tokens in :root). Each preset has tuned light + dark values:
     text on fills >= 4.5:1, accent text >= 4.5:1, rings/fills >= 3:1. ================= */
  :root[data-accent="blue"]{ --accent:#2D5BFF; --on-accent:#FFFFFF; --accent-hover:#2852E6; --accent-text:#2D5BFF; --focus-ring:#2D5BFF; --accent-soft:color-mix(in srgb, var(--accent) 14%, var(--surface)); --accent-deep:#2142B8; --accent-grad-a:#7694FF; --accent-grad-b:#2D5BFF; --accent-highlight:var(--accent-soft); --hero-glow:color-mix(in srgb, var(--accent-grad-a) 40%, transparent); --ink-surface:var(--accent-deep); }
  :root[data-theme="dark"][data-accent="blue"]{ --accent:#7592FF; --on-accent:#1C1C1C; --accent-hover:#88A1FF; --accent-text:#7592FF; --focus-ring:#7592FF; --accent-soft:color-mix(in srgb, var(--accent) 22%, var(--surface)); --accent-deep:#2142B8; --accent-grad-a:#7592FF; --accent-grad-b:#5B72C7; --accent-highlight:var(--accent-soft); --hero-glow:color-mix(in srgb, var(--accent-grad-a) 40%, transparent); --ink-surface:var(--accent-deep); }
  :root[data-accent="lime"]{ --accent:#7DA000; --on-accent:#17171A; --accent-hover:#709000; --accent-text:#607800; --focus-ring:#607800; --accent-soft:color-mix(in srgb, var(--accent) 14%, var(--surface)); --accent-deep:#445700; --accent-grad-a:#AAC159; --accent-grad-b:#7DA000; --accent-highlight:var(--accent-soft); --hero-glow:color-mix(in srgb, var(--accent-grad-a) 40%, transparent); --ink-surface:var(--accent-deep); }
  :root[data-theme="dark"][data-accent="lime"]{ --accent:#8FB300; --on-accent:#1C1C1C; --accent-hover:#9FBE24; --accent-text:#8FB300; --focus-ring:#8FB300; --accent-soft:color-mix(in srgb, var(--accent) 22%, var(--surface)); --accent-deep:#445700; --accent-grad-a:#8FB300; --accent-grad-b:#708C00; --accent-highlight:var(--accent-soft); --hero-glow:color-mix(in srgb, var(--accent-grad-a) 40%, transparent); --ink-surface:var(--accent-deep); }
  :root[data-accent="purple"]{ --accent:#8458EC; --on-accent:#FFFFFF; --accent-hover:#774FD4; --accent-text:#7B52DD; --focus-ring:#7B52DD; --accent-soft:color-mix(in srgb, var(--accent) 14%, var(--surface)); --accent-deep:#583A9D; --accent-grad-a:#AF92F3; --accent-grad-b:#8458EC; --accent-highlight:var(--accent-soft); --hero-glow:color-mix(in srgb, var(--accent-grad-a) 40%, transparent); --ink-surface:var(--accent-deep); }
  :root[data-theme="dark"][data-accent="purple"]{ --accent:#A685F6; --on-accent:#1C1C1C; --accent-hover:#B296F7; --accent-text:#A685F6; --focus-ring:#A685F6; --accent-soft:color-mix(in srgb, var(--accent) 22%, var(--surface)); --accent-deep:#583A9D; --accent-grad-a:#A685F6; --accent-grad-b:#8168C0; --accent-highlight:var(--accent-soft); --hero-glow:color-mix(in srgb, var(--accent-grad-a) 40%, transparent); --ink-surface:var(--accent-deep); }
  :root[data-accent="pink"]{ --accent:#D6337F; --on-accent:#FFFFFF; --accent-hover:#C12E72; --accent-text:#CA3078; --focus-ring:#CA3078; --accent-soft:color-mix(in srgb, var(--accent) 14%, var(--surface)); --accent-deep:#8E2254; --accent-grad-a:#E47AAC; --accent-grad-b:#D6337F; --accent-highlight:var(--accent-soft); --hero-glow:color-mix(in srgb, var(--accent-grad-a) 40%, transparent); --ink-surface:var(--accent-deep); }
  :root[data-theme="dark"][data-accent="pink"]{ --accent:#E671A4; --on-accent:#1C1C1C; --accent-hover:#EA85B1; --accent-text:#E671A4; --focus-ring:#E671A4; --accent-soft:color-mix(in srgb, var(--accent) 22%, var(--surface)); --accent-deep:#8E2254; --accent-grad-a:#E671A4; --accent-grad-b:#B35880; --accent-highlight:var(--accent-soft); --hero-glow:color-mix(in srgb, var(--accent-grad-a) 40%, transparent); --ink-surface:var(--accent-deep); }
  .sw-ink{--sw:#17171A;}
  :root[data-theme="dark"] .sw-ink{--sw:#F5F5F5;}
  .sw-blue{--sw:#2D5BFF;}
  :root[data-theme="dark"] .sw-blue{--sw:#7592FF;}
  .sw-lime{--sw:#7DA000;}
  :root[data-theme="dark"] .sw-lime{--sw:#8FB300;}
  .sw-purple{--sw:#8458EC;}
  :root[data-theme="dark"] .sw-purple{--sw:#A685F6;}
  .sw-pink{--sw:#D6337F;}
  :root[data-theme="dark"] .sw-pink{--sw:#E671A4;}
  .toggle-switch:checked::after{ background:var(--on-accent); }
  :where(button, a, [role="button"], [role="radio"], summary):focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  /* non-default accents only: native controls, text selection, caret, and hover borders */
  :root[data-accent]{ accent-color:var(--accent); }
  :root[data-accent] ::selection{ background:color-mix(in srgb, var(--accent) 30%, transparent); }
  :root[data-accent] input, :root[data-accent] textarea{ caret-color:var(--accent-text); }
  :root[data-accent] .position-card:hover, :root[data-accent] .stat-card:hover, :root[data-accent] .candidate-row:hover{ border-color:color-mix(in srgb, var(--focus-ring) 40%, var(--border)); }

  /* ---- Overview: subtle staggered entrance + bar grow ---- */
  .ov2-bar{ transform-origin:bottom; animation:ovBarGrow .7s cubic-bezier(.16,.8,.3,1) both; animation-delay:calc(.3s + var(--i, 0) * 60ms); }
  @keyframes ovBarGrow{ from{ transform:scaleY(.2); opacity:.35; } to{ transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .ov2-bar, .ov2-col > *, .ov2-mobile-stack > *, .ov2-stat-tile{ animation:none !important; } }

  /* ---- Settings menu: on phones the six section rows share one card; Log out stays separate ---- */
  .m-settings-group{ display:contents; }
  @media (max-width: 599px){
    .m-settings-group{ display:block; background:var(--surface); border:1px solid var(--border-light); border-radius:var(--r-md); box-shadow:var(--shadow-card); overflow:hidden; }
    .m-settings-group .m-settings-row{ background:none; border:none; border-radius:0; box-shadow:none; }
    .m-settings-group .m-settings-row:active{ transform:none; }
    .m-settings-group .m-settings-row:not([hidden]) ~ .m-settings-row:not([hidden]){ border-top:1px solid var(--border-light); }
    .m-settings-group:not(:has(.m-settings-row:not([hidden]))){ display:none; }
  }
  .np-other{ margin-top:8px; }
  .np-field-error{ font-size:12px; color:var(--red); margin-top:6px; }
  .form-field.has-error .np-select-btn{ border-color:var(--red); }
</style>

  // ============================================================
  // Small helpers
  // ============================================================
  function avgScore(s){ return Math.round((s.reqMatch + s.consistency + s.collaboration + s.codeQuality) / 4); }
  function matchClass(pct){ if (pct >= 75) return "match-high"; if (pct >= 50) return "match-mid"; return "match-low"; }
  function statusLabel(s){ return s === "OPEN" ? "Open" : s === "PAUSED" ? "Paused" : "Closed"; }
  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function ordinalSuffix(n){
    const j = n % 10, k = n % 100;
    if (j === 1 && k !== 11) return "st";
    if (j === 2 && k !== 12) return "nd";
    if (j === 3 && k !== 13) return "rd";
    return "th";
  }
  function computeInitials(name){
    const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  // ============================================================
  // API client
  // ============================================================
  // Actions attempted while offline fail clearly and immediately, rather
  // than hanging on a real fetch that can't complete or silently succeeding
  // through the mock fallback (which would mask the offline state).
  function assertOnline(){
    if (!navigator.onLine) throw new Error("You're offline. Check your connection and try again.");
  }
  // A 401 from any real endpoint means the session has expired (or never
  // existed). Rather than hard-navigating to index.html and losing whatever
  // the person was doing, drop them on the in-app login/signup screen so
  // they can sign back in without leaving the dashboard.
  function triggerLoggedOut(){
    state.loggedOut = true;
    state.loading = false;
    state.loadError = null;
    render();
  }
  // The backend returns { error: "..." } with a specific, useful message
  // (a rate-limit notice, a validation error, "last remaining Owner", etc.)
  // — surface that instead of a generic "Failed to X" whenever it's there.
  async function extractErrorMessage(res, fallback){
    try {
      const body = await res.json();
      if (body && typeof body.error === "string" && body.error) return body.error;
    } catch (err) { /* not JSON, or empty body — use the fallback */ }
    return fallback;
  }

  // ============================================================
  // API-key error handling
  // When a request fails because the organization's AI key is missing,
  // invalid, expired, revoked or rejected, the backend answers with a
  // non-401 status and { error, code: "API_KEY_ERROR", reason } (see
  // lib/api/api-key-error.ts). Every API.* method passes its failed
  // response through throwIfApiKeyError(), which raises ONE pop-up that
  // sends the person to Settings \u2192 API Keys instead of the failure being
  // silent or a bare toast. 401 (session expired) is handled separately
  // and is untouched.
  // ============================================================
  let apiKeyErrorShowing = false; // one pop-up at a time, even when several requests fail together

  const API_KEY_REASON_TEXT = {
    missing: "No API key is set up.",
    invalid: "Your API key isn't valid.",
    expired: "Your API key has expired.",
    revoked: "Your API key has been revoked.",
    rejected: "Your API key was rejected by the AI provider.",
    model_unavailable: "The model your organization selected is unavailable.",
    unknown: "There's a problem with your API key.",
  };

  // Never put something that looks like a credential on screen, even if the server sent it.
  function looksLikeSecret(text){
    return /\bsk-[A-Za-z0-9_-]{8,}/i.test(text)            // provider-style keys: sk-..., sk-or-v1-...
      || /\bbearer\s+\S{8,}/i.test(text)                    // an Authorization header value
      || /[A-Za-z0-9_\-+/=.]{32,}/.test(text);              // any long unbroken token
  }

  // The API's own message when it is short and safe, otherwise a generic one for the reason.
  function safeApiKeyMessage(body){
    const raw = body && typeof body.error === "string" ? body.error.trim() : "";
    if (raw && raw.length <= 240 && !looksLikeSecret(raw)) return raw;
    const reason = body && typeof body.reason === "string" ? body.reason : "";
    const lead = Object.prototype.hasOwnProperty.call(API_KEY_REASON_TEXT, reason) ? API_KEY_REASON_TEXT[reason] : API_KEY_REASON_TEXT.unknown;
    return `${lead} Update it in Settings \u2192 API Keys, then try again.`;
  }

  function isApiKeyError(err){ return !!(err && err.apiKeyError); }

  function showApiKeyErrorModal(body){
    if (apiKeyErrorShowing) return;
    apiKeyErrorShowing = true;
    // Remember where the person was, so saving a new key can send them back.
    const back = { view: state.view, positionId: state.positionId, candidateId: state.candidateId, editingPositionId: state.editingPositionId };
    if (body && body.reason === "missing") state.orgApiKey = null; // the key we thought we had is gone
    askConfirm({
      title: "There's a problem with your API key",
      message: safeApiKeyMessage(body),
      confirmLabel: "Update API Keys",
      onConfirm: () => {
        state.view = "settings"; state.settingsSection = "api-keys"; state.mobileSettingsScreen = "detail";
        state.settingsSearch = "";
        state.apiKeyEditing = !!state.orgApiKey; // a key is already saved: open the form so a new one can be entered
        state.loading = false; state.loadError = null; // the failed request may have left the app loading / on an error screen
        state.apiKeyReturn = back;
        render();
      },
    });
  }

  // Call after a request, before reading its body. 401 is the session-expired path, not this one.
  async function throwIfApiKeyError(res, opts){
    if (res.ok || res.status === 401) return;
    let body = null;
    try { body = await res.clone().json(); } catch (err) { return; } // not JSON: an ordinary failure
    if (!body || body.code !== "API_KEY_ERROR") return;
    // Key management calls (view / save / remove) already sit on the form that fixes the key: no pop-up. Their error is
    // an ordinary one (NOT flagged as handled), so the usual toast still shows the message.
    if (opts && opts.modal === false) throw new Error(safeApiKeyMessage(body));
    showApiKeyErrorModal(body);
    const err = new Error(safeApiKeyMessage(body));
    err.apiKeyError = true; // the pop-up explains it: callers skip their own red toast
    err.reason = body.reason;
    throw err;
  }

  // After a new key is saved: go back to where the failure happened so the person can simply try again.
  function resumeAfterApiKeyFix(back){
    state.apiKeyReturn = null;
    if (!back) return false;
    state.loading = false; state.loadError = null;
    if (back.view === "position") openPosition(back.positionId);
    else if (back.view === "candidate") { state.positionId = back.positionId; openCandidate(back.candidateId); }
    else if (back.view === "positions") loadPositionsView();
    else if (back.view === "overview") loadOverview();
    else { state.editingPositionId = back.editingPositionId; state.view = back.view || "overview"; render(); } // e.g. the New position form, draft intact
    return true;
  }

  const API = {
    async getPositions(){
      assertOnline();
      const res = await fetch("/api/positions");
      if (res.status === 401) { triggerLoggedOut(); throw new Error("unauthorized"); }
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to load positions"));
      return await res.json();
    },
    // Single aggregate call for the Overview page — org-wide totals, the
    // platform-wide top candidate, and the activity feed all come from one
    // request instead of getPositions() + one getApplications() per posting.
    async getOverviewSummary(){
      assertOnline();
      const res = await fetch("/api/overview");
      if (res.status === 401) { triggerLoggedOut(); throw new Error("unauthorized"); }
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to load overview"));
      return await res.json();
    },
    async getPosition(id){
      assertOnline();
      const res = await fetch(`/api/positions/${id}`);
      if (res.status === 401) { triggerLoggedOut(); throw new Error("unauthorized"); }
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to load position"));
      return await res.json();
    },
    async createPosition(body){
      assertOnline();
      const res = await fetch("/api/positions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to create position"));
      return res.json();
    },
    async updatePosition(id, body){
      assertOnline();
      const res = await fetch(`/api/positions/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to update position"));
      return res.json();
    },
    async setPositionStatus(id, status){
      assertOnline();
      const res = await fetch(`/api/positions/${id}/status`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to update status"));
      return res.json();
    },
    async getApplications(positionId, params){
      assertOnline();
      const qs = new URLSearchParams(params || {}).toString();
      const res = await fetch(`/api/positions/${positionId}/applications${qs ? "?" + qs : ""}`);
      if (res.status === 401) { triggerLoggedOut(); throw new Error("unauthorized"); }
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to load applications"));
      return await res.json();
    },
    async getApplication(id){
      assertOnline();
      const res = await fetch(`/api/applications/${id}`);
      if (res.status === 401) { triggerLoggedOut(); throw new Error("unauthorized"); }
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to load application"));
      return await res.json();
    },
    async inviteTeamMember(positionId, body){
      assertOnline();
      const res = await fetch(`/api/positions/${positionId}/team`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to invite team member"));
      return res.json();
    },
    async removeTeamMember(positionId, userId){
      assertOnline();
      const res = await fetch(`/api/positions/${positionId}/team/${userId}`, { method: "DELETE" });
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to remove team member"));
      return res.json();
    },
    // ---- org-wide team roster (Settings > Team) ----
    async getTeam(){
      assertOnline();
      const res = await fetch("/api/team");
      if (res.status === 401) { triggerLoggedOut(); throw new Error("unauthorized"); }
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to load team"));
      return res.json();
    },
    async inviteToOrg(body){
      assertOnline();
      const res = await fetch("/api/team/invite", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to send invite"));
      return res.json();
    },
    async removeFromOrg(userId){
      assertOnline();
      const res = await fetch(`/api/team/${userId}`, { method: "DELETE" });
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to remove team member"));

    },
    async revokeInvite(inviteId){
      assertOnline();
      const res = await fetch(`/api/team/invite/${inviteId}`, { method: "DELETE" });
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to revoke invite"));
      return res.json();
    },
    // ---- candidate notes ----
    async getNotes(applicationId){
      assertOnline();
      const res = await fetch(`/api/applications/${applicationId}/notes`);
      await throwIfApiKeyError(res);
      if (!res.ok) throw new Error(await extractErrorMessage(res, "Failed to load notes"));
      return res.json();
    },

    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;

  function exportCandidatesCSV(){
    const q = state.candidateSearch.trim().toLowerCase();
    const rows = q
      ? currentCandidateRows.filter((c) => c.name.toLowerCase().includes(q) || (c.email || "").toLowerCase().includes(q))
      : currentCandidateRows;
    if (!rows.length) { showToast("No candidates to export.", "error"); return; }
    const withMatch = filtersActive(state.filters); // add a "Matches filters" column so the split shown on screen survives export
    const headers = ["Name", "Email", "Match %", "Skills", "Applied", "Status", ...(withMatch ? ["Matches filters"] : [])];
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [headers.map(esc).join(",")];
    rows.forEach((c) => {
      lines.push([c.name, c.email, c.matchPct, c.skills.join("; "), `${c.appliedDaysAgo}d ago`, c.status || "", ...(withMatch ? [c.matches ? "Yes" : "No"] : [])].map(esc).join(","));
    });
    const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const p = getPosition();
    const a = document.createElement("a");
    a.href = url;
    a.download = `${(p?.title || "candidates").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-candidates.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`Exported ${rows.length} candidate${rows.length === 1 ? "" : "s"}.`);
  }

  function daysSince(iso){ return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000)); }
  function endDateInfo(endDateIso){
    if (!endDateIso) return null;
    const end = new Date(endDateIso + "T23:59:59");
    const diffDays = Math.ceil((end - Date.now()) / 86400000);
    if (diffDays < 0) return { label: `Closed ${Math.abs(diffDays)}d ago`, tone: "closed" };
    if (diffDays === 0) return { label: "Closes today", tone: "soon" };
    if (diffDays === 1) return { label: "Closes tomorrow", tone: "soon" };
    if (diffDays <= 7) return { label: `${diffDays} days left`, tone: "soon" };
    return { label: `${diffDays} days left`, tone: "normal" };
  }
  function relativeDate(iso){
    const d = daysSince(iso);
    if (d === 0) return "today";
    if (d === 1) return "1 day ago";
    return `${d} days ago`;
  }

  async function loadOverview(){
    state.view = "overview"; state.positionId = null; state.candidateId = null;
    state.loading = true; state.loadError = null; render();
    try {
      const data = await API.getOverviewSummary();
      POSITIONS = sortPositionsForDisplay((data.positions || []).map(adaptPositionSummary));
      // One response already carries every posting's applications, so
      // org-wide totals, the platform-wide top candidate, and the
      // recent-activity feed are all derived here with zero extra requests.
      const perPosting = POSITIONS.map((p) => ({
        posId: p.id, posTitle: p.title, posStatus: p.status,
        apps: ((data.applications || {})[p.id] || []).map(adaptCandidateRow),
      }));
      state.overviewData = computeOverview(POSITIONS, perPosting);
      state.loading = false; render();
    } catch (err) {
      if (err.message === "unauthorized") return;
      state.loading = false; state.loadError = err.message; render();
    }
