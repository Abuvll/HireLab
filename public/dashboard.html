          if (val === state.orgApiKeyProvider) { providerPanel.classList.remove("open"); return; }
          state.orgApiKeyProvider = val;
          // A key only works for the provider it belongs to, so switching provider also resets the model
          // choice to that provider's own default rather than leaving a mismatched pairing selected.
          state.orgApiKeyModel = modelsForProvider(val)[0]?.[0] || state.orgApiKeyModel;
          render();
        });
      });
    }
    const modelToggle = document.getElementById("model-select-toggle");
    const modelPanel = document.getElementById("model-select-panel");
    if (modelToggle && modelPanel) {
      modelToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = modelPanel.classList.toggle("open");
        modelToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      });
      modelPanel.querySelectorAll("[data-model-value]").forEach((opt) => {
        opt.addEventListener("click", () => {
          const val = opt.getAttribute("data-model-value");
          state.orgApiKeyModel = val;
          document.getElementById("model-select-label").textContent = API_KEY_MODELS.find((m) => m[0] === val)?.[1] || val;
          modelPanel.querySelectorAll(".role-select-option").forEach((o) => {
            const isActive = o === opt;
            o.classList.toggle("active", isActive);
            o.setAttribute("aria-selected", isActive ? "true" : "false");
            o.querySelector("svg")?.remove();
            if (isActive) o.insertAdjacentHTML("beforeend", ICON.check);
          });
          modelPanel.classList.remove("open");
          modelToggle.setAttribute("aria-expanded", "false");
        });
      });
    }
    const apiKeySave = document.getElementById("api-key-save");
    if (apiKeySave) { apiKeySave.addEventListener("click", () => {
      const val = document.getElementById("api-key-input").value.trim();
      if (!val) { document.getElementById("api-key-input").focus(); return; }
      withAsyncButton(apiKeySave, "Saving…", async () => {
        const result = await API.saveApiKey(val, state.orgApiKeyProvider, state.orgApiKeyModel);
        state.orgApiKey = result.maskedKey;
        state.orgApiKeyProvider = result.provider;
        state.orgApiKeyModel = result.model;
        state.apiKeyUsageThisCycle = result.usageThisCycle;
        state.apiKeyEditing = false;
        // Came here from an API-key error pop-up: send the person back to where it happened.
        const back = state.apiKeyReturn;
        if (back) {
          state.pendingNewPosition = false;
          resumeAfterApiKeyFix(back);
          showToast("API key saved. You're back where you left off. Try again.");
          return;
        }
        if (state.pendingNewPosition) {
          state.pendingNewPosition = false;
          state.newPosDraft = freshDraft();
          state.view = "new-position";
        }
        render();
        showToast("API key saved.");
      });
    }); attachRipple(apiKeySave); }
    const apiKeyReplace = document.getElementById("api-key-replace");
    if (apiKeyReplace) { apiKeyReplace.addEventListener("click", () => { state.apiKeyEditing = true; render(); }); attachRipple(apiKeyReplace); }
    const apiKeyCancelEdit = document.getElementById("api-key-cancel-edit");
    if (apiKeyCancelEdit) apiKeyCancelEdit.addEventListener("click", () => { state.apiKeyEditing = false; render(); });
    const apiKeyRemove = document.getElementById("api-key-remove");
    if (apiKeyRemove) { apiKeyRemove.addEventListener("click", () => {
      askConfirm({
        title: "Remove API key?",
        message: "Analysis will stop working for new applications until a new key is added.",
        confirmLabel: "Remove",
        onConfirm: async () => {
          try {
            await API.removeApiKey();
          } catch (err) {
            showToast(err.message || "Failed to remove API key.", "error");
            return;
          }
          state.orgApiKey = null; state.apiKeyEditing = false; state.apiKeyUsageThisCycle = null;
          render();
          showToast("API key removed.");
        },
      });
    }); attachRipple(apiKeyRemove); }

    // ---- help & onboarding ----
    document.querySelectorAll("[data-help-checklist]").forEach((el) => {
      el.addEventListener("click", () => {
        const item = getHelpChecklist().find((c) => c.key === el.getAttribute("data-help-checklist"));
        if (!item) return;
        if (item.action === "new-position") { tryOpenNewPosition(); return; }
        state.view = item.view || "help";
        if (item.section) { state.settingsSection = item.section; state.mobileSettingsScreen = "detail"; loadSettingsSection(item.section); }
        state.loading = false; state.loadError = null; render();
      });
    });
    const helpSearch = document.getElementById("help-search");
    if (helpSearch) helpSearch.addEventListener("input", (e) => { state.helpSearch = e.target.value; updateHelpResults(); });
    document.querySelectorAll("[data-help-quick]").forEach((el) => {
      el.addEventListener("click", () => {
        state.helpSearch = el.getAttribute("data-help-quick");
        render();
        const input = document.getElementById("help-search");
        if (input) input.focus();
      });
      attachRipple(el);
    });
    attachHelpAccordionListeners();

    // ---- profile (tabs are now part of data-settings-tab above) ----
    const pfSave = document.getElementById("pf-save");
    if (pfSave) { pfSave.addEventListener("click", () => {
      const name = document.getElementById("pf-name").value.trim() || state.personal.name;
      const email = document.getElementById("pf-email").value.trim() || state.personal.email;
      const phone = document.getElementById("pf-phone").value.trim();
      const changingEmail = email !== state.personal.email;
      const currentPassword = changingEmail ? window.prompt("Enter your current password to change your email:") : undefined;
      if (changingEmail && !currentPassword) return; // cancelled
      withAsyncButton(pfSave, "Saving…", async () => {
        const updated = await API.updateMe({ name, email, phone: phone || null, currentPassword });
        state.personal.name = updated.name; state.personal.email = updated.email; state.personal.phone = updated.phone || "";
      }, "Saved");
    }); attachRipple(pfSave); }
    const pfPwSave = document.getElementById("pf-pw-save");
    if (pfPwSave) { pfPwSave.addEventListener("click", () => {
      const cur = document.getElementById("pf-pw-current").value;
      const nw = document.getElementById("pf-pw-new").value;
      const confirm = document.getElementById("pf-pw-confirm").value;
      if (!cur || !nw || nw !== confirm) {
        const original = pfPwSave.textContent;
        pfPwSave.textContent = nw !== confirm ? "Doesn't match" : "Update password";
        setTimeout(() => { pfPwSave.textContent = original; }, 1400);
        return;
      }
      withAsyncButton(pfPwSave, "Updating…", async () => {
        await API.changePassword(cur, nw);
        document.getElementById("pf-pw-current").value = ""; document.getElementById("pf-pw-new").value = ""; document.getElementById("pf-pw-confirm").value = "";
      }, "Updated");
    }); attachRipple(pfPwSave); }
    const notifPrefsSave = document.getElementById("notif-prefs-save");
    if (notifPrefsSave) { notifPrefsSave.addEventListener("click", () => {
      const prefs = {
        newApplicant: document.getElementById("np-newApplicant").checked,
        qualified: document.getElementById("np-qualified").checked,
        teamActivity: document.getElementById("np-teamActivity").checked,
        emailDigest: document.getElementById("np-emailDigest").checked,
      };
      withAsyncButton(notifPrefsSave, "Saving…", async () => {
        state.notificationPrefs = await API.updateNotificationPreferences(prefs);
      }, "Saved");
    }); attachRipple(notifPrefsSave); }

    const orgNameSave = document.getElementById("org-name-save");
    if (orgNameSave) { orgNameSave.addEventListener("click", () => {
      const name = document.getElementById("org-name-input").value.trim() || "My Organization";
      const website = document.getElementById("org-website-input").value.trim();
      const industry = document.getElementById("org-industry-input").value.trim();
      const contactEmail = document.getElementById("org-contact-email-input").value.trim();
      const contactPhone = document.getElementById("org-contact-phone-input").value.trim();
      const description = document.getElementById("org-desc-input").value.trim();
      withAsyncButton(orgNameSave, "Saving…", async () => {
        // Empty strings aren't valid URLs/emails — the backend expects
        // null for "not set" rather than "".
        const updated = await API.updateOrganization({
          name,
          website: website || null,
          industry: industry || null,
          contactEmail: contactEmail || null,
          contactPhone: contactPhone || null,
          description: description || null,
        });
        state.orgName = updated.name;
        state.orgProfile = {
          website: updated.website || "", industry: updated.industry || "",
          contactEmail: updated.contactEmail || "", contactPhone: updated.contactPhone || "",
          description: updated.description || "",
        };
      }, "Saved");
    }); attachRipple(orgNameSave); }
  }

  // ---- close filter panel on outside click ----
  document.addEventListener("click", (e) => {
    if (!state.filterPanelOpen) return;
    // Clicking a tech pill re-renders the panel synchronously, so by the time the click reaches here the pill is no
    // longer in the page. A click on something a handler just removed is not a click outside the panel.
    if (!document.body.contains(e.target)) return;
    const panel = document.getElementById("filter-panel");
    const toggle = document.getElementById("filter-toggle");
    if (panel && !panel.contains(e.target) && toggle && !toggle.contains(e.target)) { closeFilterPanel(); render(); }
  });

  // ---- close desktop posting-filter pop-up on outside click ----
  document.addEventListener("click", (e) => {
    if (!state.mobileFilterSheetOpen) return;
    const panel = document.getElementById("posting-filter-panel");
    if (panel && panel.offsetParent !== null && !panel.contains(e.target)) { state.mobileFilterSheetOpen = false; render(); }
  });

  // ---- close ending-date picker on outside click / Escape ----
  document.addEventListener("click", (e) => {
    const r = document.getElementById("np-end-date-picker");
    if (r && r.dataset.open === "1" && !r.contains(e.target)) refreshEndDatePicker(false);
  });
  document.addEventListener("keydown", (e) => {
    const r = document.getElementById("np-end-date-picker");
    if (e.key === "Escape" && r && r.dataset.open === "1") refreshEndDatePicker(false);
  });

  // ---- close top-N panel on outside click ----
  document.addEventListener("click", (e) => {
    if (!state.topNPanelOpen) return;
    const panel = document.getElementById("topn-panel");
    const toggle = document.getElementById("topn-toggle");
    if (panel && !panel.contains(e.target) && toggle && !toggle.contains(e.target)) { state.topNPanelOpen = false; render(); }
  });

  // ---- close position-actions panels on outside click ----
  document.addEventListener("click", (e) => {
    document.querySelectorAll(".pos-actions-panel.open").forEach((panel) => {
      const wrap = panel.closest(".pos-actions-wrap");
      if (wrap && !wrap.contains(e.target)) {
        panel.classList.remove("open");
        wrap.querySelector(".pos-actions-btn")?.setAttribute("aria-expanded", "false");
      }
    });
  });

  // ---- close role-select panels (Hiring team / Settings > Team / New position) on outside click ----
  document.addEventListener("click", (e) => {
    ["ti-role", "oti-role", "np-employment", "np-salary", "np-gender", "np-vacancies", "np-education", "np-experience", "provider-select", "model-select"].forEach((prefix) => {
      const panel = document.getElementById(`${prefix}-panel`);
      if (!panel || !panel.classList.contains("open")) return;
      const toggle = document.getElementById(`${prefix}-toggle`);
      if (!panel.contains(e.target) && toggle && !toggle.contains(e.target)) {
        panel.classList.remove("open");
        toggle.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
      }
    });
  });

  // ---- api key modal (persistent element, wired once) ----
  document.getElementById("apikey-modal-close").addEventListener("click", () => { state.apiKeyModalOpen = false; state.pendingNewPosition = false; render(); });
  document.getElementById("apikey-modal-dismiss").addEventListener("click", () => { state.apiKeyModalOpen = false; state.pendingNewPosition = false; render(); });
  document.getElementById("apikey-modal-cta").addEventListener("click", () => {
    state.apiKeyModalOpen = false; state.view = "settings"; state.settingsSection = "api-keys"; state.mobileSettingsScreen = "detail"; render();
  });
  document.getElementById("apikey-modal").addEventListener("click", (e) => {
    if (e.target.id === "apikey-modal") { state.apiKeyModalOpen = false; state.pendingNewPosition = false; render(); }
  });
  document.getElementById("m-filter-sheet").addEventListener("click", (e) => {
    if (e.target.id === "m-filter-sheet") { state.mobileFilterSheetOpen = false; render(); }
  });

  // ---- offline handling ----
  function updateOfflineBanner(){
    const banner = document.getElementById("offline-banner");
    if (banner) banner.classList.toggle("show", !navigator.onLine);
  }
  window.addEventListener("online", () => { updateOfflineBanner(); showToast("Back online."); });
  window.addEventListener("offline", () => { updateOfflineBanner(); showToast("You're offline. Some actions won't work until you're back.", "error"); });
  updateOfflineBanner();

  // ---- confirm dialog (persistent element, wired once) ----
  document.getElementById("confirm-modal-close").addEventListener("click", closeConfirm);
  document.getElementById("confirm-modal-cancel").addEventListener("click", closeConfirm);
  document.getElementById("confirm-modal-confirm").addEventListener("click", async () => {
    const modal = document.getElementById("confirm-modal");
    const fn = modal._onConfirm;
    const btn = document.getElementById("confirm-modal-confirm");
    if (!fn) { closeConfirm(); return; }
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Working…";
    try {
      await fn();
    } catch (err) {
      if (!isApiKeyError(err)) showToast((err && err.message) || "Something went wrong. Please try again.", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = original;
      closeConfirm();
    }
  });
  document.getElementById("confirm-modal").addEventListener("click", (e) => {
    if (e.target.id === "confirm-modal") closeConfirm();
  });

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      const helpInput = document.getElementById("help-search");
      if (helpInput) { e.preventDefault(); helpInput.focus(); helpInput.select(); }
    }
    if (e.key === "Escape" && state.apiKeyModalOpen) { state.apiKeyModalOpen = false; state.pendingNewPosition = false; render(); }
    if (e.key === "Escape" && document.getElementById("confirm-modal").classList.contains("show")) { closeConfirm(); }
    if (e.key === "Escape" && state.mobileFilterSheetOpen) { state.mobileFilterSheetOpen = false; render(); }
    if (e.key === "Escape" && state.filterPanelOpen) { closeFilterPanel(); render(); }
    if (e.key === "Escape") { document.querySelectorAll(".pos-actions-panel.open").forEach((pnl) => pnl.classList.remove("open")); }
    if (e.key === "Escape" && state.topNPanelOpen) { state.topNPanelOpen = false; render(); }
    if (e.key === "Escape") {
      ["ti-role", "oti-role", "np-employment", "np-salary", "np-gender", "np-vacancies", "np-education", "np-experience", "provider-select", "model-select"].forEach((prefix) => {
        const rolePanel = document.getElementById(`${prefix}-panel`);
        if (rolePanel && rolePanel.classList.contains("open")) {
          rolePanel.classList.remove("open");
          document.getElementById(`${prefix}-toggle`)?.classList.remove("open");
          document.getElementById(`${prefix}-toggle`)?.setAttribute("aria-expanded", "false");
        }
      });
    }
  });

  // ============================================================
  // Init
  // ============================================================
  // Who is signed in and what they may do comes from the backend (GET /api/me), never from the client.
  function resetUserScopedState(){
    // A different person can sign in inside an already-open page (session expired -> login form): nothing about the
    // previous person's role, key, team or cached candidates may carry over.
    state.currentUserRole = null; state.currentUserId = null; state.userLoaded = false;
    state.orgApiKey = null; state.orgApiKeyProvider = "ANTHROPIC"; state.orgApiKeyModel = "anthropic/claude-3-5-sonnet-20241022"; state.apiKeyUsageThisCycle = null;
    state.apiKeyEditing = false; state.apiKeyReturn = null; state.apiKeyModalOpen = false; state.pendingNewPosition = false;
    state.orgTeam = []; state.orgPendingInvites = []; state.candidateNotes = {}; state.notificationsRead = {};
    state.personal = { name: "", email: "", phone: "" };
    state.overviewData = null; state.filterDraft = null; state.filterPositionId = null; state.techOptions = [];
    POSITIONS = []; currentCandidateRows = [];
    Object.keys(candidateDetailCache).forEach((k) => { delete candidateDetailCache[k]; });
    Object.keys(settingsLoaded).forEach((k) => { settingsLoaded[k] = false; });
  }

  async function loadSession(){
    try {
      const me = await API.getMe();
      state.currentUserRole = me.orgRole;
      state.currentUserId = me.id;
      state.personal = { name: me.name, email: me.email, phone: me.phone || "" };
      settingsLoaded.personal = true;
    } catch (err) {
      if (err.message === "unauthorized") return; // the login screen takes over; this runs again after signing in
      // Couldn't confirm a role: it stays unknown, which grants nothing.
    }
    // Only Owners/Admins may read the key info (the backend refuses everyone else). It is loaded before the app is
    // shown because state.orgApiKey gates "New position" (see tryOpenNewPosition).
    if (canManagePosition()) {
      try {
        const info = await API.getApiKey();
        state.orgApiKey = info.maskedKey;
        state.orgApiKeyProvider = info.provider || state.orgApiKeyProvider;
        state.orgApiKeyModel = info.model || state.orgApiKeyModel;
        state.apiKeyUsageThisCycle = info.usageThisCycle;
      } catch (err) { /* not fatal — Settings > API Keys shows its own state */ }
    }
    state.userLoaded = true;
    render();
  }

  // Crossing the mobile breakpoint while on Settings swaps which copy of the panel is rendered.
  (function(){
    const mq = window.matchMedia("(max-width: 860px)");
    const onChange = () => { if (state.view === "settings") render(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange);
  })();

  loadOverview();
  loadSession();
</script>
</body>
</html>
