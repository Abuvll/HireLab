<style>
  :root{
    --bg:#F4F3F1; --surface:#ffffff; --surface-sunken:#F8F7F5; --border:#E3E1DE; --border-light:#ECEAE7; --border-strong:#D3D0CB;
    --text:#17171A; --text-muted:#6B6963; --text-faint:#9C9994; --tint:#F1F0EE;
    --zinc-800:var(--text); --zinc-500:var(--text-muted); --zinc-300:var(--border-strong); --zinc-200:var(--border); --zinc-100:var(--tint);
    --line-blue:var(--border);
    --emerald:#3F6B52; --emerald-bg:#E9F1EA; --emerald-border:#C4DAC7;
    --amber:#95632A; --amber-bg:#FBF1E1; --amber-border:#EBD3A9;
    --mono: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --serif-italic: 'Instrument Serif', Georgia, 'Times New Roman', serif;
    --serif-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --r-lg:22px; --r-md:16px; --r-sm:10px; --r-full:999px;
    --shadow-card:0 16px 34px -26px rgba(23,23,26,.22);
    --shadow-lift:0 22px 44px -22px rgba(23,23,26,.3);
    --auth-accent:#0052FF;
    --on-ink:#fff; --on-ink-soft:rgba(255,255,255,.7); --ink-surface:#17171A; --ink-hover:#000; --text-disabled:#B5B2AD;
    --red:#C24A3B; --red-bg:#FBEAE5; --red-border:#EFC7BB; --red-strong:#A3432F;
    --accent:var(--text); --on-accent:var(--on-ink); --accent-hover:var(--ink-hover); --accent-text:var(--text); --accent-soft:var(--tint); --focus-ring:var(--text);
    --accent-deep:#2D508B; --accent-grad-a:#8CA9E6; --accent-grad-b:#6C88CE; --accent-highlight:#EBEFFA; --hero-glow:rgba(183,203,232,.35);
  }
  *{box-sizing:border-box;}
  html{overflow-x:clip;}
  body{
    margin:0;font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;
    overflow-x:clip;
    background:
      radial-gradient(ellipse 900px 560px at 10% -10%, rgba(158,188,224,.32), transparent 60%),
      radial-gradient(ellipse 760px 520px at 96% 0%, rgba(232,196,180,.26), transparent 58%),
      radial-gradient(ellipse 720px 480px at 45% 105%, rgba(186,208,178,.18), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  button{font-family:inherit;cursor:pointer;}
  svg{display:block;width:16px;height:16px;flex-shrink:0;}
  img{display:block;}
  input,select{font-family:inherit;}
  table{border-collapse:collapse;width:100%;}
  a{color:inherit;}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }

  .app{display:flex;min-height:100vh;padding:20px;gap:20px;align-items:flex-start;}

  /* ---------- sidebar (expandable) ---------- */
  .sidebar{
    width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;margin:-20px 0 0 -20px;
    display:flex;flex-direction:column;align-items:stretch;padding:14px 12px;
    background:var(--surface);border:0;border-right:1px solid var(--border-light);border-radius:0;box-shadow:none;
    transition:width .28s cubic-bezier(.4,0,.2,1);
  }
  .sidebar.collapsed{width:88px;}
  .rail-brand{display:flex;align-items:center;height:40px;margin-bottom:18px;flex-shrink:0;}
  .rail-brand-mark{width:30px;height:30px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rail-brand img{width:18px;height:18px;object-fit:contain;}
  .rail-brand-name{margin-left:10px;max-width:76px;font-family:var(--serif-display);font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;opacity:1;transition:opacity .2s ease .08s,max-width .28s cubic-bezier(.4,0,.2,1),margin-left .28s cubic-bezier(.4,0,.2,1);}
  .rail-brand-toggle{width:30px;height:30px;margin-left:auto;border-radius:10px;background:none;border:none;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s ease;}
  .rail-brand-toggle i{font-size:20px;line-height:1;}
  .rail-brand-toggle:hover{background:var(--accent-soft);}
  .rail-brand-toggle:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}
  .rail-nav{display:flex;flex-direction:column;gap:4px;}
  #sidebar-footer{padding-top:10px;border-top:1px solid var(--border-light);}
  .rail-spacer{flex:1;}
  .rail-item{position:relative;width:100%;height:44px;padding:0 16px;border-radius:14px;background:none;border:none;font-family:inherit;color:var(--text-muted);display:flex;align-items:center;gap:12px;text-align:left;flex-shrink:0;transition:background .15s ease,color .15s ease,padding .28s cubic-bezier(.4,0,.2,1);}
  .rail-item svg{width:20px;height:20px;flex-shrink:0;}
  .rail-item i{font-size:20px;line-height:1;flex-shrink:0;}
  .rail-label{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-align:left;opacity:1;transition:opacity .2s ease .08s;}
  .rail-item:hover{background:var(--accent-soft);color:var(--accent-text);}
  .rail-item.active{background:var(--accent);color:var(--on-accent);}
  .rail-item.active .rail-label{font-weight:600;}
  .rail-item:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}
  .rail-count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rail-item.active .rail-count{background:var(--on-accent);color:var(--accent);}
  .rail-item-dot{display:none;position:absolute;top:10px;left:36px;width:8px;height:8px;border-radius:999px;background:var(--accent);border:1.5px solid var(--surface);}
  .sidebar.collapsed .rail-label, .sidebar.collapsed .rail-brand-name{opacity:0;transition-delay:0s;}
  .sidebar.collapsed .rail-brand-name{max-width:0;margin-left:0;}
  .sidebar.collapsed .rail-item{padding-left:21px;padding-right:21px;}
  .sidebar.collapsed .rail-count{display:none;}
  .sidebar.collapsed .rail-item-dot{display:block;}
  .rail-tip{position:fixed;transform:translateY(-50%) translateX(-4px);background:var(--text);color:var(--on-ink);font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:200;}
  .rail-tip.show{opacity:1;transform:translateY(-50%) translateX(0);}

  /* ================================================================
     AUTH — Login / Signup (shown in place of the app when logged out)
     Design extracted from loginsignup.html; reuses this app's existing
     surface/border/text tokens so it matches the rest of the product.
  ================================================================ */
  .loggedout-wrap{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:32px;
    background:
      radial-gradient(ellipse 900px 560px at 10% -10%, rgba(158,188,224,.32), transparent 60%),
      radial-gradient(ellipse 760px 520px at 96% 0%, rgba(232,196,180,.26), transparent 58%),
      radial-gradient(ellipse 720px 480px at 45% 105%, rgba(186,208,178,.18), transparent 60%);
  }
  .auth-card{
    width:100%; max-width:1060px; min-height:600px;
    background:var(--surface); border:1px solid var(--border); border-radius:30px;
    box-shadow:var(--shadow-lift); overflow:hidden; display:flex; align-items:stretch;
  }
  .auth-hero{ flex:1 1 45%; background:var(--surface-sunken); padding:14px; }
  .auth-hero-img{ width:100%; height:100%; object-fit:cover; border-radius:20px; display:block; }
  .auth-panel{ flex:1 1 55%; padding:52px 60px; display:flex; flex-direction:column; justify-content:center; min-width:0; }
  .auth-brand{ display:flex; align-items:center; gap:10px; margin-bottom:34px; }
  .auth-brand img{ width:24px; height:24px; object-fit:contain; }
  .auth-brand span{ font-weight:800; font-size:16.5px; letter-spacing:-0.01em; }

  .auth-title{ font-size:32px; font-weight:800; letter-spacing:-0.02em; margin:0 0 8px; line-height:1.15; }
  .auth-subtitle{ font-size:14px; color:var(--text-muted); margin:0 0 30px; }

  .auth-field{ display:flex; flex-direction:column; gap:8px; margin-bottom:19px; }
  .auth-field-label{ font-size:12.5px; color:var(--text-muted); font-weight:500; }
  .auth-field input{
    border:none; border-bottom:1.5px solid var(--border-strong); background:transparent; padding:8px 2px 10px;
    font-size:15px; color:var(--text); font-family:inherit; width:100%; border-radius:0;
  }
  .auth-field input::placeholder{ color:var(--text-faint); }
  .auth-field input:focus{ outline:none; border-bottom-color:var(--auth-accent); }
  .auth-field.has-error .auth-input-row, .auth-field.has-error > input{ border-bottom-color:var(--red); }
  .auth-error-msg{ font-size:12px; color:var(--red); min-height:0; margin-top:2px; display:none; }
  .auth-field.has-error .auth-error-msg{ display:block; }

  .auth-input-row{ display:flex; align-items:center; gap:8px; border-bottom:1.5px solid var(--border-strong); }
  .auth-input-row input{ border-bottom:none; padding-bottom:10px; }
  .auth-input-row:focus-within{ border-bottom-color:var(--auth-accent); }
  .auth-eye-btn{ background:none; border:none; padding:4px; color:var(--text-faint); display:flex; flex-shrink:0; }
  .auth-eye-btn:hover{ color:var(--text); }
  .auth-eye-btn svg{ width:17px; height:17px; }

  .auth-row-between{ display:flex; align-items:center; justify-content:space-between; margin:4px 0 26px; font-size:13px; gap:12px; flex-wrap:wrap; }
  .auth-checkbox{ display:flex; align-items:center; gap:8px; color:var(--text-muted); cursor:pointer; user-select:none; }
  .auth-checkbox input{ width:15px; height:15px; accent-color:var(--text); flex-shrink:0; }
  .auth-checkbox-terms{ align-items:flex-start; margin-bottom:20px; font-size:12.5px; line-height:1.5; display:flex; gap:8px; }
  .auth-checkbox-terms input{ margin-top:2px; }
  .auth-checkbox-terms a{ color:var(--text); font-weight:600; text-decoration:underline; text-underline-offset:2px; }
  .auth-link{ background:none; border:none; padding:0; color:var(--text-muted); font-size:13px; font-family:inherit; }
  .auth-link:hover:not(:disabled){ color:var(--text); text-decoration:underline; }
  .auth-link:disabled{ color:var(--text-faint); cursor:default; }

  .auth-banner-error{ display:none; background:var(--red-bg); border:1px solid var(--red-border); color:var(--red-strong); border-radius:var(--r-sm); padding:10px 12px; font-size:12.5px; margin-bottom:16px; }
  .auth-banner-error.show{ display:block; }

  .auth-btn-primary{
    width:100%; background:var(--accent); color:var(--on-accent); border:none; border-radius:999px; padding:15px;
    font-size:15px; font-weight:700; font-family:inherit; margin-bottom:12px; transition:transform .12s ease,background .15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .auth-btn-primary:hover:not(:disabled){ background:var(--accent-hover); transform:translateY(-1px); }
  .auth-btn-primary:disabled{ opacity:.65; transform:none; cursor:default; }
  .auth-btn-primary .spinner{ display:none; width:16px; height:16px; animation:spin .8s linear infinite; }
  .auth-btn-primary.loading .spinner{ display:block; }
  .auth-btn-primary.loading .btn-label{ display:none; }
  .auth-btn-google{
    width:100%; background:var(--tint); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:13.5px;
    font-size:14px; font-weight:600; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:10px;
    transition:background .15s ease, transform .12s ease;
  }
  .auth-btn-google:hover:not(:disabled){ background:var(--border-light); transform:translateY(-1px); }
  .auth-btn-google:disabled{ opacity:.65; cursor:default; }
  .auth-btn-google svg{ width:17px; height:17px; flex-shrink:0; }

  .auth-switch{ text-align:center; font-size:13.5px; color:var(--text-muted); margin:22px 0 0; }
  .auth-switch button{ background:none; border:none; padding:0; color:var(--text); font-weight:700; font-family:inherit; }
  .auth-switch button:hover{ text-decoration:underline; }

  @media (max-width: 900px){ .auth-panel{ padding:44px 40px; } }
  @media (max-width: 760px){
    .loggedout-wrap{ padding:0; }
    .auth-card{ border-radius:0; min-height:100vh; flex-direction:column; box-shadow:none; border:none; }
    .auth-hero{ display:none; }
    .auth-panel{ padding:40px 24px 48px; justify-content:flex-start; }
    .auth-title{ font-size:27px; }
  }

  /* ---------- main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;gap:16px;}
  .topbar{min-height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 4px 0;}
  .topbar-actions{display:flex;align-items:center;flex-shrink:0;}
  .breadcrumb{display:flex;align-items:baseline;gap:10px;font-size:18px;font-weight:500;color:var(--text-faint);flex-wrap:wrap;}
  .breadcrumb .crumb-link, .breadcrumb .crumb-muted{color:var(--text-faint);cursor:pointer;background:none;border:none;font-size:inherit;font-weight:inherit;letter-spacing:inherit;padding:0;font-family:inherit;}
  .breadcrumb .crumb-muted{cursor:default;}
  .breadcrumb .crumb-link:hover{color:var(--text-muted);}
  .breadcrumb .crumb-current{color:var(--text);font-weight:700;}
  .breadcrumb svg{width:16px;height:16px;color:var(--text-faint);align-self:center;flex-shrink:0;}
  .breadcrumb > :first-child{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;}

  .content{flex:1;}

  /* ---------- ripple (ported from the marketing site) ---------- */
  .ripple-fx{position:absolute;border-radius:50%;background:#fff;mix-blend-mode:difference;transform:scale(0);animation:rippleExpand .7s ease-out forwards;pointer-events:none;}
  @keyframes rippleExpand{to{transform:scale(1);opacity:0;}}

  /* ---------- generic ---------- */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:20px;}
  .stat-card-icon{color:var(--text-faint);margin-bottom:12px;}
  .stat-card-icon svg{width:20px;height:20px;}
  .stat-value{font-size:26px;font-weight:700;letter-spacing:-0.02em;font-family:var(--mono);}
  .stat-label{font-size:12.5px;color:var(--text-muted);margin-top:5px;}
  .stat-sub{font-size:11px;color:var(--text-faint);margin-top:2px;}

  .pill{font-size:11px;font-weight:500;color:var(--text-muted);background:var(--tint);border:1px solid var(--border);border-radius:999px;padding:4px 10px;display:inline-block;}
  .comp-bar{display:flex;height:7px;width:100%;border-radius:999px;overflow:hidden;background:var(--tint);}
  .comp-seg-1{background:var(--accent);} .comp-seg-2{background:#9B9895;} .comp-seg-3{background:var(--border-strong);}
  .match-badge{font-family:var(--mono);font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;border:1px solid;flex-shrink:0;}
  .match-high{color:var(--emerald);background:var(--emerald-bg);border-color:var(--emerald-border);}
  .match-mid{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-border);}
  .match-low{color:var(--text-muted);background:var(--tint);border-color:var(--border);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);overflow:hidden;}
  .card-header{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--border-light);}
  .card-header svg{width:15px;height:15px;color:var(--text);}
  .card-header h3{font-size:13.5px;font-weight:700;margin:0;}
  .card-badge{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--text-faint);}
  .card-body{padding:20px;}

  /* ---------- motion ---------- */
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  @keyframes popIn{ from{opacity:0;transform:scale(.92);} to{opacity:1;transform:scale(1);} }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .anim-in{animation:fadeUp .5s cubic-bezier(.16,.8,.3,1) both;}
  .positions-grid .position-card, .candidate-list .candidate-row{animation:fadeUp .4s cubic-bezier(.16,.8,.3,1) both;}
  .position-card, .stat-card, .card, .side-card{transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .position-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);}
  .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);}
  .candidate-row{transition:background .15s ease, padding-left .15s ease;}
  .candidate-row:hover{padding-left:24px;background:var(--surface-sunken);}
  .btn-new, .btn-primary{transition:transform .12s ease, background .15s ease;}
  .btn-new:hover, .btn-primary:hover{transform:translateY(-1px);}
  .score-fill, .funnel-fill, .comp-seg-1, .comp-seg-2, .comp-seg-3{transition:width 1s cubic-bezier(.16,.8,.3,1);}
  .filter-panel.open{animation:popIn .16s ease both;}

  /* ---------- api-key modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(23,23,26,0.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .modal-overlay.show{opacity:1;pointer-events:auto;}
  .modal-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--r-lg);padding:34px 32px;width:100%;max-width:400px;text-align:center;position:relative;
    transform:scale(.96);transition:transform .2s ease;
    box-shadow:var(--shadow-lift);
  }
  .modal-overlay.show .modal-card{transform:scale(1);}
  .modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-faint);padding:6px;border-radius:8px;}
  .modal-close:hover{background:var(--accent-soft);color:var(--text);}
  .modal-close svg{width:16px;height:16px;}
  .modal-icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;background:var(--tint);color:var(--text);border:1px solid var(--border);}

  /* ---------- toasts ---------- */
  /* ---------- offline banner ---------- */
  .offline-banner{display:none;position:fixed;top:calc(env(safe-area-inset-top, 0px) + 14px);left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100vw - 28px);z-index:150;align-items:center;gap:10px;background:var(--surface);color:var(--text);border:1px solid var(--amber-border);border-radius:18px;box-shadow:var(--shadow-lift);padding:9px 16px 9px 10px;font-size:13px;font-weight:500;line-height:1.35;pointer-events:none;}
  .offline-banner.show{display:flex;animation:offlineIn .28s cubic-bezier(.16,.8,.3,1) both;}
  .offline-banner strong{font-weight:700;}
  .offline-icon{width:28px;height:28px;border-radius:999px;background:var(--amber-bg);color:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
  @keyframes offlineIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}

  .toast-stack{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column-reverse;gap:8px;align-items:center;pointer-events:none;}
  .toast{display:flex;align-items:center;gap:8px;background:var(--text);color:var(--on-ink);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:0 16px 32px -10px rgba(23,23,26,.4);pointer-events:auto;animation:toastIn .25s cubic-bezier(.16,.8,.3,1) both;max-width:min(420px, 80vw);}
  .toast svg{width:15px;height:15px;flex-shrink:0;}
  .toast.leaving{animation:toastOut .2s ease both;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.98);}}
  .modal-icon svg{width:20px;height:20px;}
  .modal-card h2{font-size:18px;margin:0 0 10px;font-weight:700;letter-spacing:-0.01em;}
  .modal-card p{font-size:13.5px;color:var(--text-muted);line-height:1.6;margin:0 0 24px;}
  .modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- match ring ---------- */
  .match-ring-card{display:flex;align-items:center;gap:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:20px 24px;margin-bottom:20px;flex-wrap:wrap;}
  .match-ring{position:relative;width:76px;height:76px;flex-shrink:0;}
  .match-ring svg{width:76px;height:76px;transform:rotate(-90deg);}
  .match-ring circle{fill:none;stroke-width:6;}
  .match-ring .track{stroke:var(--tint);}
  .match-ring .fill{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.16,.8,.3,1);}
  .match-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:700;}
  .ring-info{flex:1;min-width:200px;}
  .ring-info .ri-title{font-size:13.5px;font-weight:700;margin-bottom:6px;}
  .ring-info .ri-sub{font-size:13px;color:var(--text-muted);line-height:1.55;}
  .ring-info .ri-sub b{color:var(--text);font-weight:600;}
  .ring-chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .ring-chip{font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px;display:flex;align-items:center;gap:5px;}
  .ring-chip.ok{background:var(--emerald-bg);color:var(--emerald);border:1px solid var(--emerald-border);}
  .ring-chip.warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
  .ring-chip svg{width:10px;height:10px;}

  /* ================================================================
     OVERVIEW — bento dashboard
     Purpose-built for the employer's first glance: what needs action
     right now, who the strongest candidate is, how the org-wide
     funnel is moving, and whether any role has gone quiet. Reuses
     existing tokens (surface/border/shadow/mono/serif), the match-ring
     and funnel-row components verbatim, and the same four accent
     tints already used for position-card corner blooms so the page
     reads as one system rather than a bolted-on dashboard.
  ================================================================ */
  .ov-accent-blue{ --ov-accent:#B7CBE8; }
  .ov-accent-clay{ --ov-accent:#E7BFA8; }
  .ov-accent-sage{ --ov-accent:#C3D6BB; }
  .ov-accent-lilac{ --ov-accent:#DCC9E8; }

  .ov-hero-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;align-items:stretch;}

  .ov-hero{
    position:relative;overflow:hidden;background:var(--ink-surface);color:#fff;
    border-radius:var(--r-lg);box-shadow:var(--shadow-lift);padding:26px 28px;
    display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:190px;
  }
  .ov-hero::before{
    content:"";position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:999px;
    background:radial-gradient(circle, var(--hero-glow), transparent 70%);pointer-events:none;
  }
  .ov-hero-eyebrow{position:relative;z-index:1;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.6);}
  .ov-hero-eyebrow svg{width:13px;height:13px;color:#fff;}
  .ov-hero-num{position:relative;z-index:1;font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-0.02em;line-height:1;}
  .ov-hero-num span{font-size:18px;font-weight:600;color:rgba(255,255,255,.55);margin-left:2px;}
  .ov-hero-label{position:relative;z-index:1;font-size:14px;color:rgba(255,255,255,.82);margin-top:6px;line-height:1.5;max-width:360px;}
  .ov-hero-bottom{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .ov-hero-flags{display:flex;gap:6px;flex-wrap:wrap;}
  .ov-hero-flag{font-size:11px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 11px;}
  .ov-hero-cta{
    display:inline-flex;align-items:center;gap:6px;background:#fff;color:#17171A;border:none;
    border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:700;flex-shrink:0;
  }
  .ov-hero-cta:hover{background:#EDEDED;}
  .ov-hero-cta svg{width:14px;height:14px;}
  .ov-hero-empty{position:relative;z-index:1;font-size:14px;color:rgba(255,255,255,.75);line-height:1.55;max-width:320px;}

  .ov-spotlight{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:20px 22px;display:flex;flex-direction:column;}
  .ov-spotlight-top{display:flex;align-items:center;gap:16px;}
  .ov-spotlight-list{margin-top:14px;padding-top:14px;border-top:1px solid var(--border-light);display:flex;flex-direction:column;gap:2px;flex:1;}
  .ov-runner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:7px 4px;border-radius:10px;transition:background .15s ease;}
  .ov-runner:hover{background:var(--surface-sunken);}
  .ov-runner .avatar{width:26px;height:26px;font-size:10px;background:var(--tint);color:var(--text);border:1px solid var(--border);flex-shrink:0;}
  .ov-runner-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ov-runner-pos{font-size:11px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ov-runner .match-badge{margin-left:auto;flex-shrink:0;font-size:11px;padding:3px 8px;}
  .ov-spotlight-empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--text-muted);padding:20px 8px;}

  .ov-funnel-card{margin-bottom:16px;}
  .ov-funnel-body{padding:18px 20px 20px;}
  .ov-funnel-rate{font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--emerald-bg);color:var(--emerald);border:1px solid var(--emerald-border);border-radius:999px;padding:4px 10px;margin-left:auto;}

  .ov-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .ov-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:18px;text-align:left;width:100%;display:flex;flex-direction:column;gap:14px;}
  .ov-tile-icon{width:34px;height:34px;border-radius:10px;background:var(--ov-accent, var(--tint));display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;}
  .ov-tile-icon i{font-size:16px;}
  .ov-tile-num{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-0.02em;}
  .ov-tile-label{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .ov-tile-sub{font-size:11px;color:var(--text-faint);margin-top:3px;}

  .ov-secondary-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:stretch;}

  .ov-insight{
    position:relative;overflow:hidden;border-radius:var(--r-lg);box-shadow:var(--shadow-card);
    background:linear-gradient(165deg, color-mix(in srgb, var(--ov-accent, #B7CBE8) 32%, var(--surface)), var(--surface) 72%);
    border:1px solid var(--border-light);padding:22px 24px;display:flex;flex-direction:column;justify-content:center;
  }
  .ov-insight-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:10px;}
  .ov-insight-headline{font-family:var(--serif-display);font-size:21px;font-weight:600;letter-spacing:-0.01em;line-height:1.3;margin-bottom:8px;}
  .ov-insight-headline b{font-style:italic;font-family:var(--serif-italic);font-weight:400;}
  .ov-insight-sub{font-size:13px;color:var(--text-muted);line-height:1.55;max-width:340px;}

  .ov-attention{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column;}
  .ov-attention .card-header{justify-content:space-between;}
  .ov-attention-count{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);border-radius:999px;padding:3px 9px;}
  .ov-attention-list{flex:1;}
  .ov-attention-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:12px 20px;border-bottom:1px solid var(--border-light);}
  .ov-attention-row:last-child{border-bottom:none;}
  .ov-attention-row:hover{background:var(--surface-sunken);}
  .ov-attention-title{font-size:13px;font-weight:600;}
  .ov-attention-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .ov-attention-tag{margin-left:auto;flex-shrink:0;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);border-radius:999px;padding:3px 8px;}
  .ov-attention-row svg{flex-shrink:0;color:var(--text-faint);width:14px;height:14px;}
  .ov-attention-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px 24px;}
  .ov-attention-empty svg{width:22px;height:22px;color:var(--emerald);}
  .ov-attention-empty p{font-size:13px;color:var(--text-muted);margin:0;max-width:260px;line-height:1.5;}

  /* ---------- positions dashboard ---------- */
  .positions-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .positions-header h2{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .btn-new{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);border:none;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:600;}
  .btn-new-position{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;background:var(--emerald-bg);color:var(--emerald);border:1px solid var(--emerald-border);border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:600;}
  .btn-new-position svg{color:var(--emerald);}
  .btn-new:hover{background:var(--accent-hover);}
  .btn-new svg{width:15px;height:15px;}
  .positions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .position-card{
    background:var(--surface);border:1px solid var(--border-light);border-radius:16px;
    box-shadow:var(--shadow-card);padding:0;overflow:hidden;position:relative;text-align:left;
  }
  .position-card-top{position:relative;z-index:1;padding:16px 14px 0;margin-bottom:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .position-title{font-family:var(--serif-display);font-size:17px;font-weight:600;letter-spacing:-.01em;padding-right:12px;}
  .position-loc{position:relative;z-index:1;padding:0 14px;font-size:12px;color:var(--text-faint);margin-bottom:12px;}
  .position-stats-row{position:relative;z-index:1;display:flex;padding:10px 14px 0;margin:0 0 10px;gap:6px;border-top:1px solid var(--border-light);}
  .position-stats-row .position-stat{flex:1;min-width:0;}
  .position-stat .v{font-family:var(--serif-display);font-size:14px;font-weight:600;}
  .position-stat .l{font-size:10px;color:var(--text-muted);}
  .position-chips-preview{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 16px;margin-bottom:0;}
  .status-badge{font-size:10px;font-weight:700;border-radius:999px;padding:3px 9px;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;}
  .status-open{background:var(--emerald-bg);color:var(--emerald);border:1px solid var(--emerald-border);}
  .status-paused{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
  .status-closed{background:var(--tint);color:var(--text-muted);border:1px solid var(--border);}

  /* ---------- position detail ---------- */
  .back-btn{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-muted);background:none;border:none;margin-bottom:18px;padding:0;}
  .back-btn:hover{color:var(--text);}
  .back-btn svg{width:15px;height:15px;}
  .pos-detail-header{margin-bottom:20px;}
  .pos-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pos-title-row h2{font-size:22px;margin:0;}
  .pos-loc-line{font-size:13px;color:var(--text-faint);margin-top:4px;}

  /* ---------- position actions menu ---------- */
  .pos-actions-wrap{position:relative;flex-shrink:0;}
  .pos-actions-btn{width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;}
  .pos-actions-btn svg{width:16px;height:16px;}
  .pos-actions-btn:hover{background:var(--accent-soft);color:var(--text);}
  .pos-actions-panel{position:absolute;right:0;top:calc(100% + 6px);width:220px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 24px 44px -20px rgba(23,23,26,0.28);z-index:30;padding:6px;display:none;}
  .pos-actions-panel.open{display:block;animation:popIn .16s ease both;}
  .pos-actions-label{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px;}
  .pos-actions-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;font-size:13px;font-weight:500;color:var(--text);background:none;border:none;border-radius:var(--r-sm);padding:8px 10px;}
  .pos-actions-item:hover{background:var(--accent-soft);}
  .pos-actions-item.active{font-weight:700;}
  .pos-actions-item svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}
  .pos-actions-item-label{display:flex;align-items:center;gap:8px;}
  .pos-actions-divider{height:1px;background:var(--border-light);margin:5px 4px;}
  .pos-actions-readonly{font-size:11px;color:var(--text-faint);padding:4px 10px 2px;}

  /* ---------- ending-date badge ---------- */
  .pos-end-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--text-muted);}
  .pos-end-badge svg{width:12px;height:12px;}
  .pos-end-badge.tone-soon{background:var(--amber-bg);color:var(--amber);}
  .pos-end-badge.tone-closed{background:var(--tint);color:var(--text-faint);}
  .jd-chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 8px;}
  .jd-chip{font-size:12px;font-weight:500;background:var(--tint);border:1px solid var(--border);border-radius:999px;padding:5px 12px;}
  .jd-toggle{font-size:13px;color:var(--text-muted);background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:2px;}
  .jd-full{margin-top:12px;font-size:14px;color:var(--text-muted);line-height:1.65;background:var(--tint);border-radius:var(--r-sm);padding:14px 16px;display:none;max-width:760px;}
  .jd-full.open{display:block;}

  .pos-lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .funnel-row:last-child{margin-bottom:0;}
  .funnel-label{width:100px;font-size:12px;color:var(--text-muted);flex-shrink:0;}
  .funnel-track{flex:1;background:var(--tint);border-radius:var(--r-sm);height:26px;position:relative;overflow:hidden;}
  .funnel-fill{background:var(--accent);height:100%;border-radius:var(--r-sm);display:flex;align-items:center;padding-left:10px;min-width:2px;}
  .funnel-fill span{color:var(--on-accent);font-family:var(--mono);font-size:12px;font-weight:600;}

  .team-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .team-member{display:flex;align-items:center;gap:10px;}
  .team-avatar{width:32px;height:32px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .team-name-block{flex:1;min-width:0;}
  .team-name{font-size:13px;font-weight:600;}
  .team-role{font-size:11px;color:var(--text-muted);}
  .team-remove{border:none;background:none;color:var(--text-faint);display:flex;padding:4px;border-radius:var(--r-sm);flex-shrink:0;}
  .team-remove:hover{background:var(--accent-soft);color:var(--text);}
  .team-remove svg{width:14px;height:14px;}
  .btn-add-team{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-muted);background:none;border:1px dashed var(--border);border-radius:var(--r-sm);padding:8px 12px;width:100%;justify-content:center;}
  .btn-add-team:hover{border-color:var(--border-strong);color:var(--text);}
  .btn-add-team svg{width:14px;height:14px;}
  .team-invite-form{display:none;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .team-invite-form.open{display:flex;}
  .team-invite-form input,.team-invite-form select{border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 8px;font-size:13px;outline:none;}
  .team-invite-form input{flex:1;min-width:0;}
  .team-invite-form select{color:var(--text);}
  .team-invite-form .btn-primary{width:auto;flex-shrink:0;padding:7px 14px;}

  /* ---------- role select (Admin/Recruiter/Viewer popup) ---------- */
  .role-select{position:relative;flex-shrink:0;}
  .role-select-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 8px;font-size:13px;color:var(--text);background:var(--surface);min-width:112px;}
  .role-select-btn:hover{border-color:var(--border-strong);}
  .role-select-btn svg{width:13px;height:13px;color:var(--text-faint);flex-shrink:0;}
  .role-select-panel{position:absolute;left:0;top:calc(100% + 6px);width:150px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 24px 44px -20px rgba(23,23,26,0.28);z-index:30;padding:6px;display:none;}
  .role-select-panel.open{display:block;animation:popIn .16s ease both;}
  .role-select-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;font-size:13px;font-weight:500;color:var(--text);background:none;border:none;border-radius:var(--r-sm);padding:8px 10px;}
  .role-select-option:hover{background:var(--surface-sunken);}
  .role-select-option.active{background:var(--accent-soft);}
  .role-select-option svg{width:13px;height:13px;color:var(--text);flex-shrink:0;}
  /* .card clips overflow for rounded corners, which was cutting off this dropdown's
     options below the card edge. Only relax that clip while the dropdown is open. */
  .card:has(.role-select-panel.open){overflow:visible;position:relative;z-index:40;} /* keeps the open dropdown above the Search candidates bar below */

  /* ---------- shared form fields ---------- */
  .form-field{margin-bottom:16px;}
  .form-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .form-field input[type="text"], .form-field input[type="password"], .form-field textarea, .form-field select{
    width:100%;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-family:inherit;color:var(--text);outline:none;background:var(--surface);transition:border-color .15s ease, box-shadow .15s ease;
  }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus{border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--accent-soft);}
  .form-field textarea{resize:vertical;min-height:130px;line-height:1.6;}
  .form-hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;line-height:1.5;}
  .form-hint a{color:var(--text-muted);text-decoration:underline;text-underline-offset:2px;}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:640px){ .form-row-2{grid-template-columns:1fr;} }

  /* ---------- custom form select (e.g. Employment type) ---------- */
  .np-select-wrap{position:relative;}
  .np-select-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--surface);transition:border-color .15s ease, box-shadow .15s ease;}
  .np-select-btn:hover{border-color:var(--text-faint);}
  .np-select-btn.open{border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--accent-soft);}
  .np-select-btn svg{width:14px;height:14px;color:var(--text-faint);flex-shrink:0;}
  .np-select-panel{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 24px 44px -20px rgba(23,23,26,0.28);z-index:30;padding:6px;display:none;}
  .np-select-panel.open{display:block;animation:popIn .16s ease both;}
  .np-select-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;font-size:13.5px;font-weight:500;color:var(--text);background:none;border:none;border-radius:var(--r-sm);padding:9px 10px;}
  .np-select-option:hover{background:var(--surface-sunken);}
  .np-select-option.active{background:var(--accent-soft);}
  .np-select-option svg{width:14px;height:14px;color:var(--text);flex-shrink:0;}
  .card:has(.np-select-panel.open){overflow:visible;}

  .tag-input-box{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:7px 9px;align-items:center;transition:border-color .15s ease, box-shadow .15s ease;}
  .tag-input-box:focus-within{border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--accent-soft);}
  .tag-input-box input{border:none !important;outline:none;flex:1;min-width:140px;font-size:13.5px;padding:5px 4px !important;font-family:inherit;box-shadow:none !important;}
  .tag-chip{display:flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--border);border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:500;flex-shrink:0;}
  .tag-chip button{background:none;border:none;width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);flex-shrink:0;}
  .tag-chip button svg{width:10px;height:10px;}
  .tag-chip button:hover{background:var(--border);color:var(--text);}

  /* ---------- new position layout ---------- */
  .new-pos-shell{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start;margin-bottom:20px;}
  @media (max-width:900px){ .new-pos-shell{grid-template-columns:1fr;} }
  .np-preview-title{font-size:15px;font-weight:700;margin-bottom:4px;}
  .np-preview-loc{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;}
  .np-preview-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .side-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:20px;margin-bottom:16px;}
  .side-card h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono);color:var(--text-faint);margin:0 0 14px;}
  .side-note{font-size:12.5px;line-height:1.6;color:var(--text-muted);}
  .side-note b{color:var(--text);font-weight:600;}
  .submit-row-flat{display:flex;justify-content:flex-end;gap:10px;padding-top:4px;flex-wrap:wrap;}
  .btn-outline-dash{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:600;transition:border-color .15s ease, background .15s ease, transform .12s ease;}
  .btn-outline-dash:hover{border-color:var(--border-strong);background:var(--accent-soft);transform:translateY(-1px);}
  .btn-outline-dash.danger{color:var(--amber);border-color:var(--amber-border);}
  .btn-outline-dash.danger:hover{background:var(--amber-bg);}

  /* ---------- apply-link share screen ---------- */
  .link-share-wrap{max-width:520px;margin:48px auto 0;text-align:center;}
  .link-share-icon{width:44px;height:44px;border-radius:999px;background:transparent;border:1px solid var(--emerald-border);color:var(--emerald);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;}
  .link-share-icon svg{width:20px;height:20px;}
  .link-share-wrap h2{font-size:24px;font-weight:600;letter-spacing:-0.02em;margin:0 0 10px;}
  .link-share-wrap p{font-size:14px;color:var(--text-muted);margin:0 auto 36px;line-height:1.7;max-width:430px;text-wrap:balance;}
  .link-share-wrap p b{font-weight:600;color:var(--text);}
  .link-share-wrap .card{text-align:left;}
  .link-share-wrap .card.link-share-summary{margin:0 0 20px;border:1px solid var(--border-light);border-radius:18px;box-shadow:none;}
  .link-share-summary .card-body{padding:22px 24px;}
  .link-share-summary-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px;}
  .link-share-summary-title{font-size:16px;font-weight:600;letter-spacing:-0.01em;color:var(--text);}
  .link-share-summary .pos-loc-line{font-size:13px;color:var(--text-muted);margin-top:4px;}
  .link-share-summary .jd-chips{margin-top:14px;}
  .link-share-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border-light);border-radius:14px;box-shadow:none;padding:4px 6px 4px 16px;margin-bottom:14px;}
  .link-share-box input{flex:1;border:none;background:none;outline:none;font-family:var(--mono);font-size:12.5px;color:var(--text-muted);min-width:0;}
  .link-share-box .btn-copy{background:none;color:var(--text);border-radius:10px;padding:8px 12px;font-weight:500;}
  .link-share-box .btn-copy:hover{background:var(--tint);}
  .link-share-box .btn-copy.copied{background:none;color:var(--emerald);}
  .btn-copy{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;flex-shrink:0;background:var(--accent);color:var(--on-accent);border:none;border-radius:calc(var(--r-md) - 4px);padding:9px 16px;font-size:13px;font-weight:600;transition:background .15s ease;}
  .btn-copy:hover{background:var(--accent-hover);}
  .btn-copy.copied{background:var(--emerald);}
  .link-share-note{font-size:12px;color:var(--text-faint);margin-bottom:40px;}
  .link-share-actions{display:inline-flex;align-items:flex-start;justify-content:center;gap:4px;max-width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--border-light);border-radius:999px;box-shadow:var(--shadow-card);}
  .ls-action{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px;padding:9px 14px;background:none;border:none;border-radius:999px;color:var(--text-muted);font-size:12px;font-weight:500;transition:color .15s ease, background .15s ease;}
  .ls-action:hover{color:var(--text);background:var(--tint);}
  .ls-action.copied{color:var(--emerald);}
  .ls-action-icon{display:flex;}
  .ls-action-icon svg{width:20px;height:20px;}
  @media (max-width:860px){ .link-share-wrap{margin-top:26px;} }
  @media (max-width:420px){ .ls-action{min-width:72px;padding:9px 10px;} }


  .copy-link-pill{position:relative;overflow:hidden;display:flex;align-items:center;gap:7px;background:var(--tint);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:500;color:var(--text-muted);transition:border-color .15s ease,background .15s ease;}
  .copy-link-pill:hover{border-color:var(--border-strong);background:var(--surface);}
  .copy-link-pill svg{width:14px;height:14px;flex-shrink:0;}
  .copy-link-pill.copied{color:var(--emerald);border-color:var(--emerald-border);background:var(--emerald-bg);}

  /* ---------- toolbar + candidate list ---------- */
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;position:relative;flex-wrap:wrap;}
  .topn-wrap{position:relative;}
  .topn-btn{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;font-size:14px;color:var(--text-muted);}
  .topn-btn:hover{border-color:var(--border-strong);}
  .topn-btn b{font-weight:500;color:var(--text);}
  .topn-btn svg{width:14px;height:14px;color:var(--text-faint);}
  .topn-panel{position:absolute;left:0;top:calc(100% + 8px);width:190px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 24px 44px -20px rgba(23,23,26,0.28);z-index:30;padding:6px;display:none;}
  .topn-panel.open{display:block;animation:popIn .16s ease both;}
  .topn-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;font-size:13.5px;font-weight:500;color:var(--text);background:none;border:none;border-radius:var(--r-sm);padding:9px 10px;}
  .topn-option:hover{background:var(--surface-sunken);}
  .topn-option.active{background:var(--accent-soft);}
  .topn-option svg{width:14px;height:14px;color:var(--text);flex-shrink:0;}
  .search-wrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;flex:1;min-width:160px;}
  .search-wrap svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}
  .search-wrap input{border:none;background:transparent;font-size:14px;outline:none;width:100%;}
  .search-wrap input::placeholder{color:var(--text-faint);}
  .filter-btn-wrap{position:relative;}
  .filter-btn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;}
  .filter-btn:hover{border-color:var(--border-strong);}
  .filter-btn svg{width:14px;height:14px;}
  .filter-count{background:var(--accent);color:var(--on-accent);font-size:11px;border-radius:999px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;}

  .filter-panel{position:absolute;right:0;top:calc(100% + 8px);width:320px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 24px 44px -20px rgba(23,23,26,0.28);z-index:30;padding:16px;display:none;}
  .filter-panel.open{display:block;}
  .filter-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .filter-panel-header span{font-size:14px;font-weight:600;}
  .filter-panel-header button{border:none;background:none;color:var(--text-faint);display:flex;}
  .filter-section{margin-bottom:16px;}
  .filter-section-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .tech-pills{display:flex;flex-wrap:wrap;gap:6px;}
  .tech-pill{font-size:12px;font-weight:500;border-radius:999px;padding:5px 10px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);}
  .tech-pill.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
  .slider-row{margin-bottom:12px;}
  .slider-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:4px;}
  .slider-label span:last-child{font-family:var(--mono);}
  input[type="range"]{width:100%;accent-color:var(--text);}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;cursor:pointer;}

  /* ---------- notification preferences (toggle switches) ---------- */
  .notif-pref-list{max-width:480px;margin-bottom:18px;}
  .notif-pref-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border-light);cursor:pointer;}
  .notif-pref-row:last-child{border-bottom:none;}
  .notif-pref-title{font-size:13.5px;font-weight:600;color:var(--text);}
  .notif-pref-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .toggle-switch{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--border);position:relative;flex-shrink:0;cursor:pointer;transition:background .2s ease;}
  .toggle-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s ease;}
  .toggle-switch:checked{background:var(--accent);}
  .toggle-switch:checked::after{transform:translateX(16px);}
  .filter-actions{display:flex;gap:8px;}
  .btn-primary{flex:1;font-size:14px;font-weight:500;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--r-sm);padding:8px;}
  .btn-ghost{font-size:14px;font-weight:500;color:var(--text-muted);background:none;border:none;border-radius:var(--r-sm);padding:8px 12px;}
  .active-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .chip{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;background:var(--tint);color:var(--text);border-radius:999px;padding:5px 6px 5px 10px;}
  .chip button{border:none;background:none;color:var(--text-faint);display:flex;padding:0;}
  .chip svg{width:11px;height:11px;}

  .candidate-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);overflow:hidden;}
  .cand-empty{text-align:center;padding:56px 30px;}
  .cand-empty-icon{width:44px;height:44px;border-radius:999px;background:var(--tint);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--text-faint);}
  .cand-empty-icon svg{width:20px;height:20px;}
  .load-error-icon{width:44px;height:44px;border-radius:999px;background:var(--tint);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--text-faint);font-size:21px;}
  .load-error-title{font-size:18px;font-weight:600;margin:0 0 20px;color:var(--text);}
  .cand-empty h4{font-size:15px;margin:0 0 6px;color:var(--text);}
  .cand-empty p{font-size:13px;color:var(--text-muted);margin:0 0 18px;max-width:340px;margin-left:auto;margin-right:auto;line-height:1.5;}

  /* ---------- candidate list: pagination ---------- */
  .cand-group-header{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface-sunken);border-bottom:1px solid var(--border-light);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-muted);}
  .cand-group-match{color:var(--emerald);background:var(--emerald-bg);border-bottom-color:var(--emerald-border);}
  .cand-group-count{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--border);color:var(--text);}
  .cand-group-hint{margin-left:auto;font-weight:500;color:var(--text-faint);}
  .cand-group-none{justify-content:space-between;flex-wrap:wrap;font-weight:500;background:var(--amber-bg);color:var(--amber);border-bottom-color:var(--amber-border);}
  .candidate-row.is-other{opacity:.72;}
  .candidate-row.is-other:hover{opacity:1;}
  .cand-pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-top:1px solid var(--border-light);flex-wrap:wrap;}
  .cand-pagination-count{font-size:12.5px;color:var(--text-muted);}
  .cand-pagination-controls{display:flex;align-items:center;gap:14px;}
  .cand-pagination-current{font-size:12.5px;color:var(--text-muted);}
  .cand-page-btn{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--text);background:var(--surface-sunken);border:1px solid var(--border-light);border-radius:999px;padding:7px 14px;transition:background .15s ease,opacity .15s ease;}
  .cand-page-btn svg{width:13px;height:13px;}
  .cand-page-btn:hover:not(:disabled){background:var(--accent-soft);}
  .cand-page-btn:disabled{opacity:.4;cursor:default;}
  .candidate-row{width:100%;display:flex;align-items:center;gap:16px;padding:16px 20px;border:none;background:none;border-bottom:1px solid var(--border-light);text-align:left;}
  .candidate-row:last-child{border-bottom:none;}
  .rank-num{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--border-strong);width:24px;text-align:center;flex-shrink:0;}
  .avatar{width:36px;height:36px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .avatar.lg{width:56px;height:56px;font-size:18px;}
  .cand-name-block{width:170px;flex-shrink:0;}
  .cand-name{font-size:14px;font-weight:600;}
  .cand-sub{font-size:12px;color:var(--text-muted);}
  .skills-block{display:flex;gap:6px;width:210px;flex-shrink:0;flex-wrap:wrap;}
  .comp-block{width:110px;flex-shrink:0;}
  .standout-text{flex:1;font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-chevron{width:16px;height:16px;color:var(--border-strong);flex-shrink:0;}

  /* ---------- candidate detail ---------- */
  .detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
  .detail-id{display:flex;align-items:center;gap:16px;}
  .detail-name-row{display:flex;align-items:center;gap:8px;}
  .detail-name-row h2{font-size:20px;font-weight:600;margin:0;}
  .rank-tag{font-family:var(--mono);font-size:12px;color:var(--text-faint);}
  .percentile-line{font-size:12px;color:var(--emerald);font-weight:600;margin-top:3px;}
  .detail-sub{font-size:14px;color:var(--text-muted);}
  .detail-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .btn-email{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--r-sm);padding:9px 14px;text-decoration:none;}
  .btn-phone{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 14px;}

  .detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
  .detail-col{display:flex;flex-direction:column;gap:20px;}

  .evidence-table td, .evidence-table th{padding:10px 8px;font-size:13px;text-align:left;border-bottom:1px solid var(--border-light);vertical-align:top;}
  .evidence-table th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);}
  .evidence-req{font-weight:600;width:30%;}
  .evidence-status{width:36px;}
  .evidence-status svg{width:16px;height:16px;}
  .evidence-status .yes{color:var(--emerald);}
  .evidence-status .no{color:var(--amber);}
  .evidence-note{color:var(--text-muted);}

  .exp-timeline{position:relative;padding-left:20px;}
  .exp-timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border);}
  .exp-item{position:relative;margin-bottom:22px;}
  .exp-item:last-child{margin-bottom:0;}
  .exp-item::before{content:"";position:absolute;left:-20px;top:3px;width:10px;height:10px;border-radius:999px;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);}
  .exp-role{font-size:14px;font-weight:600;}
  .exp-company{font-size:13px;color:var(--text-muted);}
  .exp-dates{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:1px;}
  .exp-stack{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0;}
  .exp-achievements{margin:6px 0 0;padding-left:16px;font-size:13px;color:var(--text-muted);}
  .exp-achievements li{margin-bottom:3px;}

  .score-bar-row{margin-bottom:16px;}
  .score-bar-row:last-child{margin-bottom:0;}
  .score-bar-top{display:flex;justify-content:space-between;margin-bottom:4px;}
  .score-bar-top .lab{font-size:14px;color:var(--text-muted);}
  .score-bar-top .val{font-family:var(--mono);font-size:14px;font-weight:600;}
  .score-bar-top .pct{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-left:6px;font-weight:400;}
  .score-track{height:6px;width:100%;background:var(--tint);border-radius:999px;overflow:hidden;}
  .score-fill{height:100%;background:var(--accent);border-radius:999px;}

  .gh-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .gh-stat-value{font-size:20px;font-weight:600;}
  .gh-stat-value.small{font-size:14px;display:flex;align-items:center;gap:4px;}
  .gh-stat-value svg{width:13px;height:13px;}
  .gh-stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .lang-legend{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;}
  .lang-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}
  .lang-dot{width:8px;height:8px;border-radius:999px;}
  .lang-legend-item .pct{font-family:var(--mono);}
  .shipped-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .shipped-item{display:flex;align-items:center;justify-content:space-between;font-size:14px;background:var(--tint);border-radius:var(--r-sm);padding:8px 12px;}
  .shipped-name{display:flex;align-items:center;gap:6px;font-weight:500;}
  .shipped-name svg{width:13px;height:13px;color:var(--emerald);}
  .shipped-url{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--text-faint);}
  .shipped-url svg{width:11px;height:11px;}

  .repo-table th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);text-align:left;padding:8px;border-bottom:1px solid var(--border);}
  .repo-table td{font-size:13px;padding:10px 8px;border-bottom:1px solid var(--border-light);vertical-align:middle;}
  .repo-name{font-weight:600;}
  .origin-badge{font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.02em;}
  .origin-original{background:var(--emerald-bg);color:var(--emerald);}
  .origin-fork{background:var(--tint);color:var(--text-muted);}
  .complexity-dots{display:flex;gap:2px;}
  .dot{width:6px;height:6px;border-radius:999px;background:var(--border);}
  .dot.filled{background:var(--accent);}

  .check-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light);}
  .check-row:last-child{border-bottom:none;}
  .check-row span{font-size:14px;}
  .check-row svg{width:16px;height:16px;}
  .check-yes{color:var(--emerald);}
  .check-no{color:var(--border-strong);}

  .flag-item{display:flex;gap:8px;font-size:14px;margin-bottom:10px;align-items:flex-start;}

  /* ---------- candidate: info & resources ---------- */
  .resource-resume-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface-sunken);border:1px solid var(--border-light);margin-bottom:16px;transition:background .15s ease,transform .15s ease,box-shadow .15s ease;}
  .resource-resume-btn:hover{background:var(--accent-soft);transform:translateY(-1px);box-shadow:var(--shadow-card);}
  .resource-resume-btn.disabled{opacity:.5;pointer-events:none;}
  .resource-resume-icon{width:36px;height:36px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;box-shadow:var(--shadow-card);}
  .resource-resume-icon svg{width:16px;height:16px;}
  .resource-resume-label{font-weight:700;font-size:14px;color:var(--text);}
  .resource-resume-hint{margin-left:auto;font-size:12px;color:var(--text-faint);}
  .resource-links-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .resource-link-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface-sunken);border:1px solid var(--border-light);font-size:12.5px;font-weight:600;color:var(--text);transition:background .15s ease,transform .15s ease;}
  .resource-link-chip svg{width:14px;height:14px;}
  .resource-link-chip:hover{background:var(--accent-soft);transform:translateY(-1px);}
  .resource-summary{display:flex;flex-direction:column;}
  .resource-summary-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-light);font-size:13px;}
  .resource-summary-row:last-child{border-bottom:none;}
  .resource-summary-row .l{color:var(--text-muted);flex-shrink:0;}
  .resource-summary-row .v{color:var(--text);font-weight:600;text-align:right;}

  /* ---------- candidate: notes ---------- */
  .note-composer{margin-bottom:18px;}
  .note-composer textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:13.5px;resize:vertical;min-height:70px;color:var(--text);transition:border-color .15s ease,box-shadow .15s ease;box-sizing:border-box;}
  .note-composer textarea:focus{outline:none;border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--accent-soft);}
  .note-composer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
  .note-readonly-hint{font-size:12.5px;color:var(--text-faint);background:var(--surface-sunken);border-radius:10px;padding:10px 14px;margin-bottom:16px;}
  .note-list{display:flex;flex-direction:column;gap:12px;}
  .note-empty{font-size:13px;color:var(--text-faint);text-align:center;padding:20px 0;}
  .note-card{background:var(--surface-sunken);border-radius:14px;padding:14px 16px;}
  .note-card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .note-avatar{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;}
  .note-author-block{flex:1;min-width:0;}
  .note-author-name{font-size:13px;font-weight:700;color:var(--text);}
  .note-author-role{font-size:11px;color:var(--text-muted);}
  .note-meta{font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .note-text{font-size:13.5px;color:var(--text);line-height:1.55;white-space:pre-wrap;}
  .note-actions{display:flex;gap:14px;margin-top:10px;}
  .note-action-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text-muted);background:none;border:none;padding:2px;transition:color .15s ease;}
  .note-action-btn svg{width:13px;height:13px;}
  .note-action-btn:hover{color:var(--text);}
  .note-edit-textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;resize:vertical;min-height:60px;color:var(--text);box-sizing:border-box;}
  .note-edit-textarea:focus{outline:none;border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--accent-soft);}
  .flag-item:last-child{margin-bottom:0;}
  .flag-item svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
  .flag-item.good svg{color:var(--emerald);}
  .flag-item.warn svg{color:var(--amber);}
  .flag-item span{color:var(--text-muted);}

  /* ---------- overview ---------- */
  .stat-breakdown{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .stat-breakdown span{font-size:11px;color:var(--text-muted);}
  .stat-breakdown b{color:var(--text);}
  .stat-card.clickable{cursor:pointer;}
  .activity-feed{display:flex;flex-direction:column;}
  .activity-row{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:14px;padding:13px 20px;border:none;background:none;border-bottom:1px solid var(--border-light);text-align:left;transition:background .15s ease;}
  .activity-row.unread{background:var(--tint);}
  .notif-dot{width:7px;height:7px;border-radius:999px;background:var(--text);flex-shrink:0;}
  .notif-mark-all{margin-left:auto;font-size:12px;font-weight:600;color:var(--text-muted);background:none;border:none;padding:4px 2px;transition:color .15s ease;}
  .notif-mark-all:hover{color:var(--text);text-decoration:underline;}
  .activity-row:last-child{border-bottom:none;}
  .activity-row:hover{background:var(--surface-sunken);}
  .activity-name{font-size:13.5px;font-weight:600;}
  .activity-meta{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .activity-tag{font-size:10.5px;font-weight:600;background:var(--tint);border-radius:999px;padding:2px 9px;color:var(--text-muted);}
  .activity-time{font-size:11.5px;color:var(--text-faint);flex-shrink:0;margin-left:auto;}
  .empty-inline{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13.5px;}

  /* ---------- help ---------- */
  .help-section-card{max-width:720px;margin:0 0 20px;}
  .help-search-body{padding:14px 20px;}
  .help-search-body .m-search-box{max-width:420px;}
  .help-search-box-lg{
    display:flex;align-items:center;gap:10px;max-width:420px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:0 16px;height:46px;transition:border-color .15s ease,box-shadow .15s ease;
  }
  .help-search-box-lg:focus-within{border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--accent-soft);}
  .help-search-box-lg i{color:var(--text-faint);font-size:16px;flex-shrink:0;}
  .help-search-box-lg input{border:none;outline:none;background:transparent;font-size:14px;width:100%;color:var(--text);font-family:var(--sans);}
  .help-search-box-lg input::placeholder{color:var(--text-faint);}
  .help-search-kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--text-faint);background:var(--surface-sunken);border:1px solid var(--border);border-radius:6px;padding:3px 7px;flex-shrink:0;}
  .help-search-popular{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .help-search-popular-label{font-size:12px;color:var(--text-faint);}
  .help-search-chip{font-size:12px;font-weight:600;color:var(--text-muted);background:var(--surface-sunken);border:1px solid var(--border-light);border-radius:999px;padding:6px 12px;transition:background .15s ease,color .15s ease,transform .15s ease;}
  .help-search-chip:hover{background:var(--accent-soft);color:var(--text);transform:translateY(-1px);}


  .org-reminder{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:16px;}
  .org-reminder-icon{width:38px;height:38px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .org-reminder-icon i{font-size:19px;line-height:1;}
  .org-reminder-text{flex:1;min-width:0;}
  .org-reminder-title{font-size:13.5px;font-weight:700;color:var(--text);letter-spacing:-0.01em;}
  .org-reminder-desc{font-size:12.5px;color:var(--text-muted);margin-top:2px;line-height:1.45;}
  .org-reminder-btn{flex-shrink:0;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--border);color:var(--text);white-space:nowrap;}
  .org-reminder-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  @media (max-width:640px){
    .org-reminder{flex-wrap:wrap;padding:14px 16px;}
    .org-reminder-btn{margin-left:52px;}
  }

  .help-check-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:14px 18px;border-bottom:1px solid var(--border-light);font-family:inherit;cursor:pointer;transition:background .15s ease;}
  .help-check-row:last-child{border-bottom:none;}
  .help-check-row:hover{background:var(--accent-soft);}
  .help-check-dot{width:22px;height:22px;border-radius:999px;border:1.5px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on-ink);transition:background .15s ease,border-color .15s ease;}
  .help-check-dot.done{background:var(--accent);border-color:var(--accent);}
  .help-check-dot svg{width:12px;height:12px;}
  .help-check-text{flex:1;min-width:0;}
  .help-check-title{font-size:13.5px;font-weight:500;color:var(--text);}
  .help-check-title.done{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .help-check-sub{font-size:12px;color:var(--text-faint);margin-top:1px;}
  .help-check-row .help-check-chevron{color:var(--text-faint);flex-shrink:0;display:flex;}
  .help-check-row .help-check-chevron svg{width:15px;height:15px;}

  .help-faq-row{width:100%;text-align:left;background:none;border:none;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border-light);cursor:pointer;font-family:inherit;transition:background .15s ease;}
  .help-faq-row:hover{background:var(--accent-soft);}
  .help-faq-q{flex:1;font-size:13.5px;font-weight:500;color:var(--text);line-height:1.4;}
  .help-faq-chevron{color:var(--text-faint);flex-shrink:0;display:flex;transition:transform .2s ease;}
  .help-faq-chevron svg{width:15px;height:15px;}
  .help-faq-row[aria-expanded="true"] .help-faq-chevron{transform:rotate(180deg);}
  .help-faq-a{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.16,.8,.3,1);border-bottom:1px solid var(--border-light);}
  .help-faq-a.open{max-height:400px;}
  .help-faq-row:last-of-type{border-bottom:none;}
  .help-faq-a:last-child{border-bottom:none;}
  .help-faq-a-inner{overflow:hidden;min-height:0;padding:0 18px 16px;font-size:13px;color:var(--text-muted);line-height:1.6;}

  /* ---------- help: guide grid ---------- */
  .help-topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 18px;}
  .help-topic-card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface-sunken);border:1px solid transparent;border-radius:14px;padding:14px;cursor:pointer;font-family:inherit;transition:background .15s ease,border-color .15s ease,transform .15s ease;}
  .help-topic-card:hover{transform:translateY(-1px);border-color:var(--border);}
  .help-topic-card.active{background:var(--accent-soft);border-color:var(--text-faint);}
  .help-topic-card-top{display:flex;align-items:center;justify-content:space-between;width:100%;}
  .help-topic-card-icon{width:30px;height:30px;border-radius:999px;background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-card);}
  .help-topic-card-icon svg{width:14px;height:14px;}
  .help-topic-card-title{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.35;}
  .help-topic-card-chevron{color:var(--text-faint);transition:transform .2s ease;display:flex;}
  .help-topic-card-chevron svg{width:13px;height:13px;}
  .help-topic-card.active .help-topic-card-chevron{transform:rotate(180deg);}
  .help-topic-detail{margin:0 18px 18px;padding:16px;border-radius:14px;background:var(--surface-sunken);border-top:3px solid var(--text);animation:fadeUp .25s cubic-bezier(.16,.8,.3,1) both;}
  .help-topic-detail-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;}
  .help-topic-detail-title svg{width:17px;height:17px;color:var(--text-muted);}
  .help-topic-detail-body{font-size:13px;color:var(--text-muted);line-height:1.6;}

  .help-empty-search{padding:26px 18px;text-align:center;font-size:13px;color:var(--text-faint);}

  .help-contact-row{display:flex;align-items:center;gap:12px;padding:16px 18px;flex-wrap:wrap;}
  .help-contact-icon{width:36px;height:36px;border-radius:999px;background:var(--tint);color:var(--text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .help-contact-icon svg{width:16px;height:16px;}
  .help-contact-text{flex:1;min-width:140px;}
  .help-contact-text h4{font-size:13.5px;margin:0 0 2px;}
  .help-contact-text p{font-size:12px;color:var(--text-faint);margin:0;}
  .help-contact-row .btn-outline-dash{padding:8px 16px;font-size:13px;flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center;}

  /* ---------- settings: desktop model picker ---------- */
  .model-select{width:100%;}
  .model-select-btn{width:100%;}
  .model-select-panel{width:100%;min-width:260px;max-height:320px;overflow-y:auto;}
  .model-select-group-label{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px;}
  .model-select-group-label:first-child{padding-top:4px;}

  /* ---------- settings ---------- */
  .settings-shell{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start;}
  @media (max-width:820px){ .settings-shell{grid-template-columns:1fr;} }
  .settings-nav{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:10px;}
  .settings-tab{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;color:var(--text-muted);background:none;border:none;text-align:left;width:100%;transition:background .15s ease,color .15s ease;}
  .settings-tab svg{width:15px;height:15px;flex-shrink:0;}
  .settings-tab:hover{background:var(--accent-soft);color:var(--accent-text);}
  .settings-tab.active{background:var(--accent);color:var(--on-accent);}
  .settings-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:28px 32px;}
  .settings-section-title{font-size:16px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .settings-section-sub{font-size:13px;color:var(--text-muted);margin:0 0 24px;line-height:1.55;max-width:520px;}
  .settings-section-sub a{color:var(--accent-text);text-decoration:underline;text-underline-offset:2px;}
  .settings-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 14px;height:42px;max-width:460px;margin-bottom:16px;transition:border-color .15s ease,box-shadow .15s ease;}
  .settings-search:focus-within{border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--accent-soft);}
  .settings-search i{color:var(--text-faint);font-size:16px;flex-shrink:0;}
  .settings-search input{border:none;outline:none;background:transparent;font-size:14px;width:100%;color:var(--text);font-family:var(--sans);}
  .settings-search input::placeholder{color:var(--text-faint);}
  .settings-tab-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .settings-tab-desc{font-size:11.5px;font-weight:400;line-height:1.35;color:var(--text-faint);}
  @media (min-width: 861px){
    .settings-tab-desc{ display:none; }            /* desktop: no tab descriptions (mobile/tablet rows keep theirs) */
    .settings-tab-desc.is-match{ display:block; }  /* ...but keep the "Matches: ..." hint while searching */
  }
  .settings-tab:hover .settings-tab-desc{color:var(--text-muted);}
  .settings-tab.active .settings-tab-desc, .settings-tab.active:hover .settings-tab-desc{color:rgba(255,255,255,.7);}
  .settings-search-empty{font-size:13px;color:var(--text-muted);padding:10px 12px;}
  .settings-tab[hidden], .m-settings-row[hidden], .settings-search-empty[hidden]{display:none !important;}
  .settings-divider{height:1px;background:var(--border);margin:28px 0;max-width:420px;}

  .api-key-active{background:var(--surface-sunken);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px;}
  .api-key-active-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .api-key-badge{width:38px;height:38px;border-radius:50%;background:var(--emerald-bg);color:var(--emerald);border:1px solid var(--emerald-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .api-key-badge svg{width:16px;height:16px;}
  .api-key-masked{font-family:var(--mono);font-size:13.5px;font-weight:700;}
  .api-key-model{font-size:12px;color:var(--text-muted);margin-top:2px;}

  /* ================================================================
     OVERVIEW — bento redesign (ov2- namespace)
     Three independent vertical columns on desktop, matching the
     reference layout exactly. On mobile the same card markup is
     re-rendered once more (see renderOverviewView) in the required
     stat-tiles -> best-match -> efficiency -> (rest) order and shown
     via the existing m-only/m-flex mobile toggle, while .ov2-desktop
     is hidden below the mobile breakpoint.
  ================================================================ */
  .ov2-desktop{ margin-bottom: 0; }
  .ov2-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:20px; align-items:start; }
  .ov2-col{ display:flex; flex-direction:column; gap:20px; min-width:0; }
  .ov2-mobile-stack{ display:none; flex-direction:column; gap:20px; }
